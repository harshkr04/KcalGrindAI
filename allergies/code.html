<style>
        .material-symbols-outlined {
          font-variation-settings:
          'FILL' 0,
          'wght' 400,
          'GRAD' 0,
          'opsz' 24;
        }

        .material-symbols-outlined.filled {
          font-variation-settings: 'FILL' 1;
        }

        /* Glassmorphism effects */
        .glass-surface {
            background: rgba(248, 250, 249, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(191, 201, 193, 0.3);
        }

        .chip-active {
            transform: scale(0.98);
        }

        .chip-transition {
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>

<body class="bg-surface text-on-surface h-full flex flex-col md:hidden antialiased font-body-lg">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-background/80 backdrop-blur-md flex items-center justify-between px-margin-mobile h-16 max-w-screen-xl mx-auto">
<button id="back-button" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface-variant hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<span class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed">Vitality</span>
<div class="w-10 h-10"></div> <!-- Spacer for centering -->
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col pt-24 pb-safe px-margin-mobile gap-stack-lg max-w-md mx-auto w-full relative z-10 overflow-y-auto hide-scrollbar">
<!-- Progress Indicator -->
<div class="flex flex-col gap-stack-sm pt-4">
<div class="flex justify-between items-center px-1">
<span class="font-label-lg text-label-lg text-on-surface-variant">Step 5 of 6</span>
<span class="font-label-lg text-label-lg text-primary">Allergies</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary rounded-full transition-all duration-500 ease-out" style="width: 83.33%;"></div>
</div>
</div>
<!-- Heading Section -->
<div class="flex flex-col gap-stack-sm pt-2">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface">Any foods we should avoid?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Select all that apply. This helps us filter your AI meal suggestions.</p>
</div>
<!-- Common Chips Section -->
<div class="flex flex-col gap-stack-md pt-2">
<h2 class="font-title-lg text-title-lg text-on-surface">Common Allergens</h2>
<div class="flex flex-wrap gap-3" id="chip-container">
<!-- Chips will be progressively enhanced by JS -->
<!-- Peanuts -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="peanuts" type="button">
                Peanuts
            </button>
<!-- Tree nuts -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="tree_nuts" type="button">
                Tree nuts
            </button>
<!-- Milk -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="milk" type="button">
                Milk
            </button>
<!-- Eggs -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="eggs" type="button">
                Eggs
            </button>
<!-- Soy -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="soy" type="button">
                Soy
            </button>
<!-- Wheat -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="wheat" type="button">
                Wheat
            </button>
<!-- Fish -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="fish" type="button">
                Fish
            </button>
<!-- Shellfish -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="shellfish" type="button">
                Shellfish
            </button>
<!-- Sesame -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none" data-value="sesame" type="button">
                Sesame
            </button>
<!-- Exclusive Options -->
<button class="allergy-chip chip-base chip-unselected border-2 rounded-full px-4 py-2 flex items-center gap-2 active:scale-[0.98] font-label-lg text-label-lg select-none mt-2 w-full justify-center md:w-auto md:justify-start" data-value="none" type="button">
                No known allergies
            </button>
</div>
</div>
<!-- Spacer to push button to bottom -->
<div class="flex-grow min-h-[80px]"></div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 w-full z-40 bg-gradient-to-t from-surface via-surface/90 to-transparent pt-12 pb-8 px-margin-mobile md:hidden pointer-events-none">
<div class="max-w-md mx-auto pointer-events-auto">
<button id="continue-button" class="w-full bg-primary text-on-primary font-label-lg text-label-lg py-4 rounded-full shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center gap-2">
                Continue
                <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
<!-- Background Decorative Element (Subtle Glass Aesthetic) -->
<div class="fixed top-[-10%] right-[-10%] w-64 h-64 rounded-full bg-primary-container/10 blur-3xl z-[-1] md:hidden pointer-events-none"></div>
<div class="fixed bottom-[10%] left-[-10%] w-72 h-72 rounded-full bg-secondary-container/10 blur-3xl z-[-1] md:hidden pointer-events-none"></div>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const chips = document.querySelectorAll('.allergy-chip');
            const continueButton = document.getElementById('continue-button');
            const noAllergiesChip = document.querySelector('[data-value="none"]');

            chips.forEach(chip => {
                chip.addEventListener('click', (e) => {
                    const isSelected = chip.classList.contains('chip-selected');
                    const isNone = chip.dataset.value === 'none';

                    if (isNone) {
                        // If clicking "No known allergies", deselect all others
                        if (!isSelected) {
                            chips.forEach(c => {
                                if (c.dataset.value !== 'none') {
                                    c.classList.remove('chip-selected');
                                    c.classList.add('chip-unselected');
                                }
                            });
                            chip.classList.remove('chip-unselected');
                            chip.classList.add('chip-selected');
                        } else {
                            chip.classList.remove('chip-selected');
                            chip.classList.add('chip-unselected');
                        }
                    } else {
                        // If clicking a specific allergen, turn off "No known allergies"
                        if (noAllergiesChip.classList.contains('chip-selected')) {
                            noAllergiesChip.classList.remove('chip-selected');
                            noAllergiesChip.classList.add('chip-unselected');
                        }

                        // Toggle current chip
                        if (isSelected) {
                            chip.classList.remove('chip-selected');
                            chip.classList.add('chip-unselected');
                        } else {
                            chip.classList.remove('chip-unselected');
                            chip.classList.add('chip-selected');
                        }
                    }

                    // Enable continue button if any option is selected
                    const hasSelection = Array.from(chips).some(c => c.classList.contains('chip-selected'));
                    continueButton.disabled = !hasSelection;

                    // Optional haptic feedback simulation
                    if (navigator.vibrate) {
                        navigator.vibrate(50);
                    }
                });
            });

            // Handle back button
            document.getElementById('back-button').addEventListener('click', () => {
                window.history.back();
            });

            // Handle continue button
            continueButton.addEventListener('click', () => {
                // Store selections in localStorage for persistence
                const selectedChips = Array.from(chips)
                    .filter(chip => chip.classList.contains('chip-selected'))
                    .map(chip => chip.dataset.value);

                if (selectedChips.length > 0) {
                    localStorage.setItem('selectedAllergies', JSON.stringify(selectedChips));
                    // Navigate to next screen (calorie target)
                    window.location.href = '../calorie_target/code.html';
                }
            });

            // Restore selections from localStorage on page load
            const savedAllergies = localStorage.getItem('selectedAllergies');
            if (savedAllergies) {
                try {
                    const selectedValues = JSON.parse(savedAllergies);
                    chips.forEach(chip => {
                        if (selectedValues.includes(chip.dataset.value)) {
                            chip.classList.remove('chip-unselected');
                            chip.classList.add('chip-selected');
                        } else {
                            chip.classList.remove('chip-selected');
                            chip.classList.add('chip-unselected');
                        }
                    });

                    // Enable continue button if there are saved selections
                    continueButton.disabled = selectedValues.length === 0;
                } catch (e) {
                    console.error('Failed to parse saved allergies:', e);
                }
            }
        });
</script>
</body></html>
