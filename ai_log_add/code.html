<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .ai-pulse {
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        @keyframes pulse-ring {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 85, 185, 0.4); }
            70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(74, 85, 185, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 85, 185, 0); }
        }
        .shimmer-text {
            background: linear-gradient(90deg, #191c1c 0%, #707973 50%, #191c1c 100%);
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: shimmer 2s linear infinite;
        }
        @keyframes shimmer {
            to { background-position: 200% center; }
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-md min-h-screen flex flex-col relative overflow-x-hidden">
<!-- TopAppBar -->
<header class="bg-surface/80 dark:bg-surface/80 backdrop-blur-xl fixed top-0 w-full z-50 border-b border-outline-variant/30 flex justify-between items-center px-margin-mobile md:px-margin-tablet py-stack-sm h-[64px]">
<div class="flex items-center gap-4">
<div class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">
<img class="w-full h-full object-cover" data-alt="A serene close-up portrait of a health-conscious individual, smiling softly in natural morning light. The background is a soft, blurred bright kitchen interior, reinforcing a positive, vital, and fresh aesthetic. Professional photography, sharp focus on the face." src="https://lh3.googleusercontent.com/aida-public/AB6AXuCgw3W8RfQA2utnlvBwDUEa7WfXLuCnxERYivEsKo_94oqs5dXOkQLpManBMcgarFGbUa_dOkbULbf3BbRvhT20K7d_9MO5PmAgGYGXvZSeXwaqSBFjyHmP21m-zGG2usO2lG6LIS8rlxaF9sW_mURL5u7DS9mIm2cHZ8BbLHEWCCO4cNybLAOPsKJ8XuN6JE3AlabdnL8QNMX1eXoWNtr7F0yrWjl7QKke3jvyTc5WUi0M7Nvo8Sel">
</div>
<h1 class="font-title-lg text-title-lg-mobile md:text-title-lg text-primary font-headline-lg-mobile md:font-headline-lg">Nutritional Vitality</h1>
</div>
<button class="w-12 h-12 flex items-center justify-center rounded-full hover:bg-surface-container-low/50 transition-colors text-primary">
<span class="material-symbols-outlined" data-icon="notifications">notifications</span>
</button>
</header>
<!-- Main Canvas -->
<main class="flex-1 pt-[80px] pb-[100px] px-margin-mobile md:px-margin-tablet max-w-[840px] mx-auto w-full flex flex-col gap-stack-lg relative">
<!-- Ambient Background Blob for Liquid Glass Effect -->
<div class="absolute top-1/4 left-1/2 -translate-x-1/2 w-96 h-96 bg-tertiary-container/20 rounded-full blur-3xl -z-10 mix-blend-multiply"></div>
<section class="flex flex-col gap-stack-sm text-center mt-stack-lg">
<h2 class="font-display-lg text-display-lg text-on-surface shimmer-text">Log Your Meal</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Describe, snap, or speak what you're having.</p>
</section>
<!-- Main Logging Interface -->
<div class="glass-panel rounded-3xl p-stack-md flex flex-col gap-stack-md shadow-lg relative overflow-hidden">
<!-- Active Input Area -->
<textarea class="w-full h-32 bg-transparent border-none resize-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline p-0" placeholder="e.g., 'Had a grilled chicken salad with olive oil dressing...'"></textarea>
<div class="flex justify-between items-end">
<div class="flex gap-2">
<button class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors border border-primary/20">
<span class="material-symbols-outlined">mic</span>
</button>
<button class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors border border-primary/20">
<span class="material-symbols-outlined">photo_camera</span>
</button>
</div>
<!-- Primary AI Action -->
<button class="bg-tertiary-container text-on-tertiary-container px-6 py-3 rounded-full flex items-center gap-2 font-label-lg text-label-lg shadow-md hover:bg-tertiary transition-colors ai-pulse">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
                    Analyze
                </button>
</div>
</div>
<!-- AI Processing Preview (Simulated State) -->
<div class="bg-surface-container-lowest rounded-xl p-stack-md flex flex-col gap-stack-sm border border-outline-variant/50 shadow-sm opacity-50 pointer-events-none transition-opacity duration-300" id="previewCard">
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined text-sm animate-spin">sync</span>
<span class="font-label-sm text-label-sm uppercase tracking-wider">Awaiting Input...</span>
</div>
<div class="flex gap-4">
<div class="w-20 h-20 rounded-lg bg-surface-container-high animate-pulse"></div>
<div class="flex-1 flex flex-col justify-center gap-2">
<div class="h-4 bg-surface-container-high rounded w-3/4 animate-pulse"></div>
<div class="h-4 bg-surface-container-high rounded w-1/2 animate-pulse"></div>
</div>
</div>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl md:rounded-none bg-surface shadow-[0_-4px_12px_rgba(0,0,0,0.05)] md:hidden">
<div class="flex justify-around items-center px-4 pb-safe pt-2 h-20">
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 px-4 py-1.5 rounded-full transition-colors">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm mt-1">Home</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 px-4 py-1.5 rounded-full transition-colors">
<span class="material-symbols-outlined">calendar_today</span>
<span class="font-label-sm text-label-sm mt-1">Diary</span>
</button>
<button class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1.5 transition-all scale-95 shadow-inner">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-sm text-label-sm mt-1 font-semibold">AI Log</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 px-4 py-1.5 rounded-full transition-colors">
<span class="material-symbols-outlined">analytics</span>
<span class="font-label-sm text-label-sm mt-1">Insights</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant hover:bg-surface-container-high/50 px-4 py-1.5 rounded-full transition-colors">
<span class="material-symbols-outlined">person</span>
<span class="font-label-sm text-label-sm mt-1">Profile</span>
</button>
</div>
</nav>
<script>
        // Simple interaction to simulate typing and updating the preview state
        const textarea = document.querySelector('textarea');
        const previewCard = document.getElementById('previewCard');

        textarea.addEventListener('input', (e) => {
            if (e.target.value.length > 5) {
                previewCard.classList.remove('opacity-50');
                previewCard.querySelector('.text-tertiary span:last-child').textContent = 'AI is analyzing...';
                // In a real app, this would trigger an actual API call and update the skeleton with real data
            } else {
                previewCard.classList.add('opacity-50');
                previewCard.querySelector('.text-tertiary span:last-child').textContent = 'Awaiting Input...';
            }
        });
    </script>
</body></html>
