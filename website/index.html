<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/sproutling/ic_sproutling_active.svg" />
    
    <!-- Primary Meta Tags -->
    <title>KcalGrind — Calorie & Nutrition Tracker for Android</title>
    <meta name="title" content="KcalGrind — Calorie & Nutrition Tracker for Android" />
    <meta name="description" content="Tracks calories and macros with food data from USDA and ICMR-NIN. Your food log is stored on your device and works offline." />
    <meta name="keywords" content="KcalGrind, calorie tracker, nutrition tracker, Android, USDA, ICMR-NIN, Sproutling, Health Connect, home-screen widgets" />
    <meta name="author" content="KcalGrind" />
    <meta name="theme-color" content="#121513" />
    <link rel="canonical" href="https://kcalgrind.app/" />

    <!-- Theme Initialization Script (Zero Flash) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('kcalgrind-theme');
          var isLight = saved === 'light' || (!saved && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches);
          if (isLight) {
            document.documentElement.classList.add('theme-light');
          } else {
            document.documentElement.classList.remove('theme-light');
          }
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://kcalgrind.app/" />
    <meta property="og:title" content="KcalGrind — Calorie & Nutrition Tracker for Android" />
    <meta property="og:description" content="Tracks calories and macros with food data from USDA and ICMR-NIN. Your food log is stored on your device and works offline." />
    <meta property="og:image" content="/assets/real_screenshots/home_dashboard.png" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kcalgrind.app/" />
    <meta property="twitter:title" content="KcalGrind — Calorie & Nutrition Tracker for Android" />
    <meta property="twitter:description" content="Tracks calories and macros with food data from USDA and ICMR-NIN. Your food log is stored on your device and works offline." />
    <meta property="twitter:image" content="/assets/real_screenshots/home_dashboard.png" />

    <!-- Google Fonts: Inter & Roboto Flex (400 and 500 weights only) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Roboto+Flex:opsz,wght@8..144,400;8..144,500&display=swap" rel="stylesheet" />
  </head>
  <body class="bg-[var(--v3-bg)] text-[var(--v3-text-primary)] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
