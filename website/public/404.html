<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found | KcalGrind</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #FAF9F6;
        color: #121614;
        font-family: 'Inter', -apple-system, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        text-align: center;
      }
      .card {
        background: #FFFFFF;
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 28px;
        padding: 48px 32px;
        max-width: 440px;
        margin: 20px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      }
      h1 {
        font-family: 'Plus Jakarta Sans', sans-serif;
        font-size: 32px;
        font-weight: 800;
        margin: 16px 0 8px;
        color: #111827;
      }
      p {
        color: #5A6660;
        font-size: 15px;
        line-height: 1.6;
        margin-bottom: 24px;
      }
      .btn {
        display: inline-block;
        background: #0F5238;
        color: #FFFFFF;
        font-weight: 600;
        font-size: 14px;
        padding: 12px 28px;
        border-radius: 9999px;
        text-decoration: none;
        transition: background 0.2s;
      }
      .btn:hover {
        background: #0B3D2A;
      }
      .badge {
        font-family: monospace;
        font-size: 12px;
        font-weight: 700;
        color: #10B981;
        background: rgba(16, 185, 129, 0.1);
        padding: 4px 12px;
        border-radius: 9999px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <span class="badge">Error 404</span>
      <h1>Page Not Found</h1>
      <p>The page you are looking for doesn't exist or has been moved. Let's get you back on track.</p>
      <a href="/" class="btn">Return to KcalGrind</a>
    </div>
  </body>
</html>
