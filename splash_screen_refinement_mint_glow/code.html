<style>
        /* Organic Liquid Fluid Animations */
        @keyframes float-center {
            0% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
            33% { transform: translate(-55%, -45%) scale(1.05) rotate(5deg); }
            66% { transform: translate(-45%, -55%) scale(0.95) rotate(-5deg); }
            100% { transform: translate(-50%, -50%) scale(1) rotate(0deg); }
        }

        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .animate-blob-center { 
            animation: float-center 20s ease-in-out infinite; 
            transform-origin: center center;
        }
        
        .animate-entrance {
            animation: fade-in-up 1.5s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;

        }
