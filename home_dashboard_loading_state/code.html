<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes shimmer {
            0% {
                background-position: -1000px 0;
            }
            100% {
                background-position: 1000px 0;
            }
        }

        .skeleton {
            background: linear-gradient(to right, theme('colors.surface-container-high') 8%, theme('colors.surface-container-highest') 18%, theme('colors.surface-container-high') 33%);
            background-size: 1000px 100%;
            animation: shimmer 2s infinite linear;
            border-radius: theme('borderRadius.lg');
        }
        
        .skeleton-glass {
            background: linear-gradient(to right, rgba(230, 233, 232, 0.4) 8%, rgba(225, 227, 226, 0.6) 18%, rgba(230, 233, 232, 0.4) 33%);
            background-size: 1000px 100%;
            animation: shimmer 2.5s infinite linear;
            backdrop-filter: blur(8px);
            border: 1px solid theme('colors.outline-variant');
        }

        @keyframes rotateSparkle {
            from { transform: rotate(0deg) scale(0.9); opacity: 0.8; }
            50% { transform: rotate(180deg) scale(1.1); opacity: 1; }
            to { transform: rotate(360deg) scale(0.9); opacity: 0.8; }
        }
        .animate-sparkle {
            animation: rotateSparkle 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        
        .loading-overlay {
            background: radial-gradient(circle at center, rgba(255,255,255,0.8) 0%, rgba(248, 250, 249, 0.95) 70%);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen font-body-md antialiased pb-24 selection:bg-primary-container selection:text-on-primary-container">
<!-- Loading Overlay for central message -->
<div class="fixed inset-0 z-[60] flex flex-col items-center justify-center loading-overlay pointer-events-none backdrop-blur-sm">

                auto_awesome
            </span>
<h2 class="font-title-lg text-title-lg text-on-surface mb-2">AI is personalizing your dashboard</h2>

</div>
</div>
<!-- TopAppBar Shell -->

<div class="w-8 h-8 rounded-full skeleton"></div>

</div>
<div class="w-8 h-8 rounded-full skeleton"></div>
</header>

<section class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<!-- Calorie Ring Loader - Spans 2 cols -->
<div class="col-span-2 row-span-2 bg-surface p-6 rounded-[2rem] border border-outline-variant/30 shadow-sm flex flex-col items-center justify-center min-h-[240px] relative overflow-hidden">
<!-- Outer Ring Skeleton -->
<div class="w-40 h-40 rounded-full border-[12px] border-surface-container-high relative">
<!-- Inner Ring track mask effect -->
<div class="absolute inset-0 rounded-full border-[12px] border-transparent skeleton-glass" style="margin: -12px;"></div>
</div>
<div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
<div class="w-16 h-8 skeleton mb-2"></div>
<div class="w-24 h-4 skeleton"></div>
</div>
</div>
<!-- Macro Loaders -->
<div class="col-span-1 bg-surface p-4 rounded-2xl border border-outline-variant/30 shadow-sm flex flex-col justify-between">

<div>
<div class="w-12 h-6 skeleton mb-1"></div>
<div class="w-16 h-3 skeleton"></div>
</div>
</div>
