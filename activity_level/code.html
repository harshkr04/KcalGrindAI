<body class="bg-background text-on-background h-full font-body-lg flex flex-col items-center">
<!-- Top AppBar (Linear/Transactional - Modified for Onboarding) -->
<header class="w-full flex items-center justify-between px-margin-mobile h-16 max-w-screen-md mx-auto z-50">
<button id="back-button" class="w-10 h-10 flex items-center justify-center rounded-full text-on-surface hover:bg-surface-variant/50 transition-colors active:scale-95">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<!-- Progress Indicator -->
<div class="flex items-center gap-2">
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<div class="h-1.5 w-8 rounded-full bg-primary"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<div class="h-1.5 w-8 rounded-full bg-surface-variant"></div>
<span class="ml-2 font-label-lg text-label-lg text-on-surface-variant">3/6</span>
</div>
<div class="w-10 h-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 w-full max-w-screen-md mx-auto px-margin-mobile py-stack-lg flex flex-col">
<div class="mb-stack-lg text-center md:text-left">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm">How active are you?</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">This helps us estimate your daily energy needs.</p>
</div>
<!-- Activity Selection List -->
<div aria-label="Activity Level" class="flex-1 flex flex-col gap-stack-md" role="radiogroup">
<!-- Option 1: Sedentary -->
<label class="relative flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group border border-outline-variant/30 hover:border-outline-variant/60" id="sedentary-option">
<input class="peer sr-only" name="activity_level" type="radio" value="sedentary">
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mr-4 group-hover:scale-105 transition-transform peer-checked:bg-primary peer-checked:text-on-primary shadow-sm shadow-primary/5">
<span class="material-symbols-outlined" data-icon="chair" style="font-variation-settings: 'FILL' 1;">chair</span>
</div>
<div class="flex-1">
<div class="font-title-lg text-title-lg text-on-surface peer-checked:text-primary-fixed-variant">Sedentary</div>
<div class="font-body-md text-body-md text-on-surface-variant">Little exercise</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary ml-4">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check">check</span>
</div>
</label>
<!-- Option 2: Lightly active -->
<label class="relative flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group border border-outline-variant/30 hover:border-outline-variant/60" id="lightly-active-option">
<input class="peer sr-only" name="activity_level" type="radio" value="lightly_active">
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mr-4 group-hover:scale-105 transition-transform peer-checked:bg-primary peer-checked:text-on-primary shadow-sm shadow-primary/5">
<span class="material-symbols-outlined" data-icon="directions_walk" style="font-variation-settings: 'FILL' 1;">directions_walk</span>
</div>
<div class="flex-1">
<div class="font-title-lg text-title-lg text-on-surface peer-checked:text-primary-fixed-variant">Lightly Active</div>
<div class="font-body-md text-body-md text-on-surface-variant">Light exercise 1–3 days/week</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary ml-4">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check">check</span>
</div>
</label>
<!-- Option 3: Moderately active -->
<label class="relative flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group border border-outline-variant/30 hover:border-outline-variant/60" id="moderately-active-option">
<input class="peer sr-only" name="activity_level" type="radio" value="moderately_active">
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mr-4 group-hover:scale-105 transition-transform peer-checked:bg-primary peer-checked:text-on-primary shadow-sm shadow-primary/5">
<span class="material-symbols-outlined" data-icon="fitness_center" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div class="flex-1">
<div class="font-title-lg text-title-lg text-on-surface peer-checked:text-primary-fixed-variant">Moderately Active</div>
<div class="font-body-md text-body-md text-on-surface-variant">Exercise 3–5 days/week</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary ml-4">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check">check</span>
</div>
</label>
<!-- Option 4: Very active -->
<label class="relative flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group border border-outline-variant/30 hover:border-outline-variant/60" id="very-active-option">
<input class="peer sr-only" name="activity_level" type="radio" value="very_active">
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mr-4 group-hover:scale-105 transition-transform peer-checked:bg-primary peer-checked:text-on-primary shadow-sm shadow-primary/5">
<span class="material-symbols-outlined" data-icon="directions_run" style="font-variation-settings: 'FILL' 1;">directions_run</span>
</div>
<div class="flex-1">
<div class="font-title-lg text-title-lg text-on-surface peer-checked:text-primary-fixed-variant">Very Active</div>
<div class="font-body-md text-body-md text-on-surface-variant">Hard exercise 6–7 days/week</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary ml-4">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check">check</span>
</div>
</label>
<!-- Option 5: Extremely active -->
<label class="relative flex items-center p-4 rounded-xl bg-surface-container-low hover:bg-surface-container transition-colors cursor-pointer group border border-outline-variant/30 hover:border-outline-variant/60" id="extremely-active-option">
<input class="peer sr-only" name="activity_level" type="radio" value="extremely_active">
<div class="absolute inset-0 rounded-xl border-2 border-transparent peer-checked:border-primary peer-checked:bg-primary-container/10 transition-all pointer-events-none"></div>
<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center mr-4 group-hover:scale-105 transition-transform peer-checked:bg-primary peer-checked:text-on-primary shadow-sm shadow-primary/5">
<span class="material-symbols-outlined" data-icon="fitness_center" style="font-variation-settings: 'FILL' 1;">fitness_center</span>
</div>
<div class="flex-1">
<div class="font-title-lg text-title-lg text-on-surface peer-checked:text-primary-fixed-variant">Extremely Active</div>
<div class="font-body-md text-body-md text-on-surface-variant">Very intense physical activity</div>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center peer-checked:border-primary peer-checked:bg-primary ml-4">
<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 peer-checked:opacity-100 transition-opacity" data-icon="check">check</span>
</div>
</label>
</div>
<!-- Sticky Bottom Action -->
<div class="mt-auto pt-stack-lg pb-safe">
<button id="continue-button" class="w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20" disabled>
                Continue
                <span class="material-symbols-outlined text-[20px]" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</main>
<!-- Suppressed TopAppBar and BottomNavBar as this is a linear onboarding flow -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const radioButtons = document.querySelectorAll('input[name="activity_level"]');
        const continueButton = document.getElementById('continue-button');

        // Enable continue button when an option is selected
        radioButtons.forEach(radio => {
            radio.addEventListener('change', () => {
                continueButton.disabled = false;

                // Visual feedback for selected state
                radioButtons.forEach(rb => {
                    const label = rb.parentElement;
                    if (rb.checked) {
                        label.classList.add('border-primary', 'border-2');
                        label.classList.remove('border-outline-variant/30', 'hover:border-outline-variant/60');
                    } else {
                        label.classList.remove('border-primary', 'border-2');
                        label.classList.add('border-outline-variant/30', 'hover:border-outline-variant/60');
                    }
                });
            });
        });

        // Handle back button
        document.getElementById('back-button').addEventListener('click', () => {
            window.history.back();
        });

        // Handle continue button
        continueButton.addEventListener('click', () => {
            const selectedValue = document.querySelector('input[name="activity_level"]:checked');
            if (selectedValue) {
                // Store selection in localStorage for persistence
                localStorage.setItem('selectedActivityLevel', selectedValue.value);
                // Navigate to next screen (diet preferences)
                window.location.href = '../diet_preferences/code.html';
            }
        });

        // Restore selection from localStorage on page load
        const savedActivityLevel = localStorage.getItem('selectedActivityLevel');
        if (savedActivityLevel) {
            const savedRadio = document.querySelector(`input[name="activity_level"][value="${savedActivityLevel}"]`);
            if (savedRadio) {
                savedRadio.checked = true;
                // Enable continue button
                continueButton.disabled = false;
                // Update visual state
                radioButtons.forEach(rb => {
                    const label = rb.parentElement;
                    if (rb.checked) {
                        label.classList.add('border-primary', 'border-2');
                        label.classList.remove('border-outline-variant/30', 'hover:border-outline-variant/60');
                    } else {
                        label.classList.remove('border-primary', 'border-2');
                        label.classList.add('border-outline-variant/30', 'hover:border-outline-variant/60');
                    }
                });
            }
        }
    });
</script>
</body></html>
