<style>
        .glass-overlay {
            background: rgba(242, 244, 243, 0.85); /* surface-container-low */
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
        }
        .bottom-sheet {
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        }
        .bottom-sheet.open {
            transform: translateY(0);
        }
        .overlay {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        .overlay.open {
            opacity: 1;
            pointer-events: auto;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background antialiased h-screen overflow-hidden flex flex-col relative font-[Roboto_Flex]">
<!-- Mock Background Content to show context -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-stack-lg pb-32">
<div class="mb-stack-lg">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-stack-sm">Today's Log</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Tap the button to log your next meal.</p>
</div>
<div class="bg-surface-container rounded-xl p-stack-md flex items-center justify-center h-64 border border-outline-variant/30">
<p class="font-title-lg text-title-lg text-outline">Dashboard Content</p>
</div>
</main>
<!-- Overlay -->
<div class="overlay fixed inset-0 bg-inverse-surface/60 z-40 transition-opacity duration-400" id="scrim"></div>
<!-- Bottom Sheet -->
<div class="bottom-sheet fixed bottom-0 left-0 right-0 z-50 glass-overlay rounded-t-[32px] border-t border-outline-variant/30 shadow-[0_-8px_40px_rgba(15,82,56,0.15)] px-margin-mobile pb-12 pt-4 flex flex-col md:max-w-2xl md:mx-auto" id="addFoodSheet">
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/60 rounded-full mx-auto mb-stack-md"></div>
<div class="flex justify-between items-center mb-stack-lg">
<h2 class="font-title-lg text-title-lg text-on-surface font-[Roboto_Flex]">Log Meal</h2>
<button class="p-2 rounded-full hover:bg-surface-variant/80 transition-colors text-on-surface-variant bg-surface-variant/40" id="closeSheetBtn">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="flex flex-col gap-stack-md mb-stack-lg">
<!-- Take Photo (Prominent) -->
<button class="w-full bg-gradient-to-br from-primary to-primary-container text-on-primary rounded-[24px] p-6 flex flex-col items-center justify-center gap-stack-sm hover:opacity-95 active:scale-[0.98] transition-all shadow-lg shadow-primary/30 relative overflow-hidden group">
<div class="absolute inset-0 bg-white/10 opacity-0 group-hover:opacity-100 transition-opacity"></div>
<span class="material-symbols-outlined text-5xl mb-2" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
<span class="font-label-lg text-label-lg font-[Roboto_Flex]">Take Photo</span>
</button>
<!-- Secondary Actions -->
<div class="grid grid-cols-2 gap-stack-sm">
<!-- Scan Barcode -->
<button class="bg-surface-container-high/60 backdrop-blur-md rounded-2xl p-4 flex flex-col items-center justify-center gap-stack-sm border border-outline-variant/30 hover:bg-surface-variant/80 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-3xl text-secondary mb-1">barcode_scanner</span>
<span class="font-label-lg text-label-lg text-on-surface font-[Roboto_Flex]">Scan Barcode</span>
</button>
<!-- Search Library -->
<button class="bg-surface-container-high/60 backdrop-blur-md rounded-2xl p-4 flex flex-col items-center justify-center gap-stack-sm border border-outline-variant/30 hover:bg-surface-variant/80 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined text-3xl text-secondary mb-1">search</span>
<span class="font-label-lg text-label-lg text-on-surface font-[Roboto_Flex]">Search Library</span>
</button>
</div>
</div>
<!-- Describe Meal -->
<div class="mt-2">
<div class="bg-surface-container-highest/80 rounded-2xl p-1.5 border border-outline-variant/40 flex shadow-inner shadow-black/5 focus-within:ring-2 focus-within:ring-primary/40 focus-within:bg-surface-container-highest transition-all duration-300">
<input class="w-full bg-transparent border-none focus:ring-0 font-[Roboto_Flex] text-body-md text-on-surface placeholder-on-surface-variant px-4 py-3 rounded-xl" placeholder="Describe your meal (e.g. 'Oatmeal with berries')" type="text">
<button class="p-3 bg-tertiary text-on-tertiary rounded-xl ml-2 hover:bg-tertiary/90 transition-colors shadow-sm flex items-center justify-center group">
<span class="material-symbols-outlined group-hover:rotate-12 transition-transform">auto_awesome</span>
</button>
</div>
</div>
</div>
<!-- Main AI FAB to trigger sheet -->
<button class="fixed bottom-24 right-margin-mobile z-30 bg-tertiary text-on-tertiary p-4 rounded-2xl shadow-lg shadow-tertiary/20 hover:scale-105 active:scale-95 transition-all flex items-center justify-center" id="triggerBtn">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">add</span>
</button>

<nav class="fixed bottom-0 left-0 w-full z-20 flex justify-around items-center px-2 pb-safe h-20 bg-surface/90 dark:bg-background/90 backdrop-blur-xl border-t border-outline-variant/30 shadow-lg shadow-primary/10">
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1">home</span>
<span class="font-label-sm text-label-sm font-[Roboto_Flex]">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1">history</span>
<span class="font-label-sm text-label-sm font-[Roboto_Flex]">History</span>
</a>
<a class="flex flex-col items-center justify-center bg-secondary-container text-on-secondary-container rounded-full px-4 py-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1" style="font-variation-settings: 'FILL' 1;">add_circle</span>
<span class="font-label-sm text-label-sm font-[Roboto_Flex]">Log</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1">insights</span>
<span class="font-label-sm text-label-sm font-[Roboto_Flex]">Trends</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant py-1" href="#">
<span class="material-symbols-outlined text-2xl mb-1">assignment</span>
<span class="font-label-sm text-label-sm font-[Roboto_Flex]">Plans</span>
</a>
</nav>
<script>
        const sheet = document.getElementById('addFoodSheet');
        const scrim = document.getElementById('scrim');
        const triggerBtn = document.getElementById('triggerBtn');
        const closeBtn = document.getElementById('closeSheetBtn');

        function openSheet() {
            sheet.classList.add('open');
            scrim.classList.add('open');
        }

        function closeSheet() {
            sheet.classList.remove('open');
            scrim.classList.remove('open');
        }

        // Open sheet immediately for demonstration based on prompt
        setTimeout(openSheet, 100);

        triggerBtn.addEventListener('click', openSheet);
        closeBtn.addEventListener('click', closeSheet);
        scrim.addEventListener('click', closeSheet);
    </script>
</body></html>
