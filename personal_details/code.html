<style>
        /* Material 3 Outlined Text Field minimal styles for inputs */
        .m3-input-container {
            position: relative;
            padding-top: 8px;
        }
        .m3-input {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            border: 1px solid var(--tw-colors-outline);
            border-radius: var(--tw-border-radius-DEFAULT);
            background: transparent;
            color: var(--tw-colors-on-surface);
            font-family: var(--tw-font-body-lg);
            font-size: 16px;
            line-height: 24px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .m3-input:focus {
            outline: none;
            border-color: var(--tw-colors-primary);
            border-width: 2px;
            padding: 0 15px; /* Adjust padding to prevent jump */
        }
        .m3-label {
            position: absolute;
            left: 16px;
            top: 24px;
            color: var(--tw-colors-on-surface-variant);
            font-family: var(--tw-font-body-lg);
            font-size: 16px;
            pointer-events: none;
            transition: all 0.2s ease-out;
            background: var(--tw-colors-background);
            padding: 0 4px;
        }
        .m3-input:focus ~ .m3-label,
        .m3-input:not(:placeholder-shown) ~ .m3-label {
            top: 0;
            font-size: 12px;
            color: var(--tw-colors-primary);
        }
        .m3-input:not(:focus):not(:placeholder-shown) ~ .m3-label {
            color: var(--tw-colors-on-surface-variant);
        }
        
        body {
            background-color: var(--tw-colors-background);
            color: var(--tw-colors-on-background);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="font-body-md min-h-screen flex flex-col relative pb-24">
<!-- Top App Bar (Back to main exception for focused flow) -->
<header class="flex items-center p-margin-mobile pt-6 bg-background">
<button aria-label="Go back" class="flex items-center justify-center w-12 h-12 text-on-surface hover:bg-surface-variant rounded-full transition-colors">
<span class="material-symbols-outlined" style="font-size: 24px;">arrow_back</span>
</button>
</header>
<!-- Progress Indicator -->
<div class="px-margin-mobile py-2 flex flex-col gap-2 max-w-[480px] mx-auto w-full">
<div class="flex justify-between items-center text-label-sm text-on-surface-variant">
<span>Step 2 of 6</span>
</div>
<div class="h-2 w-full bg-surface-variant rounded-full overflow-hidden flex">
<div class="h-full bg-primary" style="width: 33.33%;"></div>
</div>
</div>
<!-- Main Content -->
<main class="flex-1 px-margin-mobile py-6 max-w-[480px] mx-auto w-full flex flex-col gap-stack-lg">
<div>
<h1 class="text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">Tell us about yourself</h1>
<p class="text-body-md text-on-surface-variant">This helps us personalize your plan.</p>
</div>
<form class="flex flex-col gap-stack-md" onsubmit="event.preventDefault();">
<!-- Age Input -->
<div class="m3-input-container">
<input class="m3-input" id="age" max="120" min="13" placeholder=" " required="" type="number"/>
<label class="m3-label" for="age">Age</label>
</div>
<!-- Height Input -->
<div class="m3-input-container">
<input class="m3-input" id="height" max="300" min="50" placeholder=" " required="" type="number"/>
<label class="m3-label" for="height">Height (cm)</label>
</div>
<!-- Weight Input -->
<div class="m3-input-container">
<input class="m3-input" id="weight" max="500" min="20" placeholder=" " required="" step="0.1" type="number"/>
<label class="m3-label" for="weight">Current Weight (kg)</label>
</div>
</form>
</main>
<!-- Floating Action Button / Next Button -->
<div class="fixed bottom-0 left-0 right-0 p-margin-mobile bg-gradient-to-t from-background via-background to-transparent pointer-events-none flex justify-center">
<div class="max-w-[480px] w-full flex justify-end pointer-events-auto">
<button class="bg-primary text-on-primary h-14 px-8 rounded-full font-label-lg flex items-center gap-2 hover:bg-primary/90 transition-colors shadow-lg shadow-primary/20 active:scale-[0.98]">
                Next
                <span class="material-symbols-outlined" style="font-size: 20px;">arrow_forward</span>
</button>
</div>
</div>
