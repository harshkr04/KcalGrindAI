<style>
        .liquid-glass {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);

            -webkit-backdrop-filter: blur(16px);

            box-shadow: 0 8px 32px 0 rgba(15, 82, 56, 0.05), inset 0 1px 0 0 rgba(255,255,255,0.8);
        }

            background: linear-gradient(135deg, rgba(255, 255, 255, 0.5) 0%, rgba(255, 255, 255, 0.2) 100%);
            transform: scale(0.98);
        }

<span class="material-symbols-outlined text-[32px]" style="font-variation-settings: 'FILL' 1;">monitor_weight</span>

<h2 class="font-title-lg text-[16px] text-on-surface text-center leading-tight">Lose<br/>Weight</h2>
</button>
