name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assert No Disallowed Placeholders or Names
        run: |
          CHECK_PATHS=""
          for p in app/src backend/src website/src website/dist Docs README.md; do
            if [ -e "$p" ]; then
              CHECK_PATHS="$CHECK_PATHS $p"
            fi
          done
          if [ -n "$CHECK_PATHS" ]; then
            if grep -rn -E "\[YOUR NAME\]|NAME I CHOOSE|Vardhan" $CHECK_PATHS; then
              echo "ERROR: Disallowed placeholder or name ('[YOUR NAME]', 'NAME I CHOOSE', or 'Vardhan') found in repository source or documentation!"
              exit 1
            fi
          fi

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Provide CI Mock google-services.json
        run: |
          # The google-services Gradle plugin requires google-services.json to process app resources.
          # To ensure CI runs cleanly on public forks without committing production secrets to git,
          # we provision a mock configuration structure with non-production test identifiers.
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"000000000000","project_id":"ci-mock-project","storage_bucket":"ci-mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.kcalgrindai.app"}},"oauth_client":[],"api_key":[{"current_key":"mock_ci_api_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Build Release APK Verification
        env:
          PROD_BACKEND_URL: "https://api.kcalgrind.app"
        run: ./gradlew assembleRelease --no-daemon --stacktrace

  backend-tests:
    name: Backend Proxy Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Assert No Disallowed Placeholders or Names
        working-directory: .
        run: |
          CHECK_PATHS=""
          for p in app/src backend/src website/src website/dist Docs README.md; do
            if [ -e "$p" ]; then
              CHECK_PATHS="$CHECK_PATHS $p"
            fi
          done
          if [ -n "$CHECK_PATHS" ]; then
            if grep -rn -E "\[YOUR NAME\]|NAME I CHOOSE|Vardhan" $CHECK_PATHS; then
              echo "ERROR: Disallowed placeholder or name ('[YOUR NAME]', 'NAME I CHOOSE', or 'Vardhan') found in repository source or documentation!"
              exit 1
            fi
          fi

      - name: Install Dependencies
        run: npm ci

      - name: Run Standalone Backend Tests
        env:
          NODE_ENV: test
          FIREBASE_PROJECT_ID: test-kcalgrind-ci
          GEMINI_API_KEY: mock-ci-gemini-key
          ALLOW_DEV_TOKENS: 'false'
        run: |
          node --test test-account-deletion.js test-auth-middleware.js test-gemini-client-unit.js test-gemini-structure.js test-test-token-production-gate.js test-ai-coach-quota.js test-ai-coach-shared-quota.js test-production-fail-closed.js test-gemini-fallback.js test-coach-safety.js test-photo-cap.js test-canary-logging.js
          node scripts/audit-purge-completeness.js

  postgres-integration-tests:
    name: Real Postgres Integration & Security Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: kcalgrind_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Real Postgres Integration & Security Suite
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/kcalgrind_test
          NODE_ENV: test
        run: |
          node test-real-postgres.js

      - name: Run Live Purge Audit Against Postgres
        env:
          DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/kcalgrind_test
        run: |
          node scripts/audit-purge-completeness.js --live

  website-tests:
    name: Website Build & Verification Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: website
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: website/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Production Bundle
        run: npm run build

      - name: Assert No Disallowed Placeholders or Names in Website Bundle & Docs
        working-directory: .
        run: |
          CHECK_TARGETS=""
          for p in website/src website/dist README.md Docs; do
            if [ -e "$p" ]; then
              CHECK_TARGETS="$CHECK_TARGETS $p"
            fi
          done
          if [ -n "$CHECK_TARGETS" ]; then
            if grep -rn -E "\[YOUR NAME\]|NAME I CHOOSE|Vardhan" $CHECK_TARGETS; then
              echo "ERROR: Disallowed placeholder or name ('[YOUR NAME]', 'NAME I CHOOSE', or 'Vardhan') found in website/src, website/dist, README.md, or Docs!"
              exit 1
            fi
          fi

      - name: Run Nutrition Calculator Parity Tests
        run: npm run test:calculator

      - name: Run Static HTML Serving Verification
        run: npm run test:static

      - name: Run WCAG Contrast Audit
        run: npm run test:contrast
