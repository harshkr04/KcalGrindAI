name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-unit-tests:
    name: Android Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Provide CI Mock google-services.json
        run: |
          # The google-services Gradle plugin requires google-services.json to process app resources.
          # To ensure CI runs cleanly on public forks without committing production secrets to git,
          # we provision a mock configuration structure with non-production test identifiers.
          if [ ! -f app/google-services.json ]; then
            mkdir -p app
            echo '{"project_info":{"project_number":"000000000000","project_id":"ci-mock-project","storage_bucket":"ci-mock.appspot.com"},"client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"com.kcalgrindai.app"}},"oauth_client":[],"api_key":[{"current_key":"mock_ci_api_key"}],"services":{}}],"configuration_version":"1"}' > app/google-services.json
          fi

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

  backend-tests:
    name: Backend Proxy Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run Standalone Backend Tests
        run: |
          node --test test-account-deletion.js test-gemini-client-unit.js test-ai-coach-quota.js test-auth-middleware.js test-gemini-structure.js
