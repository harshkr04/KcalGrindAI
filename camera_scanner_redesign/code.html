<style>
        .glass-panel {
            background: rgba(248, 250, 249, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        
        .scanner-frame {
            position: relative;
        }
        
        .scanner-frame::before, .scanner-frame::after,
        .scanner-frame .corner::before, .scanner-frame .corner::after {
            content: '';
            position: absolute;
            width: 40px;
            height: 40px;
            border-color: #0f5238; /* Primary */
            border-style: solid;
            border-width: 0;
            transition: all 0.3s ease;
        }
        
        .scanner-frame::before { top: 0; left: 0; border-top-width: 3px; border-left-width: 3px; border-top-left-radius: 12px; }
        .scanner-frame::after { top: 0; right: 0; border-top-width: 3px; border-right-width: 3px; border-top-right-radius: 12px; }
        .scanner-frame .corner::before { bottom: 0; left: 0; border-bottom-width: 3px; border-left-width: 3px; border-bottom-left-radius: 12px; }
        .scanner-frame .corner::after { bottom: 0; right: 0; border-bottom-width: 3px; border-right-width: 3px; border-bottom-right-radius: 12px; }

        @keyframes scanline {
            0% { top: 5%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 95%; opacity: 0; }
        }

        .scan-line {
            position: absolute;
            left: 5%;
            right: 5%;
            height: 2px;
            background: linear-gradient(90deg, transparent, #313c9f, transparent); /* Tertiary for AI accent */
            box-shadow: 0 0 8px #313c9f;
            animation: scanline 3s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes floatPoint {
            0%, 100% { transform: translateY(0) scale(1); opacity: 0.5; }
            50% { transform: translateY(-15px) scale(1.2); opacity: 0.9; }
        }

        .ai-point {
            position: absolute;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #b0f1cc; /* Secondary Container */
            box-shadow: 0 0 10px #b0f1cc;
            animation: floatPoint 2s ease-in-out infinite;
        }

        .ai-point:nth-child(1) { top: 30%; left: 20%; animation-delay: 0s; }
        .ai-point:nth-child(2) { top: 60%; left: 70%; animation-delay: 0.7s; }
        .ai-point:nth-child(3) { top: 40%; left: 60%; animation-delay: 1.4s; }
        
        /* Shutter button pulse */
        @keyframes shutterPulse {
            0% { box-shadow: 0 0 0 0 rgba(49, 60, 159, 0.4); }
            70% { box-shadow: 0 0 0 20px rgba(49, 60, 159, 0); }
            100% { box-shadow: 0 0 0 0 rgba(49, 60, 159, 0); }
        }
        .shutter-btn {
            animation: shutterPulse 2s infinite;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-surface text-on-surface h-full m-0 overflow-hidden relative selection:bg-primary-container selection:text-on-primary-container">

</div>
<!-- Top Navigation (Suppressed typical TopAppBar due to task-focused/transactional nature, using custom transparent header) -->

<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="glass-panel px-4 py-1.5 rounded-full flex items-center gap-2">
<span class="material-symbols-outlined text-tertiary-fixed text-sm">bolt</span>
<span class="font-label-lg text-label-lg text-white">Auto-Flash</span>
</div>
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-white active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">help</span>
</button>
</div>
<!-- AI Scanner Overlay -->
<div class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
<!-- Floating Label -->

<div class="ai-point bg-white/40 border border-white/60 backdrop-blur-sm shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div>
<div class="ai-point bg-white/40 border border-white/60 backdrop-blur-sm shadow-[0_0_15px_rgba(255,255,255,0.5)]"></div></div>

<div class="w-1 h-1 bg-white rounded-full"></div>
<div class="absolute w-full h-[1px] bg-white/50"></div>
<div class="absolute h-full w-[1px] bg-white/50"></div>
</div>
</div>
<!-- Helpful text below scanner -->
<p class="mt-stack-lg font-body-md text-body-md text-white/90 text-center px-container-padding max-w-sm drop-shadow-md">

<!-- Bottom Action Area -->

<!-- Shutter Button Area -->

</button>
<!-- Main Shutter Button -->

<!-- Inner button with gradient and glow -->

<!-- Manual Entry / Keyboard -->

<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">keyboard</span>
</button>
</div>
</div>
<!-- Navigation Shell Suppressed:
         The BottomNavBar from the JSON is explicitly suppressed here because this is a 'Task-Focused/Linear' view (a camera scanner overlay with a 'Close' action). 
         Rendering global navigation here would violate the Shell Visibility rules by cluttering the focused journey of scanning food. -->
<script>
        // Simple subtle pan effect for the background image to make it feel slightly 'live'
        document.addEventListener('DOMContentLoaded', () => {
            const bgImage = document.querySelector('.bg-cover.scale-105');
            let isMovingRight = true;
            
            setInterval(() => {
                if(bgImage) {
                    bgImage.style.transform = isMovingRight ? 'scale(1.05) translateX(1%)' : 'scale(1.05) translateX(-1%)';
                    isMovingRight = !isMovingRight;
                }
            }, 10000);
        });
    </script>
</body></html>
