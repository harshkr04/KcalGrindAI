<!DOCTYPE html><html lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>AI Food Camera</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">

        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-fixed": "#dfe0ff",

                      "on-tertiary-container": "#d5d7ff",
                      "error-container": "#ffdad6",
                      "on-surface-variant": "#404943",

                      "primary-container": "#2d6a4f",
                      "inverse-surface": "#2e3131",
                      "on-tertiary-fixed-variant": "#303b9f",
                      "on-primary-fixed": "#002114",
                      "inverse-on-surface": "#eff1f0",

                      "tertiary": "#313c9f",
                      "on-background": "#191c1c",
                      "on-secondary-fixed": "#002113",
                      "on-secondary-fixed-variant": "#0c5136",
                      "secondary-fixed-dim": "#94d4b1",
                      "inverse-primary": "#95d4b3",
                      "secondary-fixed": "#b0f1cc",
                      "outline": "#707973",
                      "surface-container-highest": "#e1e3e2",

                      "primary-fixed-dim": "#95d4b3",
                      "error": "#ba1a1a",
                      "surface-container": "#eceeed",
                      "surface-tint": "#2c694e",
                      "on-error-container": "#93000a",
                      "surface-bright": "#f8faf9",
                      "on-tertiary": "#ffffff",
                      "surface-container-low": "#f2f4f3",
                      "on-error": "#ffffff",
                      "outline-variant": "#bfc9c1",
                      "surface-variant": "#e1e3e2",
                      "surface-dim": "#d8dada",
                      "background": "#f8faf9"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "stack-lg": "32px",
                      "stack-md": "16px",
                      "unit": "4px",
                      "margin-tablet": "24px",
                      "margin-mobile": "16px",
                      "stack-sm": "8px",
                      "container-padding": "20px",
                      "gutter": "16px"
              },
              "fontFamily": {
                      "headline-lg": ["Roboto Flex", "sans-serif"],
                      "label-lg": ["Inter", "sans-serif"],
                      "label-sm": ["Inter", "sans-serif"],
                      "headline-lg-mobile": ["Roboto Flex", "sans-serif"],
                      "body-md": ["Inter", "sans-serif"],
                      "display-lg": ["Roboto Flex", "sans-serif"],
                      "title-lg": ["Inter", "sans-serif"],
                      "body-lg": ["Inter", "sans-serif"]
              }
            }
          }
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .glass-panel {
            background: rgba(248, 250, 249, 0.15);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .viewfinder-bracket {
            width: 40px;
            height: 40px;
            border-color: rgba(255, 255, 255, 0.8);
            border-style: solid;
        }
        .bracket-tl { border-width: 3px 0 0 3px; border-top-left-radius: 12px; }
        .bracket-tr { border-width: 3px 3px 0 0; border-top-right-radius: 12px; }
        .bracket-bl { border-width: 0 0 3px 3px; border-bottom-left-radius: 12px; }
        .bracket-br { border-width: 0 3px 3px 0; border-bottom-right-radius: 12px; }
        
        @keyframes float {
            0% { transform: translateY(0px) scale(1); opacity: 0.7; }
            50% { transform: translateY(-10px) scale(1.1); opacity: 1; }
            100% { transform: translateY(0px) scale(1); opacity: 0.7; }
        }
        .ai-spark {
            animation: float 2s ease-in-out infinite;
        }
        .ai-spark:nth-child(2) { animation-delay: 0.5s; }
        .ai-spark:nth-child(3) { animation-delay: 1s; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-black text-on-surface h-screen w-full overflow-hidden flex flex-col relative select-none">
<!-- Camera Feed Background (Simulated) -->
<div class="absolute inset-0 w-full h-full z-0" data-alt="A subjective, first-person view looking down at a beautifully plated, healthy gourmet meal on a rustic wooden table. Soft, natural morning light spills across the scene, highlighting the fresh greens and vibrant colors of the food. The depth of field is shallow, blurring the background slightly to focus on the dish in the center, simulating a high-quality smartphone camera viewfinder. Bright, airy aesthetic with subtle green and white tones reflecting the healthy app theme." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBHHoi5sbuCF18t9jdhucygQclwpDTehi91HMod47gVRmPxUCPynYDYwL_CRyVXzMnz7XnW9_a0UPr3No4XQE9uxeU-Ob9q8T4fzQJtjgyJh8p2PaGf7rLjLxroVv7EPdJ3qhYU110AWuCbhQnh8t2ZeWmUl3cV9PehMjfbCKCiYUEALuzvc5cwsZ4q7QfdtLDRmdPQ6KeHPl7Kr-Eha3XrXG2SyJfC0KmJfAEiREk28haJiAnI-5St'); background-size: cover; background-position: center;"></div>
<!-- UI Overlay Layer -->
<div class="relative z-10 flex flex-col h-full justify-between">
<!-- Minimal Top Header (Focused View) -->
<div class="flex items-center justify-between p-4 pt-8">
<button class="flex items-center justify-center size-12 rounded-full glass-panel text-white hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="close">close</span>
</button>
<button class="flex items-center justify-center size-12 rounded-full glass-panel text-white hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="flashlight_on">flashlight_on</span>
</button>
</div>
<!-- Center Viewfinder Area -->
<div class="flex-1 flex items-center justify-center relative pointer-events-none">
<!-- Floating AI Sparks -->
<div class="absolute w-64 h-64 flex items-center justify-center">
<span class="material-symbols-outlined text-primary-fixed text-3xl absolute -top-8 -left-4 ai-spark" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
<span class="material-symbols-outlined text-primary-fixed text-2xl absolute top-12 right-0 ai-spark" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
<span class="material-symbols-outlined text-primary-fixed text-4xl absolute bottom-4 -left-8 ai-spark" data-icon="sparkles" style="font-variation-settings: 'FILL' 1;">arrow_back_ios_new</span>
</div>
<!-- Viewfinder Brackets -->
<div class="relative w-64 h-64">
<div class="absolute top-0 left-0 viewfinder-bracket bracket-tl"></div>
<div class="absolute top-0 right-0 viewfinder-bracket bracket-tr"></div>
<div class="absolute bottom-0 left-0 viewfinder-bracket bracket-bl"></div>
<div class="absolute bottom-0 right-0 viewfinder-bracket bracket-br"></div>
<!-- Center Crosshair -->
<div class="absolute inset-0 flex items-center justify-center">
<div class="w-8 h-8 relative opacity-50">
<div class="absolute top-1/2 left-0 right-0 h-[1px] bg-white transform -translate-y-1/2"></div>
<div class="absolute left-1/2 top-0 bottom-0 w-[1px] bg-white transform -translate-x-1/2"></div>
</div>
</div>
</div>
<div class="absolute bottom-1/4 glass-panel px-4 py-2 rounded-full text-white font-label-sm tracking-wide">
                Scanning ingredients...
            </div>
</div>
<!-- Bottom Controls Area -->
<div class="w-full pb-8 pt-4 flex flex-col items-center bg-gradient-to-t from-black/80 via-black/40 to-transparent">
<!-- Mode Selector -->
<div class="flex px-4 py-3 mb-6 w-full max-w-sm">
<div class="flex h-10 flex-1 items-center justify-center rounded-full glass-panel p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-full px-3 has-[:checked]:bg-white has-[:checked]:text-on-surface text-white text-sm font-medium transition-all">
<span class="truncate">Single Food</span>
<input checked="" class="invisible w-0" name="mode" type="radio" value="Single Food">
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-full px-3 has-[:checked]:bg-white has-[:checked]:text-on-surface text-white text-sm font-medium transition-all">
<span class="truncate">Meal</span>
<input class="invisible w-0" name="mode" type="radio" value="Meal">
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center rounded-full px-3 has-[:checked]:bg-white has-[:checked]:text-on-surface text-white text-sm font-medium transition-all">
<span class="truncate">Barcode</span>
<input class="invisible w-0" name="mode" type="radio" value="Barcode">
</label>
</div>
</div>
<!-- Shutter Button Area -->
<div class="flex items-center justify-center gap-10 px-8 w-full">
<!-- Gallery Thumbnail -->
<button class="size-12 rounded-full overflow-hidden border-2 border-white/30 glass-panel flex-shrink-0 relative group">
<div class="absolute inset-0 bg-cover bg-center" data-alt="A small thumbnail showing a previously taken photo of a colorful salad with cherry tomatoes, spinach, and feta cheese. Bright lighting, appetizing look." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuA0tF_M1_rMz7igipUApJgLgklJ10kmLCH3OcCSKoe01vCw9_kmCuxIBziG0j1wbfRrGNW0b3Jk2Qu4m_abCmvgVlVKPdqgScB5J9zbaM3Io89rz4ICCJ5ji5hS0A28SePm1oX6fgvFTveKR2-WltZmDZ2sVu69Ms4LG41PPiEjPyYmkHuRTzscz_YGegK97L-RtaIeH8hE9fHeohESfAXNU76gqZrtmAa1W6Ya1mssJKG1r2zSQvDG')"></div>
</button>
<!-- Main Shutter -->
<button class="relative size-20 rounded-full border-[3px] border-white flex items-center justify-center flex-shrink-0 group hover:scale-105 transition-transform active:scale-95">
<div class="size-[68px] bg-white rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-3xl" data-icon="auto_awesome" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
</button>
<!-- Secondary Action (e.g., flip camera) -->
<button class="size-12 rounded-full glass-panel flex items-center justify-center text-white flex-shrink-0 hover:bg-white/20 transition-colors">
<span class="material-symbols-outlined" data-icon="flip_camera_ios">flip_camera_ios</span>
</button>
</div>
</div>
</div>
</body></html>
