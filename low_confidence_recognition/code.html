<!DOCTYPE html><html class="light" lang="en"><head>

                        "surface-container-highest": "#e1e3e2",

                        "surface": "#f8faf9",
                        "on-tertiary-fixed": "#000866",
                        "inverse-surface": "#2e3131",
                        "on-tertiary-fixed-variant": "#303b9f",
                        "secondary-fixed-dim": "#94d4b1",

                        "tertiary": "#313c9f",

                }
            }
        }

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-filled {
            font-variation-settings: 'FILL' 1;
        }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.05);
        }
        
        .pulse-subtle {
            animation: pulse-soft 3s infinite;
        }
        
        @keyframes pulse-soft {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen font-body-md antialiased pb-24 selection:bg-primary/20 selection:text-primary">
<!-- TopAppBar: Hiding globally for task focused screen with 'Back' implied -->
<header class="fixed top-0 w-full z-50 bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md flex items-center justify-between px-margin-mobile h-16 w-full">
<button class="text-on-surface-variant hover:bg-surface-variant/50 p-2 rounded-full transition-colors active:scale-95 duration-200">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed">NutriVitality AI</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="pt-24 px-margin-mobile md:px-margin-tablet max-w-[840px] mx-auto flex flex-col gap-stack-lg">
<!-- Context Header -->
<section class="flex flex-col items-center text-center gap-stack-sm mt-4">
<div class="w-16 h-16 rounded-full bg-warning-container text-on-warning-container flex items-center justify-center mb-2 pulse-subtle">
<span class="material-symbols-outlined text-3xl icon-filled" data-icon="help_outline">help_outline</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-surface">Hmm, I need a hand.</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-md">I think this might be a <span class="font-medium text-warning">salad</span>, but I'm not entirely sure. Could you help me identify it?</p>
</section>
<!-- Image & AI Guess Card -->
<section class="glass-card rounded-xl overflow-hidden relative">
<div class="relative h-64 md:h-80 w-full">
<img alt="Scanned meal" class="w-full h-full object-cover filter blur-[2px] transition-all duration-500 hover:blur-none" data-alt="A close-up, slightly out-of-focus top-down photograph of a healthy meal in a bowl, likely a salad. The lighting is soft, natural, and bright, creating a clean, modern light-mode aesthetic. The colors are muted greens and vibrant touches of orange and red, but slightly blurred as if an AI is trying to process the image. The mood is calm and organic, fitting a premium health app interface." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBYwY0c4UkVpsnSkuVyGUnRKSxt3NtQQs7z8P5Iagfulbxj1XywySdU6VNbUcXwVf5HTfc6qYJfACmlr5QANk0HAnFKhLiPbyzGZsD1JtKjgwXKkrnp9S34aEwU6X9d1CHH6IYGI9fbGS4kE2Vfu_O0v1FUpsjT_lfyDfsXXJbHhuur2ho9iLHJLvYSBcfPs1uE-RoYIJhQgx08iP9bt4BfY5c5EA83-gC7Du3NXd4WkDyNhft9P4yn">
<!-- Overlay Gradient for text readability -->
<div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>
<!-- Confidence Indicator -->
<div class="absolute top-4 right-4 bg-surface/90 backdrop-blur-sm rounded-full px-3 py-1 flex items-center gap-2 shadow-sm border border-surface-variant/50">
<div class="w-2 h-2 rounded-full bg-warning animate-pulse"></div>
<span class="font-label-sm text-label-sm text-on-surface">Low Confidence</span>
</div>
<!-- Best Guess -->
<div class="absolute bottom-4 left-4 right-4 flex items-end justify-between">
<div>
<div class="font-label-sm text-label-sm text-white/80 mb-1">AI BEST GUESS</div>
<div class="font-title-lg text-title-lg text-white font-medium flex items-center gap-2">
                            Mixed Green Salad
                            <span class="material-symbols-outlined text-white/70 text-sm" data-icon="auto_awesome">auto_awesome</span>
</div>
</div>
</div>
</div>
<div class="p-stack-md bg-surface-container-lowest/80 border-t border-outline-variant/30 flex justify-between items-center">
<p class="font-body-md text-body-md text-on-surface-variant">Is this correct?</p>
<div class="flex gap-2">
<button class="px-4 py-2 rounded-full border-1.5 border-outline text-on-surface-variant hover:bg-surface-variant/50 font-label-lg text-label-lg transition-colors active:scale-95">No</button>
<button class="px-4 py-2 rounded-full bg-primary text-on-primary hover:bg-primary/90 font-label-lg text-label-lg transition-colors active:scale-95 shadow-sm">Yes, Log It</button>
</div>
</div>
</section>
<!-- Manual Identification Section -->
<section class="bg-surface-container-low rounded-xl p-stack-md border border-outline-variant/20">
<h2 class="font-title-lg text-title-lg text-on-surface mb-4">Identify Manually</h2>
<!-- Search Bar -->
<div class="relative mb-6">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant" data-icon="search">search</span>
<input class="w-full bg-surface-container-high border-none rounded-t-lg border-b-2 border-primary focus:ring-0 focus:border-primary pl-12 pr-4 py-4 font-body-lg text-body-lg text-on-surface placeholder-on-surface-variant/70 transition-colors" placeholder="Type a food name..." type="text">
</div>
<!-- Suggestions -->
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-3">Popular Options</p>
<div class="flex flex-wrap gap-2">
<button class="bg-surface border border-outline-variant rounded-full px-4 py-2 font-label-lg text-label-lg text-on-surface hover:bg-surface-variant active:scale-98 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="restaurant">restaurant</span>
                        Caesar Salad
                    </button>
<button class="bg-surface border border-outline-variant rounded-full px-4 py-2 font-label-lg text-label-lg text-on-surface hover:bg-surface-variant active:scale-98 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="eco">eco</span>
                        Kale Bowl
                    </button>
<button class="bg-surface border border-outline-variant rounded-full px-4 py-2 font-label-lg text-label-lg text-on-surface hover:bg-surface-variant active:scale-98 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="set_meal">set_meal</span>
                        Poke Bowl
                    </button>
<button class="bg-surface border border-outline-variant rounded-full px-4 py-2 font-label-lg text-label-lg text-on-surface hover:bg-surface-variant active:scale-98 transition-all flex items-center gap-2">
<span class="material-symbols-outlined text-sm" data-icon="bakery_dining">bakery_dining</span>
                        Sandwich
                    </button>
</div>
</div>
</section>
</main>
<!-- Navigation suppressed as this is a transactional/task-focused screen (Identification) -->
<script>
        // Simple interaction for chip selection
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('mousedown', function() {
                this.classList.add('scale-95');
            });
            btn.addEventListener('mouseup', function() {
                this.classList.remove('scale-95');
            });
            btn.addEventListener('mouseleave', function() {
                this.classList.remove('scale-95');
            });
        });
    </script>
</body></html>
