<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Barcode Scanner · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/ai_food.js"></script>
</head>
<!-- Barcode Scanner — Camera preview with barcode frame, flash, and product lookup.
     States: scanning | barcode_detected | searching | product_found | product_not_found
             | network_error | invalid_barcode | camera_permission_denied -->
<body class="bg-surface text-on-surface h-screen w-full overflow-hidden relative antialiased">
<!-- Camera Feed Background (simulated) -->
<div id="camera-feed" class="absolute inset-0 z-0 bg-black">
  <div class="w-full h-full bg-cover bg-center opacity-80 scale-105 transform origin-center transition-transform duration-[10s] ease-linear" data-alt="A close-up, high-quality view of a kitchen countertop with various packaged foods and a barcode visible on a product label. Soft natural lighting, shallow depth of field, clean modern aesthetic." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuDjAL1nE_FCIC6NYElcUZWUtiCZudOSs9NG5l4dKIObcttfBBOo7h91y4JVGatEYUgnrNb-xs_Rb8EUw0ad-ENRIDdh1XESirX55UexJ1kXebikRgWmFOM0wB9XHM6xy7NA3RB8ayNIWJOi0VrgAfcAY4VZkz6XfETZmmfrS_fGP8gym82UXglfQw3bUcD-G-yFsJQ6wtD60fqXdohPOSDWKPpJvWfkvf61XPJP70mB1HCFuHyWpJcs')"></div>
</div>

<!-- Top Navigation -->
<div class="absolute top-0 w-full z-20 flex items-center justify-between px-margin-mobile pt-safe-top h-16 bg-gradient-to-b from-black/50 to-transparent">
  <button id="close-scanner" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 0;">close</span>
  </button>
  <div class="glass-panel px-4 py-1.5 rounded-full flex items-center gap-2">
    <span class="material-symbols-outlined text-tertiary text-sm" style="font-variation-settings:'FILL' 1;">bolt</span>
    <span id="flash-label" class="font-label-lg text-label-lg text-white">Auto-Flash</span>
  </div>
  <button id="flash-toggle" class="w-10 h-10 rounded-full bg-white/10 backdrop-blur-md flex items-center justify-center text-white active:scale-95 transition-transform">
    <span class="material-symbols-outlined" style="font-variation-settings:'FILL' 0;">flashlight_on</span>
  </button>
</div>

<!-- Scanner Overlay -->
<div id="scanner-overlay" class="absolute inset-0 z-10 flex flex-col items-center justify-center pointer-events-none">
  <div class="mb-stack-lg glass-panel px-6 py-3 rounded-full flex items-center gap-3 shadow-lg shadow-tertiary/20 border border-white/30 transform -translate-y-4 backdrop-blur-xl">
    <span class="material-symbols-outlined text-tertiary" style="font-variation-settings:'FILL' 1;">auto_awesome</span>
    <span class="font-title-lg text-title-lg text-white tracking-wide">Scan Barcode</span>
  </div>
  <div class="w-[80vw] max-w-[320px] aspect-[4/5] scanner-frame relative">
    <div class="corner w-full h-full absolute top-0 left-0 pointer-events-none"></div>
    <div class="scan-line" id="scan-line"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-8 h-8 flex items-center justify-center opacity-40">
      <div class="w-1 h-1 bg-white rounded-full"></div>
      <div class="absolute w-full h-[1px] bg-white/50"></div>
      <div class="absolute h-full w-[1px] bg-white/50"></div>
    </div>
  </div>
  <p class="mt-stack-lg font-body-md text-body-md text-white/90 text-center px-container-padding max-w-sm drop-shadow-md">Place the barcode inside the frame.</p>
</div>

<!-- Scanning Action Button -->
<div id="scan-action" class="absolute bottom-0 w-full z-20 pb-safe pb-8 pt-12 px-container-padding bg-gradient-to-t from-black/80 via-black/40 to-transparent flex flex-col items-center">
  <button id="scan-btn" class="relative w-20 h-20 rounded-full flex items-center justify-center active:scale-95 transition-transform group">
    <div class="absolute inset-0 rounded-full border-2 border-white/40 backdrop-blur-sm group-hover:border-white/60 transition-colors"></div>
    <div class="w-16 h-16 rounded-full bg-gradient-to-br from-tertiary to-primary flex items-center justify-center shadow-[0_0_20px_rgba(49,60,159,0.4)]">
      <span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings:'FILL' 1;">camera</span>
    </div>
  </button>
  <button id="manual-entry-btn" class="mt-stack-md font-label-lg text-label-lg text-white/80 hover:text-white transition-colors">Enter barcode manually</button>
</div>

<!-- Manual Entry Modal -->
<div id="manual-modal" class="absolute inset-0 z-30 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-container-padding">
  <div class="bg-surface rounded-2xl p-6 w-full max-w-sm">
    <h2 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">Enter barcode</h2>
    <input id="barcode-input" type="text" inputmode="numeric" class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-4 py-3 font-body-lg text-body-lg text-on-surface mb-stack-lg" placeholder="e.g. 1234567890123" maxlength="13">
    <div class="flex gap-3">
      <button id="manual-cancel" class="flex-1 py-3 rounded-full border border-outline-variant text-on-surface-variant font-label-lg text-label-lg hover:bg-surface-container-high transition-colors">Cancel</button>
      <button id="manual-submit" class="flex-1 py-3 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg hover:bg-tertiary-container transition-colors">Lookup</button>
    </div>
  </div>
</div>

<!-- Result Overlay: Product Found -->
<div id="result-found" class="absolute inset-0 z-30 bg-surface hidden flex flex-col">
  <div class="flex items-center justify-between px-margin-mobile h-16 border-b border-outline-variant/20">
    <button id="found-close" class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
      <span class="material-symbols-outlined">close</span>
    </button>
    <h2 class="font-title-lg text-title-lg text-on-surface">Product Found</h2>
    <div class="w-10"></div>
  </div>
  <main class="flex-1 overflow-y-auto px-container-padding py-stack-lg">
    <div class="flex flex-col items-center mb-stack-lg">
      <div class="w-24 h-24 rounded-2xl bg-surface-container-high flex items-center justify-center mb-stack-md">
        <span class="material-symbols-outlined text-4xl text-primary" style="font-variation-settings:'FILL' 1;">grocery</span>
      </div>
      <h3 id="found-name" class="font-headline-lg text-headline-lg text-on-surface text-center">Product Name</h3>
      <p id="found-brand" class="font-body-md text-body-md text-on-surface-variant">Brand</p>
    </div>
    <div class="glass-card rounded-xl p-4 mb-stack-md">
      <div class="flex items-center justify-between mb-3">
        <span class="font-label-lg text-label-lg text-on-surface">Serving size</span>
        <div class="flex items-center gap-2">
          <button id="serving-minus" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-surface-container-highest transition-colors">-</button>
          <span id="serving-value" class="font-body-lg text-body-lg text-on-surface w-16 text-center">1x</span>
          <button id="serving-plus" class="w-8 h-8 rounded-full bg-surface-container-high flex items-center justify-center text-on-surface hover:bg-surface-container-highest transition-colors">+</button>
        </div>
      </div>
      <p id="found-serving" class="font-body-md text-body-md text-on-surface-variant">1 serving</p>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-stack-lg">
      <div class="bg-surface-container-low rounded-xl p-4 text-center border border-outline-variant/20">
        <span id="found-cal" class="font-headline-lg-mobile text-headline-lg-mobile text-primary block">0</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">kcal</span>
      </div>
      <div class="bg-surface-container-low rounded-xl p-4 text-center border border-outline-variant/20">
        <span id="found-protein" class="font-headline-lg-mobile text-headline-lg-mobile text-secondary block">0g</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">Protein</span>
      </div>
      <div class="bg-surface-container-low rounded-xl p-4 text-center border border-outline-variant/20">
        <span id="found-carbs" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface block">0g</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">Carbs</span>
      </div>
      <div class="bg-surface-container-low rounded-xl p-4 text-center border border-outline-variant/20">
        <span id="found-fat" class="font-headline-lg-mobile text-headline-lg-mobile text-tertiary block">0g</span>
        <span class="font-label-sm text-label-sm text-on-surface-variant">Fat</span>
      </div>
    </div>
  </main>
  <div class="p-container-padding pb-safe border-t border-outline-variant/20 bg-surface">
    <button id="add-to-diary-btn" class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20">
      <span class="material-symbols-outlined text-[20px]">add_circle</span> Add to Diary
    </button>
  </div>
</div>

<!-- Result Overlay: Not Found / Error -->
<div id="result-error" class="absolute inset-0 z-30 bg-surface hidden flex flex-col">
  <div class="flex items-center justify-between px-margin-mobile h-16 border-b border-outline-variant/20">
    <button id="error-close" class="p-2 rounded-full hover:bg-surface-container-low transition-colors text-on-surface-variant">
      <span class="material-symbols-outlined">close</span>
    </button>
    <h2 class="font-title-lg text-title-lg text-on-surface">Scan Result</h2>
    <div class="w-10"></div>
  </div>
  <main class="flex-1 flex flex-col items-center justify-center px-container-padding text-center">
    <div id="error-icon-wrap" class="w-20 h-20 rounded-full bg-error-container/30 flex items-center justify-center mb-stack-lg">
      <span class="material-symbols-outlined text-error text-[40px]" style="font-variation-settings:'FILL' 1;">error_outline</span>
    </div>
    <h3 id="error-title" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm">No food found</h3>
    <p id="error-message" class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto mb-stack-lg">No food found for this barcode.</p>
  </main>
  <div class="p-container-padding pb-safe border-t border-outline-variant/20 bg-surface flex flex-col gap-3">
    <button id="manual-search-btn" class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20">
      <span class="material-symbols-outlined text-[20px]">search</span> Search Manually
    </button>
    <button id="custom-food-btn" class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[20px]">restaurant</span> Add Custom Food
    </button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('barcode_scanner', { title: 'Barcode Scanner', allowCompleted: true });
    if (!state) return;

    var flashOn = false;
    var servingMult = 1;
    var currentProduct = null;
    var currentBarcode = null;

    var cameraFeed = document.getElementById('camera-feed');
    var scanLine = document.getElementById('scan-line');
    var scanBtn = document.getElementById('scan-btn');
    var manualEntryBtn = document.getElementById('manual-entry-btn');
    var manualModal = document.getElementById('manual-modal');
    var manualCancel = document.getElementById('manual-cancel');
    var manualSubmit = document.getElementById('manual-submit');
    var barcodeInput = document.getElementById('barcode-input');
    var flashToggle = document.getElementById('flash-toggle');
    var flashLabel = document.getElementById('flash-label');
    var closeScanner = document.getElementById('close-scanner');

    var resultFound = document.getElementById('result-found');
    var resultError = document.getElementById('result-error');
    var foundClose = document.getElementById('found-close');
    var errorClose = document.getElementById('error-close');
    var foundName = document.getElementById('found-name');
    var foundBrand = document.getElementById('found-brand');
    var foundServing = document.getElementById('found-serving');
    var foundCal = document.getElementById('found-cal');
    var foundProtein = document.getElementById('found-protein');
    var foundCarbs = document.getElementById('found-carbs');
    var foundFat = document.getElementById('found-fat');
    var servingValue = document.getElementById('serving-value');
    var servingMinus = document.getElementById('serving-minus');
    var servingPlus = document.getElementById('serving-plus');
    var addToDiaryBtn = document.getElementById('add-to-diary-btn');
    var manualSearchBtn = document.getElementById('manual-search-btn');
    var customFoodBtn = document.getElementById('custom-food-btn');
    var errorTitle = document.getElementById('error-title');
    var errorMessage = document.getElementById('error-message');
    var errorIconWrap = document.getElementById('error-icon-wrap');

    function hideResults() {
      resultFound.classList.add('hidden');
      resultError.classList.add('hidden');
    }

    function showFound(product, mult) {
      currentProduct = product;
      servingMult = mult || 1;
      var nut = VF.aiFood.nutritionFromFood(product, servingMult);
      foundName.textContent = product.name;
      foundBrand.textContent = product.brand;
      foundServing.textContent = servingMult === 1 ? product.serving : servingMult + 'x ' + product.serving;
      foundCal.textContent = VF.ui.fmt(nut.calories);
      foundProtein.textContent = nut.protein + 'g';
      foundCarbs.textContent = nut.carbs + 'g';
      foundFat.textContent = nut.fat + 'g';
      servingValue.textContent = servingMult + 'x';
      resultFound.classList.remove('hidden');
      VF.ui.haptics.success();
    }

    function showError(title, message, icon) {
      errorTitle.textContent = title;
      errorMessage.textContent = message;
      errorIconWrap.innerHTML = '<span class="material-symbols-outlined text-error text-[40px]" style="font-variation-settings:\'FILL\' 1;">' + (icon || 'error_outline') + '</span>';
      resultError.classList.remove('hidden');
      VF.ui.haptics.warn();
    }

    function simulateScan() {
      scanBtn.disabled = true;
      scanLine.style.animationDuration = '1s';
      setTimeout(function () {
        scanLine.style.animationDuration = '3s';
        var codes = Object.keys(VF.aiFood.BARCODE_PRODUCTS);
        var randomCode = codes[Math.floor(Math.random() * codes.length)];
        var product = VF.aiFood.findFoodByBarcode(randomCode);
        if (product) {
          currentBarcode = randomCode;
          showFound(product, 1);
        } else {
          showError('No food found', 'No food found for this barcode.', 'search_off');
        }
        scanBtn.disabled = false;
      }, 1500);
    }

    function lookupBarcode(code) {
      var product = VF.aiFood.findFoodByBarcode(code);
      if (!product) {
        showError('No food found', 'No food found for this barcode.', 'search_off');
        return;
      }
      currentBarcode = code;
      showFound(product, 1);
    }

    scanBtn.addEventListener('click', simulateScan);
    closeScanner.addEventListener('click', function () { VF.ui.goBack('barcode_scanner'); });
    foundClose.addEventListener('click', function () { hideResults(); });
    errorClose.addEventListener('click', function () { hideResults(); });

    flashToggle.addEventListener('click', function () {
      flashOn = !flashOn;
      flashLabel.textContent = flashOn ? 'Flash On' : 'Auto-Flash';
      flashToggle.querySelector('.material-symbols-outlined').textContent = flashOn ? 'flashlight_on' : 'flashlight_off';
      VF.ui.haptics.select();
    });

    manualEntryBtn.addEventListener('click', function () {
      manualModal.classList.remove('hidden');
      barcodeInput.focus();
      VF.ui.haptics.select();
    });
    manualCancel.addEventListener('click', function () {
      manualModal.classList.add('hidden');
      barcodeInput.value = '';
    });
    manualSubmit.addEventListener('click', function () {
      var code = barcodeInput.value.trim();
      if (!code) { VF.ui.haptics.warn(); return; }
      manualModal.classList.add('hidden');
      lookupBarcode(code);
    });
    barcodeInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') manualSubmit.click();
    });

    servingMinus.addEventListener('click', function () {
      if (servingMult > 1) {
        servingMult--;
        showFound(currentProduct, servingMult);
      }
      VF.ui.haptics.select();
    });
    servingPlus.addEventListener('click', function () {
      servingMult++;
      showFound(currentProduct, servingMult);
      VF.ui.haptics.select();
    });

    addToDiaryBtn.addEventListener('click', function () {
      VF.ui.haptics.confirm();
      var nut = VF.aiFood.nutritionFromFood(currentProduct, servingMult);
      var item = {
        id: currentProduct.id,
        name: currentProduct.name,
        brand: currentProduct.brand,
        serving: servingMult === 1 ? currentProduct.serving : servingMult + 'x ' + currentProduct.serving,
        servingGrams: currentProduct.servingGrams * servingMult,
        calories: nut.calories,
        protein: nut.protein,
        carbs: nut.carbs,
        fat: nut.fat,
        confirmed: true
      };
      VF.aiFood.saveExtraction({ source: 'barcode', barcode: currentBarcode, items: [item], totalCalories: nut.calories });
      var returnTo = VF.ui.qp('returnTo') || '11_home.html';
      VF.ui.go('meal_confirm.html?returnTo=' + encodeURIComponent(returnTo));
    });

    manualSearchBtn.addEventListener('click', function () {
      hideResults();
      VF.ui.haptics.select();
      VF.ui.go('text_input.html');
    });
    customFoodBtn.addEventListener('click', function () {
      hideResults();
      VF.ui.haptics.select();
      VF.ui.go('text_input.html?mode=custom');
    });

    /* Auto-scan simulation after 3s for demo purposes */
    setTimeout(function () {
      if (resultFound.classList.contains('hidden') && resultError.classList.contains('hidden')) {
        simulateScan();
      }
    }, 3000);
  });
</script>
</body></html>
