<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Customise targets · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<!-- Screen 8 — Customise Targets (optional, uncounted).
     Full editor for calorie and macro targets with validation. -->
<body class="bg-mesh min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">

<header class="w-full mb-stack-md">
  <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm tracking-tight">Customise targets</h1>
  <p class="font-body-md text-body-md text-on-surface-variant">Adjust your daily nutrition targets. Changes save automatically.</p>
</header>

<!-- Calorie & Macro Relationship Display -->
<div class="glass-card rounded-xl p-4 mb-stack-md" id="relationship-card">
  <div class="flex items-center gap-2 mb-3">
    <span class="material-symbols-outlined text-tertiary text-[20px]" style="font-variation-settings:'FILL' 1;">analytics</span>
    <span class="font-label-lg text-label-lg text-on-surface">Macro balance</span>
  </div>
  <div class="flex gap-2" id="macro-bars">
    <div class="flex-1 h-3 bg-surface-container-highest rounded-full overflow-hidden">
      <div id="protein-bar" class="h-full bg-macro-protein rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
    <div class="flex-1 h-3 bg-surface-container-highest rounded-full overflow-hidden">
      <div id="carbs-bar" class="h-full bg-macro-carbs rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
    <div class="flex-1 h-3 bg-surface-container-highest rounded-full overflow-hidden">
      <div id="fat-bar" class="h-full bg-macro-fat rounded-full transition-all duration-300" style="width: 0%"></div>
    </div>
  </div>
  <div class="flex justify-between mt-2 text-xs text-on-surface-variant">
    <span>Protein <span id="protein-pct">—%</span></span>
    <span>Carbs <span id="carbs-pct">—%</span></span>
    <span>Fat <span id="fat-pct">—%</span></span>
  </div>
  <div class="mt-2 text-xs text-on-surface-variant/70" id="macro-summary">
    <span id="macro-calories-summary">— kcal from macros</span> · Target: <span id="target-calories-display">— kcal</span>
  </div>
  <div class="mt-1 text-xs" id="validation-message"></div>
</div>

<!-- Calories Input -->
<div class="glass-card rounded-xl p-4 mb-stack-sm">
  <label for="calories-input" class="input-label">Daily calories</label>
  <div class="flex items-center gap-3">
    <input type="number" id="calories-input" class="input-field flex-1" min="800" max="5000" step="10" inputmode="numeric">
    <span class="font-body-lg text-body-lg text-on-surface-variant whitespace-nowrap">kcal</span>
  </div>
  <div class="macro-relationship-info" id="calories-hint">Protein: —g · Carbs: —g · Fat: —g</div>
  <div id="calories-error" class="validation-error"></div>
</div>

<!-- Protein Input -->
<div class="glass-card rounded-xl p-4 mb-stack-sm">
  <label for="protein-input" class="input-label">Protein</label>
  <div class="flex items-center gap-3">
    <input type="number" id="protein-input" class="input-field flex-1" min="10" max="400" step="1" inputmode="numeric">
    <span class="font-body-lg text-body-lg text-on-surface-variant whitespace-nowrap">g</span>
  </div>
  <div class="macro-relationship-info" id="protein-hint">— kcal from protein</div>
  <div id="protein-error" class="validation-error"></div>
</div>

<!-- Carbohydrates Input -->
<div class="glass-card rounded-xl p-4 mb-stack-sm">
  <label for="carbs-input" class="input-label">Carbohydrates</label>
  <div class="flex items-center gap-3">
    <input type="number" id="carbs-input" class="input-field flex-1" min="10" max="600" step="1" inputmode="numeric">
    <span class="font-body-lg text-body-lg text-on-surface-variant whitespace-nowrap">g</span>
  </div>
  <div class="macro-relationship-info" id="carbs-hint">— kcal from carbs</div>
  <div id="carbs-error" class="validation-error"></div>
</div>

<!-- Fat Input -->
<div class="glass-card rounded-xl p-4 mb-stack-sm">
  <label for="fat-input" class="input-label">Fat</label>
  <div class="flex items-center gap-3">
    <input type="number" id="fat-input" class="input-field flex-1" min="10" max="300" step="1" inputmode="numeric">
    <span class="font-body-lg text-body-lg text-on-surface-variant whitespace-nowrap">g</span>
  </div>
  <div class="macro-relationship-info" id="fat-hint">— kcal from fat</div>
  <div id="fat-error" class="validation-error"></div>
</div>

<!-- Water Input -->
<div class="glass-card rounded-xl p-4 mb-stack-lg">
  <label for="water-input" class="input-label">Water</label>
  <div class="flex items-center gap-3">
    <input type="number" id="water-input" class="input-field flex-1" min="0.5" max="10" step="0.1" inputmode="decimal">
    <span class="font-body-lg text-body-lg text-on-surface-variant whitespace-nowrap">L</span>
  </div>
  <div class="macro-relationship-info">Daily hydration target</div>
  <div id="water-error" class="validation-error"></div>
</div>

<!-- Reset button -->
<div id="reset-container" class="mb-stack-md">
  <button class="action-button-secondary w-full" id="reset-btn">
    Reset to recommended
    <span class="material-symbols-outlined text-lg">refresh</span>
  </button>
</div>

</main>
<div class="vf-footer">
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
<div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe flex flex-col gap-3">
  <button class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20" id="save-btn" disabled>
    <span id="save-btn-text">Save targets</span>
    <span class="material-symbols-outlined text-[20px]">save</span>
  </button>
  <button class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all" id="back-to-target-btn">
    Back to target
  </button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('customize', { title: 'Customise targets' });
    if (!state) return;

    var N = VF.nutrition;

    // Get recommended and custom targets
    var recommended = state.recommended;
    var custom = state.custom;

    // DOM elements
    var caloriesInput = document.getElementById('calories-input');
    var proteinInput = document.getElementById('protein-input');
    var carbsInput = document.getElementById('carbs-input');
    var fatInput = document.getElementById('fat-input');
    var waterInput = document.getElementById('water-input');

    var caloriesError = document.getElementById('calories-error');
    var proteinError = document.getElementById('protein-error');
    var carbsError = document.getElementById('carbs-error');
    var fatError = document.getElementById('fat-error');
    var waterError = document.getElementById('water-error');

    var caloriesHint = document.getElementById('calories-hint');
    var proteinHint = document.getElementById('protein-hint');
    var carbsHint = document.getElementById('carbs-hint');
    var fatHint = document.getElementById('fat-hint');

    var proteinBar = document.getElementById('protein-bar');
    var carbsBar = document.getElementById('carbs-bar');
    var fatBar = document.getElementById('fat-bar');

    var proteinPct = document.getElementById('protein-pct');
    var carbsPct = document.getElementById('carbs-pct');
    var fatPct = document.getElementById('fat-pct');

    var macroCaloriesSummary = document.getElementById('macro-calories-summary');
    var targetCaloriesDisplay = document.getElementById('target-calories-display');
    var validationMessage = document.getElementById('validation-message');

    var resetBtn = document.getElementById('reset-btn');
    var saveBtn = document.getElementById('save-btn');
    var saveBtnText = document.getElementById('save-btn-text');
    var backToTargetBtn = document.getElementById('back-to-target-btn');

    var isSaving = false;

    // Initialize with custom values if they exist, otherwise use recommended
    function getInitialValues() {
      if (custom) {
        return {
          calories: custom.calories,
          protein: custom.protein,
          carbs: custom.carbs,
          fat: custom.fat,
          water: custom.waterL
        };
      } else if (recommended) {
        return {
          calories: recommended.calories,
          protein: recommended.protein,
          carbs: recommended.carbs,
          fat: recommended.fat,
          water: recommended.waterL
        };
      } else {
        // Fallback defaults
        return { calories: 2000, protein: 150, carbs: 200, fat: 67, water: 2.5 };
      }
    }

    var currentValues = getInitialValues();

    function setInputs(values) {
      caloriesInput.value = values.calories;
      proteinInput.value = values.protein;
      carbsInput.value = values.carbs;
      fatInput.value = values.fat;
      waterInput.value = values.water;
      currentValues = { ...values };
    }

    function updateHintsAndValidation() {
      var calories = parseInt(caloriesInput.value) || 0;
      var protein = parseInt(proteinInput.value) || 0;
      var carbs = parseInt(carbsInput.value) || 0;
      var fat = parseInt(fatInput.value) || 0;
      var water = parseFloat(waterInput.value) || 0;

      currentValues = { calories, protein, carbs, fat, water };

      // Calculate macro calories
      var proteinCal = protein * 4;
      var carbsCal = carbs * 4;
      var fatCal = fat * 9;
      var totalMacroCal = proteinCal + carbsCal + fatCal;

      // Update hints
      caloriesHint.textContent = 'Protein: ' + protein + 'g (' + proteinCal + ' cal) · Carbs: ' + carbs + 'g (' + carbsCal + ' cal) · Fat: ' + fat + 'g (' + fatCal + ' cal)';
      proteinHint.textContent = proteinCal + ' kcal from protein';
      carbsHint.textContent = carbsCal + ' kcal from carbs';
      fatHint.textContent = fatCal + ' kcal from fat';

      // Update macro bars
      if (totalMacroCal > 0) {
        var proteinPercent = Math.round((proteinCal / totalMacroCal) * 100);
        var carbsPercent = Math.round((carbsCal / totalMacroCal) * 100);
        var fatPercent = Math.round((fatCal / totalMacroCal) * 100);

        proteinBar.style.width = proteinPercent + '%';
        carbsBar.style.width = carbsPercent + '%';
        fatBar.style.width = fatPercent + '%';

        proteinPct.textContent = proteinPercent + '%';
        carbsPct.textContent = carbsPercent + '%';
        fatPct.textContent = fatPercent + '%';
      } else {
        proteinBar.style.width = '0%';
        carbsBar.style.width = '0%';
        fatBar.style.width = '0%';
        proteinPct.textContent = '—%';
        carbsPct.textContent = '—%';
        fatPct.textContent = '—%';
      }

      macroCaloriesSummary.textContent = totalMacroCal + ' kcal from macros';
      targetCaloriesDisplay.textContent = calories + ' kcal';

      // Validation using VF.nutrition.checkMacros
      var target = { calories: calories, protein: protein, carbs: carbs, fat: fat };
      var check = N.checkMacros(target);
      var diff = check.diff;
      var tolerance = check.tolerance;
      var withinTolerance = check.withinTolerance;

      // Clear previous errors
      caloriesError.textContent = '';
      proteinError.textContent = '';
      carbsError.textContent = '';
      fatError.textContent = '';
      waterError.textContent = '';
      validationMessage.textContent = '';
      validationMessage.className = 'text-xs mt-1';

      var isValid = true;

      // Validate calories range
      if (calories < 800 || calories > 5000) {
        caloriesError.textContent = 'Calories must be between 800 and 5000';
        isValid = false;
      }

      // Validate protein range
      if (protein < 10 || protein > 400) {
        proteinError.textContent = 'Protein must be between 10g and 400g';
        isValid = false;
      }

      // Validate carbs range
      if (carbs < 10 || carbs > 600) {
        carbsError.textContent = 'Carbs must be between 10g and 600g';
        isValid = false;
      }

      // Validate fat range
      if (fat < 10 || fat > 300) {
        fatError.textContent = 'Fat must be between 10g and 300g';
        isValid = false;
      }

      // Validate water range
      if (water < 0.5 || water > 10) {
        waterError.textContent = 'Water must be between 0.5L and 10L';
        isValid = false;
      }

      // Validate macro/calorie alignment
      if (!withinTolerance) {
        var absDiff = Math.abs(diff);
        var message = 'Macros total ' + totalMacroCal + ' kcal but target is ' + calories + ' kcal (diff: ' + (diff > 0 ? '+' : '') + diff + ' kcal). ';
        if (diff > 0) {
          message += 'Reduce macros or increase calories.';
        } else {
          message += 'Increase macros or reduce calories.';
        }
        caloriesError.textContent = message;
        validationMessage.textContent = message;
        validationMessage.classList.add('vf-error');
        isValid = false;
      } else if (totalMacroCal > 0) {
        validationMessage.textContent = 'Macros align with calorie target ✓';
        validationMessage.classList.add('text-secondary');
      }

      // Enable/disable save button
      if (!isSaving) {
        VF.ui.gate(saveBtn, isValid);
      }

      return isValid;
    }

    function setSaving(saving) {
      isSaving = saving;
      if (saving) {
        saveBtn.disabled = true;
        saveBtnText.textContent = 'Saving…';
        saveBtn.querySelector('.material-symbols-outlined').textContent = 'hourglass_top';
      } else {
        VF.ui.gate(saveBtn, updateHintsAndValidation());
        saveBtnText.textContent = 'Save targets';
        saveBtn.querySelector('.material-symbols-outlined').textContent = 'save';
      }
    }

    function saveTargets() {
      var isValid = updateHintsAndValidation();
      if (!isValid) {
        VF.ui.haptics.warn();
        return;
      }

      setSaving(true);
      VF.ui.haptics.confirm();

      var calories = parseInt(caloriesInput.value);
      var protein = parseInt(proteinInput.value);
      var carbs = parseInt(carbsInput.value);
      var fat = parseInt(fatInput.value);
      var water = parseFloat(waterInput.value);

      var customTarget = {
        calories: calories,
        protein: protein,
        carbs: carbs,
        fat: fat,
        waterL: water,
        glasses: Math.max(6, Math.round((water * 1000) / 300)),
        basis: 'custom',
        calculatedAt: new Date().toISOString()
      };

      // Persist both recommended (unchanged) and custom
      VF.store.patch({
        custom: customTarget,
        targetsSource: 'custom'
      });

      // Show success feedback
      saveBtnText.textContent = 'Saved!';
      saveBtn.querySelector('.material-symbols-outlined').textContent = 'check';
      saveBtn.classList.add('bg-primary/90');
      VF.ui.haptics.success();

      setTimeout(function () {
        setSaving(false);
        // Navigate to permissions after saving custom targets
        VF.ui.go('09_permissions.html');
      }, 1000);
    }

    function resetToRecommended() {
      if (!recommended) return;

      VF.ui.haptics.select();

      setInputs({
        calories: recommended.calories,
        protein: recommended.protein,
        carbs: recommended.carbs,
        fat: recommended.fat,
        water: recommended.waterL
      });

      updateHintsAndValidation();
      VF.ui.snackbar('Reset to recommended targets', 'info');
    }

    // Event listeners
    caloriesInput.addEventListener('input', updateHintsAndValidation);
    proteinInput.addEventListener('input', updateHintsAndValidation);
    carbsInput.addEventListener('input', updateHintsAndValidation);
    fatInput.addEventListener('input', updateHintsAndValidation);
    waterInput.addEventListener('input', updateHintsAndValidation);

    resetBtn.addEventListener('click', resetToRecommended);
    saveBtn.addEventListener('click', saveTargets);
    backToTargetBtn.addEventListener('click', function () {
      VF.ui.haptics.select();
      VF.ui.goBack('customize');
    });

    // Initialize
    setInputs(currentValues);
    updateHintsAndValidation();
  });
</script>
</body></html>
