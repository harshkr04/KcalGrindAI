<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Create Recipe · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen antialiased flex flex-col md:max-w-screen-xl md:mx-auto">
<!-- TopAppBar -->
<header class="fixed top-0 w-full max-w-md mx-auto z-50 glass-effect">
<div class="flex items-center justify-between p-4 pb-2">
<button id="back-btn" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" aria-label="Go back">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-title-lg text-title-lg text-on-surface font-semibold">Create Recipe</h1>
<div class="w-10 h-10" aria-hidden="true"></div>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 px-margin-mobile py-stack-md md:px-margin-tablet pb-32">
<!-- Recipe Header -->
<div class="mb-stack-lg">
<label class="block mb-2">
<span class="font-label-lg text-label-lg text-on-surface-variant">Recipe Photo</span>
<div class="relative w-full h-48 rounded-xl overflow-hidden border border-outline-variant/30 bg-surface-container-high flex items-center justify-center">
<input type="file" id="photo-input" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
<div id="photo-preview" class="hidden absolute inset-0 w-full h-full">
<img id="preview-img" src="" alt="Recipe photo" class="w-full h-full object-cover">
</div>
<div id="photo-placeholder" class="flex flex-col items-center gap-2 text-on-surface-variant">
<span class="material-symbols-outlined text-4xl">add_photo_alternate</span>
<span class="font-body-md text-body-md">Tap to add photo</span>
</div>
</div>
</label>
</div>

<!-- Recipe Name -->
<div class="mb-stack-md">
<label class="block mb-2 font-label-lg text-label-lg text-on-surface-variant">Recipe Name</label>
<input type="text" id="recipe-name" class="w-full h-14 px-4 bg-surface-container-low border border-outline-variant/30 rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" placeholder="e.g., Chicken Stir Fry">
</div>

<!-- Servings -->
<div class="mb-stack-md">
<label class="block mb-2 font-label-lg text-label-lg text-on-surface-variant">Servings</label>
<div class="flex items-center gap-4">
<button id="servings-decrease" class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" aria-label="Decrease servings">
<span class="material-symbols-outlined">remove</span>
</button>
<input type="number" id="servings-input" class="flex-1 h-14 text-center bg-surface-container-low border border-outline-variant/30 rounded-xl font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" value="4" min="1" max="20">
<button id="servings-increase" class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" aria-label="Increase servings">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</div>

<!-- Ingredients -->
<div class="mb-stack-lg">
<div class="flex justify-between items-center mb-stack-sm">
<h3 class="font-title-lg text-title-lg text-on-surface">Ingredients</h3>
<button id="add-ingredient-btn" class="text-primary font-label-lg text-label-lg flex items-center gap-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-size: 20px;">add</span> Add Ingredient
</button>
</div>
<div id="ingredients-list" class="flex flex-col gap-2">
</div>
</div>

<!-- Instructions -->
<div class="mb-stack-lg">
<div class="flex justify-between items-center mb-stack-sm">
<h3 class="font-title-lg text-title-lg text-on-surface">Instructions</h3>
<button id="add-instruction-btn" class="text-primary font-label-lg text-label-lg flex items-center gap-1 active:scale-95 transition-transform">
<span class="material-symbols-outlined" style="font-size: 20px;">add</span> Add Step
</button>
</div>
<div id="instructions-list" class="flex flex-col gap-2">
</div>
</div>
</main>
<!-- Fixed Bottom Actions -->
<div class="fixed bottom-0 left-0 w-full max-w-md mx-auto z-40 bg-surface/90 backdrop-blur-xl border-t border-outline-variant/30 p-4 pb-safe shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
<div class="flex gap-3">
<button id="cancel-btn" class="flex-1 bg-surface-container-high/60 backdrop-blur-sm text-on-surface font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 border border-outline-variant/30 hover:bg-surface-variant/80 transition-colors active:scale-[0.98]">
Cancel
</button>
<button id="save-btn" class="flex-1 bg-primary text-on-primary font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined">save</span>
Save Recipe
</button>
</div>
</div>
<script>
(function () {
  'use strict';

  var ingredientCount = 0;
  var instructionCount = 0;

  var elements = {
    photoInput: document.getElementById('photo-input'),
    photoPreview: document.getElementById('photo-preview'),
    previewImg: document.getElementById('preview-img'),
    photoPlaceholder: document.getElementById('photo-placeholder'),
    recipeName: document.getElementById('recipe-name'),
    servingsInput: document.getElementById('servings-input'),
    servingsDecrease: document.getElementById('servings-decrease'),
    servingsIncrease: document.getElementById('servings-increase'),
    ingredientsList: document.getElementById('ingredients-list'),
    addIngredientBtn: document.getElementById('add-ingredient-btn'),
    instructionsList: document.getElementById('instructions-list'),
    addInstructionBtn: document.getElementById('add-instruction-btn'),
    cancelBtn: document.getElementById('cancel-btn'),
    saveBtn: document.getElementById('save-btn'),
    backBtn: document.getElementById('back-btn')
  };

  function init() {
    elements.photoInput.addEventListener('change', handlePhotoSelect);
    elements.servingsDecrease.addEventListener('click', function () {
      var val = parseInt(elements.servingsInput.value) || 1;
      if (val > 1) elements.servingsInput.value = val - 1;
    });
    elements.servingsIncrease.addEventListener('click', function () {
      var val = parseInt(elements.servingsInput.value) || 1;
      if (val < 20) elements.servingsInput.value = val + 1;
    });
    elements.addIngredientBtn.addEventListener('click', addIngredient);
    elements.addInstructionBtn.addEventListener('click', addInstruction);
    elements.cancelBtn.addEventListener('click', goBack);
    elements.saveBtn.addEventListener('click', saveRecipe);
    elements.backBtn.addEventListener('click', goBack);

    addIngredient();
    addInstruction();

    VF.ui.announce('Create recipe');
  }

  function handlePhotoSelect(e) {
    var file = e.target.files[0];
    if (!file || !file.type.startsWith('image/')) return;
    var url = URL.createObjectURL(file);
    elements.previewImg.src = url;
    elements.photoPreview.hidden = false;
    elements.photoPlaceholder.hidden = true;
  }

  function addIngredient() {
    ingredientCount++;
    var div = document.createElement('div');
    div.className = 'bg-surface-container-lowest border border-outline-variant/30 rounded-lg p-3 flex items-center gap-3 shadow-sm';
    div.innerHTML =
      '<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center text-on-surface-variant shrink-0">' +
      '<span class="material-symbols-outlined">restaurant</span>' +
      '</div>' +
      '<div class="flex-1 flex flex-col gap-1 min-w-0">' +
      '<input type="text" class="w-full bg-transparent border-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="Ingredient name (e.g., Chicken breast)">' +
      '<input type="text" class="w-full bg-transparent border-none focus:ring-0 font-label-sm text-label-sm text-on-surface-variant placeholder:text-on-surface-variant" placeholder="Amount (e.g., 200g)">' +
      '</div>' +
      '<button class="p-2 text-on-surface-variant hover:text-error transition-colors rounded-full hover:bg-error-container/20" aria-label="Remove ingredient">' +
      '<span class="material-symbols-outlined">delete</span>' +
      '</button>';
    div.querySelector('button').addEventListener('click', function () {
      VF.ui.haptics.select();
      div.remove();
      updateIngredientNumbers();
    });
    elements.ingredientsList.appendChild(div);
    updateIngredientNumbers();
  }

  function updateIngredientNumbers() {
    var items = elements.ingredientsList.querySelectorAll('div');
  }

  function addInstruction() {
    instructionCount++;
    var div = document.createElement('div');
    div.className = 'bg-surface-container-lowest border border-outline-variant/30 rounded-lg p-3 flex items-start gap-3 shadow-sm';
    div.innerHTML =
      '<span class="w-8 h-8 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center shrink-0 font-label-lg text-label-lg">' + instructionCount + '</span>' +
      '<textarea class="flex-1 h-20 bg-transparent border-none resize-none focus:ring-0 font-body-md text-body-md text-on-surface placeholder:text-on-surface-variant" placeholder="Step ' + instructionCount + ': Describe what to do..."></textarea>' +
      '<button class="p-2 text-on-surface-variant hover:text-error transition-colors rounded-full hover:bg-error-container/20 shrink-0" aria-label="Remove step">' +
      '<span class="material-symbols-outlined">delete</span>' +
      '</button>';
    div.querySelector('button').addEventListener('click', function () {
      VF.ui.haptics.select();
      div.remove();
      renumberInstructions();
    });
    elements.instructionsList.appendChild(div);
  }

  function renumberInstructions() {
    var items = elements.instructionsList.querySelectorAll('div');
    items.forEach(function (item, index) {
      var num = item.querySelector('span');
      if (num) num.textContent = index + 1;
      var textarea = item.querySelector('textarea');
      if (textarea) textarea.placeholder = 'Step ' + (index + 1) + ': Describe what to do...';
    });
    instructionCount = items.length;
  }

  function saveRecipe() {
    var name = elements.recipeName.value.trim();
    if (!name) {
      VF.ui.snackbar('Please enter a recipe name');
      elements.recipeName.focus();
      return;
    }

    VF.ui.haptics.confirm();
    VF.ui.announce('Recipe saved: ' + name);

    var ingredients = [];
    elements.ingredientsList.querySelectorAll('div').forEach(function (div) {
      var inputs = div.querySelectorAll('input');
      if (inputs[0].value.trim()) {
        ingredients.push({
          name: inputs[0].value.trim(),
          amount: inputs[1].value.trim()
        });
      }
    });

    var instructions = [];
    elements.instructionsList.querySelectorAll('div').forEach(function (div) {
      var textarea = div.querySelector('textarea');
      if (textarea.value.trim()) {
        instructions.push(textarea.value.trim());
      }
    });

    var recipe = {
      id: 'recipe_' + Date.now(),
      name: name,
      servings: parseInt(elements.servingsInput.value) || 1,
      ingredients: ingredients,
      instructions: instructions,
      createdAt: new Date().toISOString()
    };

    try {
      var recipes = JSON.parse(localStorage.getItem('vitality.recipes') || '[]');
      recipes.unshift(recipe);
      localStorage.setItem('vitality.recipes', JSON.stringify(recipes));
    } catch (e) {
      console.warn('Could not save recipe:', e);
    }

    VF.ui.snackbar('Recipe saved!', 'check_circle');
    setTimeout(function () { VF.ui.go('11_home.html'); }, 800);
  }

  function goBack() {
    VF.ui.haptics.select();
    VF.ui.goBack('food_editing');
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body></html>
