<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Clarify Food · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/ai_service.js"></script>
</head>
<body class="bg-surface text-on-surface font-body-md antialiased min-h-screen flex flex-col relative overflow-x-hidden">
<!-- Top App Bar -->
<header class="bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md fixed top-0 w-full max-w-md mx-auto z-50 flex items-center justify-between px-margin-mobile h-16 transition-all duration-300 shadow-sm">
<div class="flex items-center gap-3">
<button id="back-btn" aria-label="Go back" class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary dark:text-primary-fixed">Clarify Food</h1>
</div>
<div class="flex items-center gap-2"></div>
</header>

<!-- Main Content Canvas -->
<main class="flex-grow pt-[88px] pb-[100px] px-margin-mobile md:px-margin-tablet max-w-[840px] mx-auto w-full flex flex-col items-center justify-center min-h-screen">
<div class="w-full max-w-lg flex flex-col gap-stack-lg">
<!-- AI Conversational Header -->
<div class="text-center flex flex-col items-center gap-stack-sm animate-fade-in-up">
<div class="w-12 h-12 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center mb-2 shadow-sm">
<span class="material-symbols-outlined text-title-lg" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
</div>
<h2 class="font-display-lg text-[36px] leading-[44px] tracking-tight font-light text-primary">Need a little help here.</h2>
<p id="clarify-text" class="font-body-lg text-body-lg text-on-surface-variant max-w-[300px]">I recognized the food category, but need help identifying the specific item.</p>
</div>

<!-- Options Grid -->
<div class="grid grid-cols-1 sm:grid-cols-2 gap-gutter w-full" id="options-grid">
</div>

<!-- Custom Entry -->
<div class="flex flex-col items-center gap-3 mt-4">
<button id="custom-entry-btn" class="font-label-lg text-label-lg text-outline hover:text-primary transition-colors underline decoration-outline/30 hover:decoration-primary/50 underline-offset-4 py-2 px-4 rounded-full hover:bg-surface-variant/20 w-full max-w-xs text-center">
Neither, let me type it
</button>
<button id="search-else-btn" class="w-full max-w-xs bg-tertiary text-on-tertiary font-label-lg text-label-lg rounded-full py-3 px-6 flex items-center justify-center gap-2 shadow-md hover:bg-tertiary/90 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined">search</span>
Something else — Search
</button>
</div>

<!-- Reference Image (small) -->
<div id="reference-section" class="hidden mt-6">
<div class="relative w-full h-40 rounded-xl overflow-hidden shadow-sm border border-outline-variant/30">
<img id="reference-img" src="" alt="Reference photo" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent pointer-events-none"></div>
<div class="absolute bottom-3 left-3 flex items-center gap-1 bg-surface/80 backdrop-blur-sm px-2 py-1 rounded-md">
<span class="material-symbols-outlined text-primary text-[14px]">auto_awesome</span>
<span class="font-label-sm text-label-sm text-primary">Your Photo</span>
</div>
</div>
</div>
</div>
</main>

<script>
(function () {
  'use strict';

  var result = null;
  var selectedFood = null;

  var elements = {
    clarifyText: document.getElementById('clarify-text'),
    optionsGrid: document.getElementById('options-grid'),
    customEntryBtn: document.getElementById('custom-entry-btn'),
    searchElseBtn: document.getElementById('search-else-btn'),
    backBtn: document.getElementById('back-btn'),
    referenceSection: document.getElementById('reference-section'),
    referenceImg: document.getElementById('reference-img')
  };

  function init() {
    var stored = null;
    try {
      stored = sessionStorage.getItem('vf.aiResult');
    } catch (e) {}

    if (!stored) {
      VF.ui.snackbar('No analysis result found.');
      setTimeout(function () { VF.ui.go('camera.html'); }, 1500);
      return;
    }

    try {
      result = JSON.parse(stored);
    } catch (e) {
      VF.ui.snackbar('Invalid result data.');
      setTimeout(function () { VF.ui.go('camera.html'); }, 1500);
      return;
    }

    if (!result.foods || result.foods.length === 0) {
      VF.ui.go('food_error.html');
      return;
    }

    if (result.imageUrl) {
      elements.referenceImg.src = result.imageUrl;
      elements.referenceSection.hidden = false;
    }

    populateOptions();
    setupEventListeners();
    VF.ui.announce('Food clarification needed. Please select the correct item.');
  }

  function populateOptions() {
    var foods = result.foods;
    elements.optionsGrid.innerHTML = '';

    if (foods.length === 1) {
      elements.clarifyText.textContent = 'I\'m not completely sure about this food. Is this correct?';
    } else {
      elements.clarifyText.textContent = 'I recognized the food category, but which specific item is it?';
    }

    foods.forEach(function (food, index) {
      var confidence = food.confidence || VF.ai.CONFIDENCE_LEVELS.MEDIUM;
      var confidenceLabel = VF.ai.getConfidenceLabel(confidence);
      var confidenceColor = VF.ai.getConfidenceColor(confidence);

      var button = document.createElement('button');
      button.className = 'group flex flex-col text-left surface-glass rounded-xl overflow-hidden card-level-1 hover:ai-shadow transition-all duration-300 active:scale-98 focus:outline-none focus:ring-2 focus:ring-primary focus:ring-offset-2 focus:ring-offset-surface';
      button.dataset.foodId = food.id;

      button.innerHTML =
        '<div class="w-full h-40 sm:h-48 relative overflow-hidden bg-surface-container-high">' +
        (food.imageUrl ? '<img alt="' + food.name + '" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" src="' + food.imageUrl + '">' : '<div class="w-full h-full flex items-center justify-center"><span class="material-symbols-outlined text-on-surface-variant text-4xl">restaurant</span></div>') +
        '<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent"></div>' +
        '<div class="absolute bottom-3 left-3 flex items-center gap-1 bg-surface/80 backdrop-blur-sm px-2 py-1 rounded-md">' +
        '<span class="material-symbols-outlined text-[14px] ' + confidenceColor + '" style="font-variation-settings: \'FILL\' 1;">' + VF.ai.getConfidenceIcon(confidence) + '</span>' +
        '<span class="font-label-sm text-label-sm ' + confidenceColor + '">Est. ' + food.calories + ' kcal</span>' +
        '</div>' +
        '</div>' +
        '<div class="p-4 flex flex-col gap-1 bg-surface-bright/50">' +
        '<h3 class="font-title-lg text-title-lg text-on-surface group-hover:text-primary transition-colors">' + food.name + '</h3>' +
        '<p class="font-body-md text-body-md text-on-surface-variant line-clamp-2">' + food.portion + ' · ' + food.macros.protein + 'g protein · ' + food.macros.carbs + 'g carbs · ' + food.macros.fat + 'g fat</p>' +
        '</div>';

      button.addEventListener('click', function () {
        selectFood(food);
      });

      elements.optionsGrid.appendChild(button);
    });
  }

  function selectFood(food) {
    VF.ui.haptics.confirm();
    selectedFood = food;

    var buttons = elements.optionsGrid.querySelectorAll('button');
    buttons.forEach(function (btn) {
      btn.classList.remove('ring-2', 'ring-primary', 'bg-primary-container/20');
      if (btn.dataset.foodId === food.id) {
        btn.classList.add('ring-2', 'ring-primary', 'bg-primary-container/20');
      }
    });

    setTimeout(function () {
      var singleResult = {
        imageUrl: result.imageUrl,
        foods: [food],
        totalCalories: food.calories,
        totalMacros: food.macros,
        overallConfidence: VF.ai.CONFIDENCE_LEVELS.HIGH,
        insights: 'Confirmed: ' + food.name,
        tags: food.tags || []
      };
      sessionStorage.setItem('vf.aiResult', JSON.stringify(singleResult));
      VF.ui.go('food_result.html');
    }, 150);
  }

  function setupEventListeners() {
    elements.backBtn.addEventListener('click', goBack);
    elements.customEntryBtn.addEventListener('click', customEntry);
    elements.searchElseBtn.addEventListener('click', searchSomethingElse);
  }

  function searchSomethingElse() {
    VF.ui.haptics.select();
    VF.ui.announce('Search for a different food');
    VF.ui.go('food_search.html');
  }

  function goBack() {
    VF.ui.haptics.select();
    VF.ui.goBack('food_clarify');
  }

  function customEntry() {
    VF.ui.haptics.select();
    VF.ui.go('ai_chat.html');
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
<style>
@keyframes fadeInUp {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.animate-fade-in-up { animation: fadeInUp 0.6s ease-out forwards; }

.surface-glass {
  background-color: rgba(248, 250, 249, 0.6);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}
.ai-shadow { box-shadow: 0 8px 32px rgba(15, 82, 56, 0.12); }
.card-level-1 { border: 1px solid rgba(112, 121, 115, 0.1); }
</style>
</body></html>
