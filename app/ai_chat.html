<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>AI Chat · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/diary.js"></script>
<script src="shared/ai_assistant.js"></script>
</head>
<!-- AI Chat — Conversational interface for the AI Nutrition Assistant.
     Supports: text | summary | recommendation | food_log
     States: idle | typing | thinking | streaming | error | offline -->
<body class="bg-background text-on-background min-h-screen flex flex-col items-center justify-start pb-24 relative overflow-x-hidden">
<!-- Top App Bar -->
<header class="w-full max-w-md mx-auto sticky top-0 z-50 glass-effect">
<div class="flex items-center justify-between p-4 pb-2">
<div class="flex items-center gap-2">
<button id="back-btn" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div>
<p class="font-label-sm text-label-sm text-on-surface-variant font-medium">AI Assistant</p>
<h2 class="font-title-lg text-[18px] text-on-surface font-bold leading-tight tracking-[-0.015em]">Chat</h2>
</div>
</div>
<button id="clear-chat" class="font-label-sm text-label-sm text-primary hover:underline">Clear</button>
<button id="insights-btn" class="font-label-sm text-label-sm text-primary hover:underline ml-2">Insights</button>
</div>
</header>

<main class="w-full max-w-md mx-auto flex-1 px-container-padding flex flex-col gap-4 pt-4">
  <!-- Messages -->
  <div id="chat-messages" class="flex flex-col gap-4"></div>

  <!-- Typing Indicator -->
  <div id="typing-indicator" class="hidden items-center gap-2">
    <div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined text-on-secondary-container text-[18px]" style="font-variation-settings:'FILL' 1;">auto_awesome</span>
    </div>
    <div class="bg-surface-container-low rounded-2xl rounded-tl-sm px-4 py-3 border border-outline-variant/20">
      <div class="flex gap-1">
        <div class="w-2 h-2 bg-on-surface-variant/50 rounded-full animate-bounce" style="animation-delay:0s"></div>
        <div class="w-2 h-2 bg-on-surface-variant/50 rounded-full animate-bounce" style="animation-delay:0.2s"></div>
        <div class="w-2 h-2 bg-on-surface-variant/50 rounded-full animate-bounce" style="animation-delay:0.4s"></div>
      </div>
    </div>
  </div>
</main>

<!-- Input Area -->
<div class="fixed bottom-0 left-0 w-full z-50 p-margin-mobile pb-safe bg-gradient-to-t from-surface via-surface/90 to-transparent">
  <div class="max-w-md mx-auto">
    <div class="flex items-end gap-2 bg-surface-container-low rounded-[24px] border border-outline-variant/30 shadow-sm focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
      <textarea id="chat-input" class="flex-1 bg-transparent border-none focus:ring-0 resize-none py-3 pl-4 pr-2 font-body-md text-body-md text-on-surface placeholder:text-outline max-h-[120px] overflow-y-auto" placeholder="Ask about your meals and nutrition..." rows="1" style="min-height:48px"></textarea>
      <button id="send-btn" class="w-10 h-10 rounded-full bg-primary text-on-primary flex items-center justify-center shrink-0 mr-2 mb-2 hover:bg-primary/90 active:scale-90 transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
        <span class="material-symbols-outlined text-[20px]">send</span>
      </button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var messagesEl = document.getElementById('chat-messages');
    var typingEl = document.getElementById('typing-indicator');
    var input = document.getElementById('chat-input');
    var sendBtn = document.getElementById('send-btn');
    var backBtn = document.getElementById('back-btn');
    var clearBtn = document.getElementById('clear-chat');
    var prompt = VF.ui.qp('prompt');

    function scrollToBottom() {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function addUserMessage(text) {
      var div = document.createElement('div');
      div.className = 'flex justify-end';
      div.innerHTML = '<div class="bg-primary text-on-primary rounded-2xl rounded-tr-sm px-4 py-3 max-w-[85%] shadow-sm"><p class="font-body-md text-body-md">' + escapeHtml(text) + '</p></div>';
      messagesEl.appendChild(div);
      scrollToBottom();
    }

    function addAIMessage(content) {
      var div = document.createElement('div');
      div.className = 'flex items-start gap-2 max-w-[90%]';
      var icon = '<div class="w-8 h-8 rounded-full bg-secondary-container flex items-center justify-center shrink-0 mb-1"><span class="material-symbols-outlined text-on-secondary-container text-[18px]" style="font-variation-settings:\'FILL\' 1;">auto_awesome</span></div>';
      var body = '';
      if (content.type === 'text') {
        body = '<div class="bg-surface-container-low text-on-surface rounded-2xl rounded-tl-sm px-4 py-3 border border-outline-variant/20 shadow-sm"><p class="font-body-md text-body-md">' + escapeHtml(content.text) + '</p></div>';
      } else if (content.type === 'summary') {
        body = '<div class="bg-surface-container-low text-on-surface rounded-2xl rounded-tl-sm px-4 py-3 border border-outline-variant/20 shadow-sm"><p class="font-body-md text-body-md font-semibold mb-2">' + escapeHtml(content.title || 'Summary') + '</p><p class="font-body-md text-body-md whitespace-pre-line">' + escapeHtml((content.lines || []).join('\n')) + '</p>' + (content.insight ? '<p class="font-body-md text-body-md text-on-surface-variant mt-2 italic">' + escapeHtml(content.insight) + '</p>' : '') + '</div>';
      } else if (content.type === 'recommendation') {
        var m = content.meal || {};
        body = '<div class="bg-surface-container-low text-on-surface rounded-2xl rounded-tl-sm px-4 py-3 border border-outline-variant/20 shadow-sm">' +
          '<p class="font-body-md text-body-md font-semibold mb-1">' + escapeHtml(content.title || 'Suggestion') + '</p>' +
          '<p class="font-body-lg text-body-lg text-primary mb-2">' + escapeHtml(m.title || 'Meal') + '</p>' +
          '<p class="font-body-md text-body-md mb-1">' + VF.ui.fmt(m.calories || 0) + ' kcal</p>' +
          '<p class="font-body-md text-body-md text-on-surface-variant mb-3">P ' + (m.protein || 0) + 'g · C ' + (m.carbs || 0) + 'g · F ' + (m.fat || 0) + 'g</p>' +
          '<div class="flex gap-2">' +
            '<button class="log-rec font-label-sm text-label-sm bg-tertiary text-on-tertiary px-3 py-1.5 rounded-full hover:bg-tertiary/90 active:scale-95 transition-all">Log Meal</button>' +
            '<button class="dismiss-rec font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high px-3 py-1.5 rounded-full transition-colors">Dismiss</button>' +
          '</div></div>';
      } else if (content.type === 'food_log') {
        body = '<div class="bg-surface-container-low text-on-surface rounded-2xl rounded-tl-sm px-4 py-3 border border-outline-variant/20 shadow-sm">' +
          '<p class="font-body-md text-body-md mb-2">' + escapeHtml(content.text || '') + '</p>' +
          '<div class="flex gap-2">' +
            '<button class="log-ai-food font-label-sm text-label-sm bg-tertiary text-on-tertiary px-3 py-1.5 rounded-full hover:bg-tertiary/90 active:scale-95 transition-all">Log to Diary</button>' +
            '<button class="edit-ai-food font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-high px-3 py-1.5 rounded-full transition-colors">Edit</button>' +
          '</div></div>';
      }
      div.innerHTML = icon + body;
      messagesEl.appendChild(div);
      scrollToBottom();

      if (content.type === 'recommendation') {
        div.querySelector('.log-rec').addEventListener('click', function () {
          VF.ui.haptics.confirm();
          var m = content.meal || {};
          VF.aiFood.saveExtraction({ source: 'ai_recommendation', items: [{ id: 'rec_' + Date.now(), name: m.title || 'Meal', serving: '1 serving', servingGrams: 100, calories: m.calories || 0, protein: m.protein || 0, carbs: m.carbs || 0, fat: m.fat || 0 }], totalCalories: m.calories || 0 });
          VF.ui.go('meal_confirm.html?mealType=snack&returnTo=ai_chat.html');
        });
        div.querySelector('.dismiss-rec').addEventListener('click', function () {
          div.remove();
          VF.ui.haptics.select();
        });
      }
      if (content.type === 'food_log') {
        var aiData = content;
        div.querySelector('.log-ai-food').addEventListener('click', function () {
          VF.ui.haptics.confirm();
          VF.aiFood.saveExtraction({ source: 'ai_chat', items: aiData.items, totalCalories: aiData.total, transcript: aiData.text });
          VF.ui.go('meal_confirm.html?mealType=snack&returnTo=ai_chat.html');
        });
        div.querySelector('.edit-ai-food').addEventListener('click', function () {
          VF.ui.haptics.select();
          VF.aiFood.saveExtraction({ source: 'ai_chat', items: aiData.items, totalCalories: aiData.total, transcript: aiData.text });
          VF.ui.go('ai_food_review.html?returnTo=ai_chat.html');
        });
      }
    }

    function escapeHtml(str) {
      return (str || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function showTyping(show) {
      typingEl.classList.toggle('hidden', !show);
      typingEl.classList.toggle('flex', show);
      if (show) scrollToBottom();
    }

    function handleSend() {
      var text = input.value.trim();
      if (!text) return;
      addUserMessage(text);
      input.value = '';
      input.style.height = 'auto';
      sendBtn.disabled = true;
      showTyping(true);

      setTimeout(function () {
        showTyping(false);
        try {
          var response = VF.aiAssistant.generateResponse(text);
          VF.aiAssistant.addToHistory('assistant', response.text || response.title || '', response);
          addAIMessage(response);
        } catch (e) {
          addAIMessage({ type: 'text', text: 'I couldn\'t process that. Please try again.' });
        }
      }, 600 + Math.random() * 800);
    }

    input.addEventListener('input', function () {
      sendBtn.disabled = !input.value.trim();
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 120) + 'px';
    });

    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
    });

    sendBtn.addEventListener('click', handleSend);
    backBtn.addEventListener('click', function () { VF.ui.haptics.select(); VF.ui.go('ai_assistant.html'); });
    clearBtn.addEventListener('click', function () { VF.aiAssistant.clearHistory(); messagesEl.innerHTML = ''; VF.ui.haptics.select(); });
    document.getElementById('insights-btn').addEventListener('click', function () { VF.ui.haptics.select(); VF.ui.go('insights.html'); });

    if (prompt) {
      input.value = prompt;
      sendBtn.disabled = false;
      handleSend();
    }
  });
</script>
</body></html>
