<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Analysis Error · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/ai_service.js"></script>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden px-margin-mobile">
<!-- Top App Bar (minimal) -->
<header class="fixed top-0 w-full max-w-md mx-auto z-50 flex items-center justify-between p-4 h-16">
<button id="back-btn" class="w-10 h-10 rounded-full bg-surface-container flex items-center justify-center text-on-surface hover:bg-surface-container-high transition-colors active:scale-95" aria-label="Go back">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<div class="w-10 h-10" aria-hidden="true"></div>
</header>

<main class="flex-1 flex flex-col items-center justify-center pt-20 pb-24 px-container-padding text-center">
<div class="w-full max-w-sm">
<!-- Error State Container -->
<div id="error-container" class="flex flex-col items-center gap-stack-lg">

<!-- Icon -->
<div id="error-icon-wrapper" class="w-24 h-24 rounded-full flex items-center justify-center">
<span id="error-icon" class="material-symbols-outlined text-4xl">error</span>
</div>

<!-- Title & Message -->
<div>
<h2 id="error-title" class="font-title-lg text-title-lg text-on-surface mb-stack-sm">Analysis Failed</h2>
<p id="error-message" class="font-body-md text-body-md text-on-surface-variant">We couldn't analyze your meal. Please try again.</p>
</div>

<!-- Actions -->
<div id="error-actions" class="flex flex-col sm:flex-row gap-3 w-full justify-center">
</div>

<!-- Help Text -->
<div id="help-text" class="hidden font-label-sm text-label-sm text-on-surface-variant/70">
</div>
</div>

<!-- Reference Image (if available) -->
<div id="reference-section" class="hidden mt-8">
<div class="relative w-full h-48 rounded-xl overflow-hidden shadow-sm border border-outline-variant/30">
<img id="reference-img" src="" alt="Your photo" class="absolute inset-0 w-full h-full object-cover">
<div class="absolute inset-0 bg-gradient-to-t from-black/40 to-transparent pointer-events-none"></div>
<div class="absolute bottom-3 left-3 flex items-center gap-1 bg-surface/80 backdrop-blur-sm px-2 py-1 rounded-md">
<span class="material-symbols-outlined text-primary text-[14px]">auto_awesome</span>
<span class="font-label-sm text-label-sm text-primary">Your Photo</span>
</div>
</div>
</div>
</div>
</main>

<script>
(function () {
  'use strict';

  var errorInfo = null;
  var hasImage = false;

  var elements = {
    errorIconWrapper: document.getElementById('error-icon-wrapper'),
    errorIcon: document.getElementById('error-icon'),
    errorTitle: document.getElementById('error-title'),
    errorMessage: document.getElementById('error-message'),
    errorActions: document.getElementById('error-actions'),
    helpText: document.getElementById('help-text'),
    referenceSection: document.getElementById('reference-section'),
    referenceImg: document.getElementById('reference-img'),
    backBtn: document.getElementById('back-btn')
  };

  var ERROR_CONFIGS = {
    NO_FOOD_DETECTED: {
      icon: 'search_off',
      iconColor: 'bg-warning-container/30 text-warning',
      title: 'No Food Detected',
      message: 'We couldn\'t identify a food in this photo. Try a clearer shot or use another method.',
      primaryAction: { text: 'Retake Photo', action: 'retake', icon: 'camera_alt', primary: true },
      secondaryActions: [
        { text: 'Choose Another', action: 'gallery', icon: 'photo_library' },
        { text: 'Search Food', action: 'search', icon: 'search', primary: true }
      ],
      help: 'Make sure the food is well-lit, centered, and fills most of the frame.'
    },
    NETWORK_ERROR: {
      icon: 'wifi_off',
      iconColor: 'bg-warning-container/30 text-warning',
      title: 'Connection Error',
      message: 'We couldn\'t connect to our AI service. Please check your internet and try again.',
      primaryAction: { text: 'Try Again', action: 'retry', icon: 'refresh', primary: true },
      secondaryActions: [
        { text: 'Log Manually', action: 'manual', icon: 'edit' }
      ],
      help: 'Your photo is saved. You can retry when you\'re back online.'
    },
    TIMEOUT: {
      icon: 'hourglass_empty',
      iconColor: 'bg-warning-container/30 text-warning',
      title: 'Analysis Timed Out',
      message: 'The analysis took too long to complete. This can happen with slow connections.',
      primaryAction: { text: 'Try Again', action: 'retry', icon: 'refresh', primary: true },
      secondaryActions: [
        { text: 'Log Manually', action: 'manual', icon: 'edit' }
      ],
      help: 'Your photo is saved. You can retry the analysis.'
    },
    AI_ERROR: {
      icon: 'psychiatry',
      iconColor: 'bg-error-container/30 text-error',
      title: 'AI Analysis Failed',
      message: 'Our AI service encountered an error processing your image. Please try again.',
      primaryAction: { text: 'Try Again', action: 'retry', icon: 'refresh', primary: true },
      secondaryActions: [
        { text: 'Log Manually', action: 'manual', icon: 'edit' }
      ],
      help: 'This is usually temporary. Please try again in a moment.'
    },
    UNSUPPORTED_IMAGE: {
      icon: 'image_not_supported',
      iconColor: 'bg-error-container/30 text-error',
      title: 'Unsupported Image Format',
      message: 'This image format isn\'t supported. Please try a different photo.',
      primaryAction: { text: 'Choose Another Photo', action: 'gallery', icon: 'photo_library', primary: true },
      secondaryActions: [
        { text: 'Take New Photo', action: 'retake', icon: 'camera_alt' }
      ],
      help: 'Supported formats: JPEG, PNG, WebP. Max size: 10MB.'
    },
    PARTIAL_RECOGNITION: {
      icon: 'help_outline',
      iconColor: 'bg-tertiary-container/30 text-tertiary',
      title: 'Partial Recognition',
      message: 'AI recognized some items but needs help with others.',
      primaryAction: { text: 'Review Items', action: 'clarify', icon: 'visibility', primary: true },
      secondaryActions: [
        { text: 'Log Manually', action: 'manual', icon: 'edit' }
      ],
      help: 'You can review and correct the detected items.'
    },
    GENERIC: {
      icon: 'error',
      iconColor: 'bg-error-container/30 text-error',
      title: 'Analysis Failed',
      message: 'Something went wrong. Please try again.',
      primaryAction: { text: 'Try Again', action: 'retry', icon: 'refresh', primary: true },
      secondaryActions: [
        { text: 'Log Manually', action: 'manual', icon: 'edit' }
      ],
      help: ''
    }
  };

  function init() {
    var stored = null;
    try {
      stored = sessionStorage.getItem('vf.aiResult');
    } catch (e) {}

    var errorCode = 'GENERIC';
    var errorMessage = null;

    if (stored) {
      try {
        var parsed = JSON.parse(stored);
        if (parsed.error && parsed.code) {
          errorCode = parsed.code;
          errorMessage = parsed.message;
        }
      } catch (e) {}
    }

    var imageUrl = sessionStorage.getItem('vf.capturedPhoto');
    if (imageUrl) {
      hasImage = true;
      elements.referenceImg.src = imageUrl;
      elements.referenceSection.hidden = false;
    }

    var config = ERROR_CONFIGS[errorCode] || ERROR_CONFIGS.GENERIC;
    if (errorMessage) config.message = errorMessage;

    applyConfig(config);
    setupEventListeners(config);
    VF.ui.announce(config.title + '. ' + config.message);
    VF.ui.haptics.warn();
  }

  function applyConfig(config) {
    elements.errorIcon.textContent = config.icon;
    elements.errorIconWrapper.className = 'w-24 h-24 rounded-full flex items-center justify-center ' + config.iconColor;
    elements.errorTitle.textContent = config.title;
    elements.errorMessage.textContent = config.message;

    elements.errorActions.innerHTML = '';

    var allActions = [];
    if (config.primaryAction) allActions.push(config.primaryAction);
    if (config.secondaryActions) allActions.push(...config.secondaryActions);

    allActions.forEach(function (action) {
      var btn = document.createElement('button');
      var isPrimary = action.primary === true;
      btn.className = 'flex-1 ' + (isPrimary
        ? 'bg-primary text-on-primary shadow-lg shadow-primary/30 hover:bg-primary/90'
        : 'bg-surface-container-high/60 backdrop-blur-sm text-on-surface hover:bg-surface-variant/80 border border-outline-variant/30') +
        ' font-label-lg text-label-lg rounded-full py-3 px-6 flex items-center justify-center gap-2 transition-colors active:scale-[0.98]';
      btn.innerHTML = '<span class="material-symbols-outlined">' + action.icon + '</span>' + action.text;
      btn.dataset.action = action.action;
      elements.errorActions.appendChild(btn);
    });

    if (config.help) {
      elements.helpText.textContent = config.help;
      elements.helpText.hidden = false;
    }
  }

  function setupEventListeners(config) {
    elements.errorActions.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      var action = btn.dataset.action;
      handleAction(action, config);
    });

    elements.backBtn.addEventListener('click', goBack);
  }

  function handleAction(action, config) {
    VF.ui.haptics.select();

    switch (action) {
      case 'retry':
        retryAnalysis();
        break;
      case 'retake':
        VF.ui.go('camera.html');
        break;
      case 'gallery':
        VF.ui.go('photo_review.html');
        break;
      case 'search':
        VF.ui.go('nutrition_library.html');
        break;
      case 'manual':
        VF.ui.go('ai_chat.html');
        break;
      case 'clarify':
        VF.ui.go('food_clarify.html');
        break;
    }
  }

  function retryAnalysis() {
    if (hasImage) {
      sessionStorage.setItem('vf.retryAnalysis', 'true');
      VF.ui.go('ai_analyzing.html');
    } else {
      VF.ui.go('camera.html');
    }
  }

  function goBack() {
    VF.ui.haptics.select();
    if (hasImage) {
      VF.ui.go('photo_review.html');
    } else {
      VF.ui.goBack('food_error');
    }
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body></html>
