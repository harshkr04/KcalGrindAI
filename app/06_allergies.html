<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Allergies · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<!-- Screen 6 — Allergies. Multi-select chips with a "None" exclusive toggle.
     Uses chip-base/chip-selected/chip-unselected from vitality.css and icons
     from VF.nutrition.ALLERGENS. Skip button enabled. -->
<body class="bg-surface min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-stack-md mb-stack-sm tracking-tight">
    Any food allergies?
  </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">We'll flag meals that contain your allergens. Select all that apply, or tap "None" if you don't have any.</p>

<!-- None toggle -->
<button class="chip-base chip-unselected rounded-full border-[1.5px] px-5 py-3 font-label-lg text-label-lg flex items-center gap-2 mb-stack-md" id="none-chip" role="checkbox" aria-checked="false" type="button">
<span class="material-symbols-outlined text-[18px] hidden" data-check style="font-variation-settings:'FILL' 1;">check</span>
<span>None</span>
</button>

<div aria-label="Allergens" class="flex flex-wrap gap-3 w-full" id="allergens" role="group"></div>
</main>
<div class="vf-footer">
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
<div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe">
<button class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20" disabled id="continue">
      Continue
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-3" id="hint">Select your allergens, tap "None", or skip.</p>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('allergies', {
      title: 'Any food allergies?',
      skip: true,
      onSkip: function () {
        VF.store.patch({ allergiesSkipped: true });
        VF.ui.haptics.select();
        VF.ui.advance('allergies');
      }
    });
    if (!state) return;

    var container = document.getElementById('allergens');
    var noneChip = document.getElementById('none-chip');
    var cta = document.getElementById('continue');
    var hint = document.getElementById('hint');
    var selected = (state.allergies && state.allergies.length) ? state.allergies.slice() : [];
    var noneSelected = !!state.allergiesNone;

    VF.nutrition.ALLERGENS.forEach(function (a) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip-base chip-unselected rounded-full border-[1.5px] px-5 py-3 font-label-lg text-label-lg flex items-center gap-2';
      chip.dataset.allergen = a.id;
      chip.setAttribute('role', 'checkbox');
      chip.setAttribute('aria-checked', 'false');
      chip.innerHTML =
        '<span class="material-symbols-outlined text-[18px]" style="font-variation-settings:\'FILL\' 1;">' + a.icon + '</span>' +
        '<span>' + a.label + '</span>';
      chip.addEventListener('click', function () { toggleAllergen(a.id); });
      container.appendChild(chip);
    });

    noneChip.addEventListener('click', function () {
      VF.ui.haptics.select();
      noneSelected = !noneSelected;
      if (noneSelected) selected = [];
      syncUI();
      VF.store.patch({ allergies: selected, allergiesNone: noneSelected, allergiesSkipped: false });
    });

    function toggleAllergen(id) {
      VF.ui.haptics.select();
      noneSelected = false;
      var idx = selected.indexOf(id);
      if (idx > -1) selected.splice(idx, 1);
      else selected.push(id);
      syncUI();
      VF.store.patch({ allergies: selected, allergiesNone: false, allergiesSkipped: false });
    }

    function syncUI() {
      // None chip
      noneChip.className = 'chip-base rounded-full border-[1.5px] px-5 py-3 font-label-lg text-label-lg flex items-center gap-2 mb-stack-md ' +
        (noneSelected ? 'chip-selected' : 'chip-unselected');
      noneChip.setAttribute('aria-checked', String(noneSelected));
      noneChip.querySelector('[data-check]').classList.toggle('hidden', !noneSelected);

      // Allergen chips
      Array.prototype.forEach.call(container.children, function (chip) {
        var on = selected.indexOf(chip.dataset.allergen) > -1;
        chip.className = 'chip-base rounded-full border-[1.5px] px-5 py-3 font-label-lg text-label-lg flex items-center gap-2 ' +
          (on ? 'chip-selected' : 'chip-unselected');
        chip.setAttribute('aria-checked', String(on));
      });

      var ok = noneSelected || selected.length > 0;
      VF.ui.gate(cta, ok);
      hint.textContent = noneSelected
        ? 'No allergens — great! Tap Continue.'
        : (selected.length > 0 ? selected.length + ' allergen' + (selected.length > 1 ? 's' : '') + ' flagged.' : 'Select your allergens, tap "None", or skip.');
    }

    syncUI();

    cta.addEventListener('click', function () {
      if (!noneSelected && !selected.length) return;
      VF.ui.haptics.confirm();
      VF.ui.advance('allergies');
    });
  });
</script>
</body></html>
