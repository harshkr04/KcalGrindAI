<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#0F5238" name="theme-color">
<title>Lumina Vitality Flow — Intelligent Calorie &amp; Macro Nutrition Tracker</title>
<meta name="description" content="Track your daily calories, macros, and hydration with multimodal AI meal recognition and personalized nutrition plans.">
<link rel="canonical" href="/index.html">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "Lumina Vitality Flow",
  "applicationCategory": "HealthApplication",
  "operatingSystem": "All",
  "description": "Intelligent calorie and macronutrient tracking application with AI meal detection.",
  "offers": {
    "@type": "Offer",
    "price": "0",
    "priceCurrency": "USD"
  }
}
</script>
</head>
<!-- Splash — reuses splash_screen_refinement_mint_glow verbatim and adds the
     first-launch / returning-user / resume routing decision. -->
<body class="m-0 p-0 h-screen w-screen overflow-hidden relative bg-gradient-to-br from-mint-light to-mint-sage">
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute inset-x-0 bottom-0 h-1/2 bg-gradient-to-t from-white/30 to-transparent opacity-80 mix-blend-overlay"></div>
<div class="absolute top-1/2 left-1/2 w-[80vw] h-[80vw] max-w-[500px] max-h-[500px] rounded-[40%_60%_70%_30%/40%_50%_60%_50%] bg-white/20 animate-blob-center backdrop-blur-[40px] shadow-[inset_0_0_50px_rgba(255,255,255,0.5)] border border-white/30 mix-blend-screen"></div>
</div>
<main class="relative z-10 w-full h-full flex flex-col items-center justify-center px-container-padding">
<div class="animate-entrance flex flex-col items-center text-center">
<div class="mb-stack-lg relative flex items-center justify-center w-24 h-24 rounded-full bg-white/30 backdrop-blur-md border border-white/40 shadow-[0_8px_32px_rgba(0,0,0,0.05)]">
<span class="material-symbols-outlined text-primary text-5xl" style="font-variation-settings: 'FILL' 1;">eco</span>
</div>
<h1 class="font-display-lg text-[48px] leading-[56px] text-primary tracking-tight drop-shadow-sm" style="font-variation-settings: 'wdth' 85, 'wght' 500;">
        Nutritional Vitality
      </h1>
<p class="font-title-lg text-title-lg text-secondary mt-stack-sm opacity-80 font-medium tracking-[0.2em] uppercase">
        Vitality Flow
      </p>
</div>
<!-- Fallback affordance: if routing is blocked (no storage, reduced motion,
     script timing) the user is never stranded on the splash. -->
<button class="mt-stack-lg opacity-0 transition-opacity duration-500 border-[1.5px] border-primary text-primary font-label-lg text-label-lg px-8 py-4 rounded-full active:scale-95" id="manual">
    Continue
  </button>
</main>
<script>
  (function () {
    var target = null;
    try {
      var s = VF.store.get();
      target = s.completed ? VF.store.HOME
             : (VF.store.hasProgress() ? VF.store.resumeTarget() + '?resumed=1' : '01_welcome.html');
    } catch (e) {
      target = '01_welcome.html';
    }
    var manual = document.getElementById('manual');
    manual.addEventListener('click', function () { location.replace(target); });
    var reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    setTimeout(function () { location.replace(target); }, reduce ? 250 : 1400);
    setTimeout(function () { manual.classList.remove('opacity-0'); }, 2600);
  })();
</script>
</body></html>
