<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Log Weight · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/diary.js"></script>
</head>
<!-- Weight Log — Lightweight weight entry. -->
<body class="bg-surface min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">
  <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-stack-md mb-stack-sm tracking-tight">Log Weight</h1>
  <p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Track your progress over time.</p>

  <div class="flex flex-col gap-stack-lg">
    <div class="m3-field">
      <div class="m3-input-container">
        <input class="m3-input" id="weight-value" inputmode="decimal" placeholder=" " autocomplete="off" aria-required="true">
        <label class="m3-label" for="weight-value">Weight (kg)</label>
      </div>
    </div>
    <div class="m3-field">
      <div class="m3-input-container">
        <input class="m3-input" id="weight-date" type="date" placeholder=" " autocomplete="off">
        <label class="m3-label" for="weight-date">Date</label>
      </div>
    </div>
    <div class="m3-field">
      <div class="m3-input-container">
        <input class="m3-input" id="weight-note" placeholder=" " autocomplete="off">
        <label class="m3-label" for="weight-note">Note (optional)</label>
      </div>
    </div>
  </div>
</main>

<div class="vf-footer">
  <div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
  <div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe flex flex-col gap-3">
    <button id="save-weight" class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20">
      <span class="material-symbols-outlined text-[20px]">save</span> Save
    </button>
    <button id="back-btn" class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      Cancel
    </button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('weight_log', { title: 'Log Weight', allowCompleted: true });
    if (!state) return;

    var weightInput = document.getElementById('weight-value');
    var dateInput = document.getElementById('weight-date');
    var noteInput = document.getElementById('weight-note');
    var saveBtn = document.getElementById('save-weight');
    var backBtn = document.getElementById('back-btn');

    dateInput.value = today();
    var latest = VF.diary.getLatestWeight();
    if (latest) weightInput.value = latest.weightKg;

    saveBtn.addEventListener('click', function () {
      var w = parseFloat(weightInput.value);
      if (!w || w <= 0) { VF.ui.haptics.warn(); VF.ui.snackbar('Enter a valid weight', 'error'); return; }
      VF.diary.logWeight(w, dateInput.value, noteInput.value.trim());
      VF.ui.haptics.success();
      VF.ui.snackbar('Weight logged', 'check_circle');
      VF.ui.go('insights.html');
    });

    backBtn.addEventListener('click', function () { VF.ui.haptics.select(); VF.ui.goBack('weight_log'); });
  });
</script>
</body></html>
