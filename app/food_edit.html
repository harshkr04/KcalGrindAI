<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Edit Food · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/diary.js"></script>
</head>
<!-- Food Edit — Edit a food entry within a meal. Quantity, unit, nutrition. -->
<body class="bg-surface min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">
  <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-stack-md mb-stack-sm tracking-tight">Edit Food</h1>
  <p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Update quantity or nutrition values.</p>

  <div id="edit-form" class="flex flex-col gap-stack-lg"></div>
</main>

<div class="vf-footer">
  <div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
  <div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe flex flex-col gap-3">
    <button id="save-edit" class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20">
      <span class="material-symbols-outlined text-[20px]">save</span> Save
    </button>
    <button id="back-btn" class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      Cancel
    </button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('food_edit', { title: 'Edit Food', allowCompleted: true });
    if (!state) return;

    var mealId = VF.ui.qp('id');
    var idx = parseInt(VF.ui.qp('idx'), 10);
    var meal = VF.diary.getMealById(mealId);
    if (!meal || !meal.items[idx]) { VF.ui.go('diary.html'); return; }

    var item = meal.items[idx];
    var formEl = document.getElementById('edit-form');
    var saveBtn = document.getElementById('save-edit');
    var backBtn = document.getElementById('back-btn');

    function render() {
      formEl.innerHTML =
        '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-name" value="' + (item.name || '') + '"><label class="m3-label" for="edit-name">Food name</label></div></div>' +
        '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-serving" value="' + (item.serving || '') + '"><label class="m3-label" for="edit-serving">Serving</label></div></div>' +
        '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-grams" inputmode="numeric" type="number" value="' + (item.servingGrams || 0) + '"><label class="m3-label" for="edit-grams">Grams</label></div></div>' +
        '<div class="grid grid-cols-2 gap-stack-md">' +
          '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-cal" inputmode="numeric" type="number" value="' + (item.calories || 0) + '"><label class="m3-label" for="edit-cal">Calories</label></div></div>' +
          '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-prot" inputmode="decimal" type="number" value="' + (item.protein || 0) + '"><label class="m3-label" for="edit-prot">Protein (g)</label></div></div>' +
          '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-carbs" inputmode="decimal" type="number" value="' + (item.carbs || 0) + '"><label class="m3-label" for="edit-carbs">Carbs (g)</label></div></div>' +
          '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-fat" inputmode="decimal" type="number" value="' + (item.fat || 0) + '"><label class="m3-label" for="edit-fat">Fat (g)</label></div></div>' +
          '<div class="m3-field"><div class="m3-input-container"><input class="m3-input" id="edit-fiber" inputmode="decimal" type="number" value="' + (item.fiber || 0) + '"><label class="m3-label" for="edit-fiber">Fiber (g)</label></div></div>' +
        '</div>';
    }

    render();

    saveBtn.addEventListener('click', function () {
      meal.items[idx] = {
        id: item.id,
        name: document.getElementById('edit-name').value,
        serving: document.getElementById('edit-serving').value,
        servingGrams: parseFloat(document.getElementById('edit-grams').value) || 0,
        calories: parseFloat(document.getElementById('edit-cal').value) || 0,
        protein: parseFloat(document.getElementById('edit-prot').value) || 0,
        carbs: parseFloat(document.getElementById('edit-carbs').value) || 0,
        fat: parseFloat(document.getElementById('edit-fat').value) || 0,
        fiber: parseFloat(document.getElementById('edit-fiber').value) || 0
      };
      VF.diary.updateMeal(meal.id, { items: meal.items });
      VF.ui.haptics.success();
      VF.ui.snackbar('Food updated', 'check_circle');
      VF.ui.go('meal_detail.html?id=' + meal.id);
    });

    backBtn.addEventListener('click', function () { VF.ui.haptics.select(); VF.ui.goBack('food_edit'); });
  });
</script>
</body></html>
