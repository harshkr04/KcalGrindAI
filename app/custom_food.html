<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Create Custom Food · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/diary.js"></script>
</head>
<!-- Custom Food Creation — Name, brand, serving, nutrition, validation. -->
<body class="bg-surface min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">
  <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-stack-md mb-stack-sm tracking-tight">Create Custom Food</h1>
  <p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Add a food that isn't in our database.</p>

  <div class="flex flex-col gap-stack-lg">
    <div class="m3-field" id="f-name">
      <div class="m3-input-container">
        <input class="m3-input" id="cf-name" placeholder=" " autocomplete="off" aria-required="true">
        <label class="m3-label" for="cf-name">Food name</label>
        <span class="m3-trail" id="cf-name-icon" aria-hidden="true"></span>
      </div>
    </div>
    <div class="m3-field" id="f-brand">
      <div class="m3-input-container">
        <input class="m3-input" id="cf-brand" placeholder=" " autocomplete="off">
        <label class="m3-label" for="cf-brand">Brand (optional)</label>
      </div>
    </div>
    <div class="m3-field" id="f-serving">
      <div class="m3-input-container">
        <input class="m3-input" id="cf-serving" placeholder=" " autocomplete="off" aria-required="true">
        <label class="m3-label" for="cf-serving">Serving size</label>
        <span class="m3-trail" id="cf-serving-icon" aria-hidden="true"></span>
      </div>
    </div>
    <div class="m3-field" id="f-serving-grams">
      <div class="m3-input-container">
        <input class="m3-input" id="cf-serving-grams" inputmode="decimal" placeholder=" " autocomplete="off" aria-required="true">
        <label class="m3-label" for="cf-serving-grams">Serving grams</label>
        <span class="m3-trail" id="cf-grams-icon" aria-hidden="true"></span>
      </div>
    </div>

    <div class="grid grid-cols-2 gap-stack-md">
      <div class="m3-field" id="f-cal">
        <div class="m3-input-container">
          <input class="m3-input" id="cf-cal" inputmode="numeric" placeholder=" " autocomplete="off" aria-required="true">
          <label class="m3-label" for="cf-cal">Calories</label>
          <span class="m3-trail" id="cf-cal-icon" aria-hidden="true"></span>
        </div>
      </div>
      <div class="m3-field" id="f-prot">
        <div class="m3-input-container">
          <input class="m3-input" id="cf-prot" inputmode="decimal" placeholder=" " autocomplete="off">
          <label class="m3-label" for="cf-prot">Protein (g)</label>
        </div>
      </div>
      <div class="m3-field" id="f-carbs">
        <div class="m3-input-container">
          <input class="m3-input" id="cf-carbs" inputmode="decimal" placeholder=" " autocomplete="off">
          <label class="m3-label" for="cf-carbs">Carbs (g)</label>
        </div>
      </div>
      <div class="m3-field" id="f-fat">
        <div class="m3-input-container">
          <input class="m3-input" id="cf-fat" inputmode="decimal" placeholder=" " autocomplete="off">
          <label class="m3-label" for="cf-fat">Fat (g)</label>
        </div>
      </div>
      <div class="m3-field" id="f-fiber">
        <div class="m3-input-container">
          <input class="m3-input" id="cf-fiber" inputmode="decimal" placeholder=" " autocomplete="off">
          <label class="m3-label" for="cf-fiber">Fiber (g)</label>
        </div>
      </div>
    </div>

    <div id="cf-error" class="vf-error hidden"></div>
  </div>
</main>

<div class="vf-footer">
  <div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
  <div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe flex flex-col gap-3">
    <button id="save-custom" class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20" disabled>
      <span class="material-symbols-outlined text-[20px]">save</span> Save Food
    </button>
    <button id="back-btn" class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      Cancel
    </button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('custom_food', { title: 'Create Custom Food', allowCompleted: true });
    if (!state) return;

    var returnTo = VF.ui.qp('returnTo') || 'food_search.html';
    var nameEl = document.getElementById('cf-name');
    var brandEl = document.getElementById('cf-brand');
    var servingEl = document.getElementById('cf-serving');
    var servingGramsEl = document.getElementById('cf-serving-grams');
    var calEl = document.getElementById('cf-cal');
    var protEl = document.getElementById('cf-prot');
    var carbsEl = document.getElementById('cf-carbs');
    var fatEl = document.getElementById('cf-fat');
    var fiberEl = document.getElementById('cf-fiber');
    var saveBtn = document.getElementById('save-custom');
    var backBtn = document.getElementById('back-btn');
    var errorEl = document.getElementById('cf-error');

    function trailIcon(el, valid) {
      if (!el) return;
      el.innerHTML = valid ? '<span class="material-symbols-outlined text-secondary text-[20px]" style="font-variation-settings:\'FILL\' 1;">check_circle</span>' : '<span class="material-symbols-outlined text-error text-[20px]" style="font-variation-settings:\'FILL\' 1;">error</span>';
    }

    function validate() {
      var ok = true;
      var name = nameEl.value.trim();
      var serving = servingEl.value.trim();
      var grams = parseFloat(servingGramsEl.value);
      var cal = parseFloat(calEl.value);

      if (!name) { errorEl.textContent = 'Food name is required.'; errorEl.classList.remove('hidden'); saveBtn.disabled = true; return false; }
      if (!serving) { errorEl.textContent = 'Serving size is required.'; errorEl.classList.remove('hidden'); saveBtn.disabled = true; return false; }
      if (isNaN(grams) || grams <= 0) { errorEl.textContent = 'Enter a valid serving weight in grams.'; errorEl.classList.remove('hidden'); saveBtn.disabled = true; return false; }
      if (isNaN(cal) || cal < 0) { errorEl.textContent = 'Enter a valid calorie value.'; errorEl.classList.remove('hidden'); saveBtn.disabled = true; return false; }

      errorEl.classList.add('hidden');
      saveBtn.disabled = false;
      return true;
    }

    [nameEl, servingEl, servingGramsEl, calEl, protEl, carbsEl, fatEl, fiberEl].forEach(function (el) {
      if (!el) return;
      el.addEventListener('input', validate);
    });

    saveBtn.addEventListener('click', function () {
      if (!validate()) return;
      var food = {
        id: 'custom_' + Date.now(),
        name: nameEl.value.trim(),
        brand: brandEl.value.trim(),
        serving: servingEl.value.trim(),
        servingGrams: Math.round(parseFloat(servingGramsEl.value) || 100),
        calories: Math.round(parseFloat(calEl.value) || 0),
        protein: parseFloat(protEl.value) || 0,
        carbs: parseFloat(carbsEl.value) || 0,
        fat: parseFloat(fatEl.value) || 0,
        fiber: parseFloat(fiberEl.value) || 0
      };
      VF.diary.saveCustomFood(food);
      VF.ui.haptics.success();
      VF.ui.snackbar('Custom food saved', 'check_circle');
      VF.ui.go(returnTo);
    });

    backBtn.addEventListener('click', function () { VF.ui.haptics.select(); VF.ui.goBack('custom_food'); });
  });
</script>
</body></html>
