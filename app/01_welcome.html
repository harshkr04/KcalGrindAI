<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Welcome · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<!-- Screen 1 — Welcome. Phase 1 `welcome` layout, ambient blobs, floating AI
     badges and hero asset kept as-is; only the messaging and the routing are
     Phase 2. Scrolls instead of clipping on short devices. -->
<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center relative selection:bg-primary/20 py-stack-lg">
<div class="absolute inset-0 overflow-hidden pointer-events-none z-0">
<div class="absolute -top-[20%] -left-[10%] w-[70vw] h-[70vw] rounded-full bg-primary-fixed/20 blur-[100px]"></div>
<div class="absolute bottom-[10%] -right-[10%] w-[50vw] h-[50vw] rounded-full bg-secondary-fixed/20 blur-[80px]"></div>
</div>
<main class="w-full max-w-[840px] px-margin-mobile md:px-margin-tablet z-10 flex flex-col items-center justify-center vf-screen">
<!-- Hero: subtle AI + food visual, existing asset and badge components -->
<div class="relative w-full max-w-[260px] md:max-w-[360px] aspect-square mb-stack-lg animate-float flex items-center justify-center">
<div class="absolute inset-0 bg-surface-container/50 rounded-full blur-2xl transform scale-90"></div>
<img alt="A glass bowl of fresh, colourful whole foods" class="relative z-10 w-full h-full object-cover rounded-full shadow-2xl shadow-primary/10 border-[4px] border-surface/50" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyVbOh3Kh4OsYo_S4525vSigz_CsbELeRAmJTysBi-q_FopVkw97qGr6-fN-J0P03kNuw2hRld2uX653rvObyUhOupluZ2mjGDEwJcrmUjbKwjGFjNCXz1I-09vkJvZtZKDF9Xqp_YyHKkgy1cpJXRh9VblwpcJZ2XealtVKtwNy1MvokVU6L_6SIjPvUEFnm41f93mmvjyqTwXCl4kF-xQ3g2h6pajGuSLaQkm1YHTiuUdBAy-nym">
<div class="absolute -right-3 top-1/4 bg-surface/80 backdrop-blur-md border border-outline-variant/30 rounded-xl px-4 py-2 shadow-lg flex items-center gap-2 z-20">
<span class="material-symbols-outlined text-tertiary" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm text-on-surface">Snap a photo</span>
</div>
<div class="absolute -left-2 bottom-1/4 bg-surface/80 backdrop-blur-md border border-outline-variant/30 rounded-xl px-4 py-2 shadow-lg flex items-center gap-2 z-20">
<span class="material-symbols-outlined text-secondary" style="font-variation-settings: 'FILL' 1;">energy_savings_leaf</span>
<span class="font-label-sm text-label-sm text-on-surface">Macros handled</span>
</div>
</div>
<div class="text-center space-y-stack-sm mb-stack-lg">
<h1 class="font-display-lg text-[44px] leading-[52px] md:text-display-lg text-on-surface tracking-tight md:max-w-[600px]">
      Eat better. Track less.
    </h1>
<p class="font-body-lg text-body-lg text-on-surface-variant max-w-[480px] mx-auto pt-2">
      Your AI nutrition companion makes tracking meals, calories, and nutrition simple.
    </p>
</div>
<div class="flex flex-col items-center justify-center gap-stack-md w-full max-w-[420px]">
<button class="w-full bg-tertiary hover:bg-tertiary-container hover:text-on-tertiary-container active:scale-95 transition-all text-on-tertiary font-label-lg text-label-lg px-8 py-4 rounded-full shadow-lg shadow-tertiary/20 flex items-center justify-center gap-2" id="start">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">bolt</span>
      Get Started
    </button>
<button class="w-full border-[1.5px] border-primary text-primary hover:bg-primary/5 active:scale-95 transition-all font-label-lg text-label-lg px-8 py-4 rounded-full flex items-center justify-center" id="signin">
      Already have an account? Sign In
    </button>
<p class="font-body-md text-body-md text-on-surface-variant/80 text-center max-w-[380px]">
      Setup takes about a minute. Nothing is shared, and you can change every answer later.
    </p>
</div>
</main>
<!-- Navigation shells intentionally suppressed on the onboarding flow, per Phase 1. -->
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var s = VF.ui.initScreen('welcome', { title: 'Welcome to Vitality' });
    if (!s) return; // already onboarded — initScreen routed to Home
    if (VF.ui.qp('resumed') === '1') VF.ui.snackbar('Picked up where you left off.', 'restore');

    document.getElementById('start').addEventListener('click', function () {
      VF.ui.haptics.confirm();
      VF.ui.go(VF.store.hasProgress() ? VF.store.resumeTarget() : '02_goal.html');
    });
    document.getElementById('signin').addEventListener('click', function () {
      VF.ui.haptics.select();
      VF.ui.snackbar('Accounts arrive with sync — for now, setup runs on this device.', 'account_circle');
    });
  });
</script>
</body></html>
