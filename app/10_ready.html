<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Ready · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<!-- Screen 10 — Ready / Summary. Shows a personalized summary of the user's
     onboarding choices. The CTA sets completed: true and navigates to Home. -->
<body class="bg-mesh min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-40">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col items-center px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">

<!-- Celebration header -->
<div class="relative w-20 h-20 rounded-full bg-primary-container/30 flex items-center justify-center mt-stack-md mb-stack-md animate-float">
<span class="material-symbols-outlined text-primary text-[44px]" style="font-variation-settings:'FILL' 1;">rocket_launch</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mb-stack-sm tracking-tight text-center">
    You're ready to start
  </h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-stack-lg max-w-[380px]">Your AI nutrition assistant is ready to help.</p>

<!-- Personalized summary cards -->
<div class="w-full flex flex-col gap-stack-md" id="summary"></div>
</main>
<div class="vf-footer">
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
<div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe">
<button class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20" id="finish">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings:'FILL' 1;">bolt</span>
      Start Tracking
    </button>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('ready', { title: "You're ready to start" });
    if (!state) return;

    var container = document.getElementById('summary');
    var N = VF.nutrition;
    var targets = VF.store.targets();

    function addCard(icon, label, value, accentColor) {
      var card = document.createElement('div');
      card.className = 'glass-card rounded-xl p-4 flex items-center gap-stack-md text-left w-full';
      card.innerHTML =
        '<div class="w-12 h-12 rounded-full bg-' + accentColor + '-container/20 text-' + accentColor + ' flex items-center justify-center flex-shrink-0">' +
          '<span class="material-symbols-outlined text-[28px]" style="font-variation-settings:\'FILL\' 1;">' + icon + '</span>' +
        '</div>' +
        '<div class="flex-1 min-w-0">' +
          '<p class="font-label-lg text-label-lg text-on-surface-variant">' + label + '</p>' +
          '<p class="font-body-lg text-body-lg text-on-surface truncate">' + value + '</p>' +
        '</div>';
      container.appendChild(card);
    }

    // Daily calories
    if (targets) {
      addCard('local_fire_department', 'Daily calories', VF.ui.fmt(targets.calories) + ' kcal', 'primary');
    }

    // Protein
    if (targets) {
      addCard('fitness_center', 'Protein', targets.protein + ' g', 'macro-protein');
    }

    // Goal
    var goalData = N.GOALS[state.goal];
    addCard(goalData ? goalData.icon : 'flag', 'Goal', goalData ? goalData.label : 'Not set', 'secondary');

    // Finish
    var cta = document.getElementById('finish');
    VF.ui.gate(cta, true);

    cta.addEventListener('click', function () {
      VF.store.patch({ completed: true });
      VF.ui.haptics.success();
      VF.ui.go(VF.store.HOME);
    });
  });
</script>
</body></html>
