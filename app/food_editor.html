<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Edit Food · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col overflow-hidden relative">
<!-- Scrim/Overlay -->
<div id="editor-scrim" class="fixed inset-0 bg-inverse-surface/60 z-40 opacity-0 pointer-events-none transition-opacity duration-300" hidden></div>

<!-- Food Editor Bottom Sheet -->
<div id="food-editor-sheet" class="bottom-sheet fixed bottom-0 left-0 right-0 z-50 glass-overlay rounded-t-[32px] border-t border-outline-variant/30 shadow-[0_-8px_40px_rgba(15,82,56,0.15)] px-container-padding pb-safe pt-4 flex flex-col md:max-w-2xl md:mx-auto" hidden>
<!-- Drag Handle -->
<div class="w-12 h-1.5 bg-outline-variant/60 rounded-full mx-auto mb-stack-md"></div>

<!-- Header -->
<div class="flex justify-between items-center mb-stack-lg">
<h2 class="font-title-lg text-title-lg text-on-surface font-[Roboto_Flex]">Edit Food</h2>
<button class="p-2 rounded-full hover:bg-surface-variant/80 transition-colors text-on-surface-variant bg-surface-variant/40" id="close-editor-btn" aria-label="Close">
<span class="material-symbols-outlined">close</span>
</button>
</div>

<!-- Food Name -->
<div class="mb-stack-md">
<label class="block mb-2 font-label-lg text-label-lg text-on-surface-variant">Food Name</label>
<input type="text" id="food-name-input" class="w-full h-14 px-4 bg-surface-container-low border border-outline-variant/30 rounded-xl font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary focus:border-transparent transition-colors" placeholder="e.g., Grilled Chicken Breast">
</div>

<!-- Portion Editor -->
<div class="mb-stack-md">
<label class="block mb-2 font-label-lg text-label-lg text-on-surface-variant">Portion Size</label>
<div class="flex items-center gap-3">
<!-- Unit Selector -->
<div class="flex-1 relative">
<label class="absolute top-2 left-3 font-label-sm text-label-sm text-on-surface-variant">Unit</label>
<select id="unit-select" class="w-full h-14 pt-6 px-3 pb-0 bg-surface-container-low border border-outline-variant/30 rounded-xl font-body-lg text-body-lg text-on-surface focus:ring-2 focus:ring-primary focus:border-transparent transition-colors appearance-none">
</select>
<span class="material-symbols-outlined absolute right-3 top-6 text-on-surface-variant pointer-events-none">arrow_drop_down</span>
</div>

<!-- Quantity Controls -->
<div class="flex items-center gap-2 bg-surface-container-low rounded-xl px-4 py-2 border border-outline-variant/30">
<button id="qty-decrease" class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors active:scale-95" aria-label="Decrease quantity">
<span class="material-symbols-outlined text-2xl">remove</span>
</button>
<input type="number" id="quantity-input" class="flex-1 h-12 text-center bg-transparent border-none focus:ring-0 font-body-lg text-body-lg text-on-surface" step="0.5" min="0.1" max="5000" inputmode="decimal">
<button id="qty-increase" class="w-12 h-12 rounded-full bg-surface-container flex items-center justify-center text-primary hover:bg-surface-container-high transition-colors active:scale-95" aria-label="Increase quantity">
<span class="material-symbols-outlined text-2xl">add</span>
</button>
</div>
</div>

<!-- Portion Display (readable format) -->
<div id="portion-display" class="mb-stack-md p-3 bg-primary/5 rounded-xl border border-primary/20 hidden">
<div class="flex items-center gap-2 text-primary">
<span class="material-symbols-outlined">straighten</span>
<span class="font-label-lg text-label-lg">Portion: <span id="portion-text">180 g</span></span>
</div>
</div>

<!-- Nutrition Preview -->
<div class="mb-stack-lg p-4 bg-surface-container-low/60 backdrop-blur-sm rounded-xl border border-outline-variant/30">
<h3 class="font-label-lg text-label-lg text-on-surface mb-3 flex items-center gap-2">
<span class="material-symbols-outlined text-secondary text-sm">local_fire_department</span>
Nutrition Preview
</h3>
<div class="grid grid-cols-4 gap-3" id="nutrition-preview">
<!-- Calories -->
<div class="glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
<div class="w-10 h-10 rounded-full bg-primary-container/20 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-primary text-[20px]">local_fire_department</span>
</div>
<span id="preview-calories" class="font-title-lg text-title-lg text-on-surface font-semibold">298</span>
<span class="font-label-sm text-label-sm text-outline">kcal</span>
</div>
<!-- Protein -->
<div class="glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
<div class="w-10 h-10 rounded-full bg-secondary-container/30 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-secondary text-[20px]">fitness_center</span>
</div>
<span id="preview-protein" class="font-title-lg text-title-lg text-on-surface font-semibold">55g</span>
<span class="font-label-sm text-label-sm text-outline">Protein</span>
</div>
<!-- Carbs -->
<div class="glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
<div class="w-10 h-10 rounded-full bg-surface-variant flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-on-surface-variant text-[20px]">grain</span>
</div>
<span id="preview-carbs" class="font-title-lg text-title-lg text-on-surface font-semibold">0g</span>
<span class="font-label-sm text-label-sm text-outline">Carbs</span>
</div>
<!-- Fats -->
<div class="glass-panel rounded-xl p-3 flex flex-col items-center justify-center text-center">
<div class="w-10 h-10 rounded-full bg-tertiary-container/20 flex items-center justify-center mb-1">
<span class="material-symbols-outlined text-tertiary text-[20px]">water_drop</span>
</div>
<span id="preview-fat" class="font-title-lg text-title-lg text-on-surface font-semibold">7g</span>
<span class="font-label-sm text-label-sm text-outline">Fats</span>
</div>
</div>
</div>

<!-- Confidence Indicator -->
<div id="confidence-section" class="mb-stack-lg p-3 rounded-xl hidden">
<div class="flex items-center gap-2">
<span id="confidence-icon" class="material-symbols-outlined text-[20px]">help_outline</span>
<span id="confidence-text" class="font-label-lg text-label-lg">Medium confidence</span>
</div>
</div>

<!-- Source Indicator -->
<div id="source-indicator" class="mb-stack-lg p-3 bg-tertiary-container/20 border border-tertiary/30 rounded-xl hidden">
<div class="flex items-center gap-2 text-tertiary">
<span class="material-symbols-outlined text-[20px]">auto_awesome</span>
<span class="font-label-lg text-label-lg">AI detected — edits preserved</span>
</div>
</div>

<!-- Action Buttons -->
<div class="flex flex-col sm:flex-row gap-3 w-full">
<button id="cancel-btn" class="flex-1 bg-surface-container-high/60 backdrop-blur-sm text-on-surface font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 border border-outline-variant/30 hover:bg-surface-variant/80 transition-colors active:scale-[0.98]">
Cancel
</button>
<button id="save-btn" class="flex-1 bg-primary text-on-primary font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined">save</span>
Save Changes
</button>
</div>
</div>

<script>
(function () {
  'use strict';

  var currentFood = null;
  var originalFood = null;
  var isReplacement = false;

  var elements = {
    scrim: document.getElementById('editor-scrim'),
    sheet: document.getElementById('food-editor-sheet'),
    closeBtn: document.getElementById('close-editor-btn'),
    foodNameInput: document.getElementById('food-name-input'),
    unitSelect: document.getElementById('unit-select'),
    quantityInput: document.getElementById('quantity-input'),
    qtyDecrease: document.getElementById('qty-decrease'),
    qtyIncrease: document.getElementById('qty-increase'),
    portionDisplay: document.getElementById('portion-display'),
    portionText: document.getElementById('portion-text'),
    previewCalories: document.getElementById('preview-calories'),
    previewProtein: document.getElementById('preview-protein'),
    previewCarbs: document.getElementById('preview-carbs'),
    previewFat: document.getElementById('preview-fat'),
    confidenceSection: document.getElementById('confidence-section'),
    confidenceIcon: document.getElementById('confidence-icon'),
    confidenceText: document.getElementById('confidence-text'),
    sourceIndicator: document.getElementById('source-indicator'),
    cancelBtn: document.getElementById('cancel-btn'),
    saveBtn: document.getElementById('save-btn')
  };

  function init() {
    var stored = null;
    try {
      stored = sessionStorage.getItem('vf.editingFood');
    } catch (e) {}

    if (!stored) {
      VF.ui.snackbar('No food to edit.');
      closeEditor();
      return;
    }

    try {
      var data = JSON.parse(stored);
      currentFood = data.food;
      originalFood = JSON.parse(JSON.stringify(data.food));
      isReplacement = data.isReplacement || false;
    } catch (e) {
      VF.ui.snackbar('Invalid food data.');
      closeEditor();
      return;
    }

    populateUnits();
    populateUI();
    setupEventListeners();
    openEditor();
    VF.ui.announce('Editing ' + currentFood.name);
  }

  function populateUnits() {
    var units = VF.nutrition.getCommonUnits(currentFood.name);
    var parsed = VF.nutrition.parsePortion(currentFood.portion);
    elements.unitSelect.innerHTML = '';
    units.forEach(function (unit) {
      var option = document.createElement('option');
      option.value = unit;
      option.textContent = VF.nutrition.UNIT_CONVERSIONS[unit] ? VF.nutrition.UNIT_CONVERSIONS[unit].label : unit;
      if (unit === parsed.unit) option.selected = true;
      elements.unitSelect.appendChild(option);
    });
  }

  function populateUI() {
    elements.foodNameInput.value = currentFood.name;
    var parsed = VF.nutrition.parsePortion(currentFood.portion);
    elements.quantityInput.value = parsed.quantity;
    elements.quantityInput.dataset.unit = parsed.unit;
    elements.quantityInput.dataset.grams = parsed.grams;
    updatePortionDisplay();
    updateNutritionPreview();
    updateConfidence();
    updateSourceIndicator();
  }

  function updatePortionDisplay() {
    var quantity = parseFloat(elements.quantityInput.value) || 0;
    var unit = elements.unitSelect.value;
    var grams = Math.round(quantity * (VF.nutrition.UNIT_CONVERSIONS[unit]?.toGrams || 1));
    elements.portionText.textContent = VF.nutrition.formatPortion(grams, unit);
    elements.portionDisplay.hidden = false;
  }

  function updateNutritionPreview() {
    var quantity = parseFloat(elements.quantityInput.value) || 0;
    var unit = elements.unitSelect.value;
    var grams = Math.round(quantity * (VF.nutrition.UNIT_CONVERSIONS[unit]?.toGrams || 1));

    var scaled = VF.nutrition.scaleNutrition(originalFood, grams);

    elements.previewCalories.textContent = scaled.calories;
    elements.previewProtein.textContent = scaled.macros.protein + 'g';
    elements.previewCarbs.textContent = scaled.macros.carbs + 'g';
    elements.previewFat.textContent = scaled.macros.fat + 'g';
  }

  function updateConfidence() {
    var confidence = currentFood.confidence || VF.ai.CONFIDENCE_LEVELS.MEDIUM;
    var label = VF.ai.getConfidenceLabel(confidence);
    var icon = VF.ai.getConfidenceIcon(confidence);
    var color = VF.ai.getConfidenceColor(confidence);

    elements.confidenceIcon.textContent = icon;
    elements.confidenceIcon.className = 'material-symbols-outlined ' + color + ' text-[20px]';
    elements.confidenceText.textContent = label;
    elements.confidenceText.className = 'font-label-lg text-label-lg ' + color;
    elements.confidenceSection.hidden = false;
  }

  function updateSourceIndicator() {
    elements.sourceIndicator.hidden = !isReplacement;
  }

  function openEditor() {
    elements.sheet.hidden = false;
    elements.scrim.hidden = false;
    requestAnimationFrame(function () {
      elements.sheet.classList.add('open');
      elements.scrim.classList.add('open');
    });
    VF.ui.haptics.select();
  }

  function closeEditor() {
    elements.sheet.classList.remove('open');
    elements.scrim.classList.remove('open');
    setTimeout(function () {
      elements.sheet.hidden = true;
      elements.scrim.hidden = true;
      try { sessionStorage.removeItem('vf.editingFood'); } catch (e) {}
      VF.ui.goBack('food_editor');
    }, 300);
    VF.ui.haptics.select();
  }

  function saveChanges() {
    var name = elements.foodNameInput.value.trim();
    var quantity = parseFloat(elements.quantityInput.value);
    var unit = elements.unitSelect.value;

    if (!name) {
      VF.ui.snackbar('Please enter a food name');
      elements.foodNameInput.focus();
      return;
    }

    if (!quantity || quantity <= 0) {
      VF.ui.snackbar('Please enter a valid quantity');
      elements.quantityInput.focus();
      return;
    }

    var grams = Math.round(quantity * (VF.nutrition.UNIT_CONVERSIONS[unit]?.toGrams || 1));
    var scaled = VF.nutrition.scaleNutrition(originalFood, grams);
    var portionStr = VF.nutrition.formatPortion(grams, unit);

    var updatedFood = {
      id: currentFood.id,
      name: name,
      portion: portionStr,
      portionGrams: grams,
      calories: scaled.calories,
      macros: scaled.macros,
      confidence: VF.ai.CONFIDENCE_LEVELS.HIGH,
      confidenceScore: 1.0,
      tags: currentFood.tags || [],
      userEdited: true,
      originalName: originalFood.name
    };

    VF.ui.haptics.confirm();
    VF.ui.announce('Food updated: ' + name);

    try {
      sessionStorage.setItem('vf.editedFood', JSON.stringify({
        food: updatedFood,
        isReplacement: isReplacement
      }));
    } catch (e) {}

    closeEditor();
  }

  function setupEventListeners() {
    elements.closeBtn.addEventListener('click', closeEditor);
    elements.scrim.addEventListener('click', closeEditor);
    elements.cancelBtn.addEventListener('click', closeEditor);
    elements.saveBtn.addEventListener('click', saveChanges);

    elements.quantityInput.addEventListener('input', function () {
      updatePortionDisplay();
      updateNutritionPreview();
    });

    elements.unitSelect.addEventListener('change', function () {
      updatePortionDisplay();
      updateNutritionPreview();
    });

    elements.qtyDecrease.addEventListener('click', function () {
      VF.ui.haptics.select();
      var val = parseFloat(elements.quantityInput.value) || 1;
      var step = val >= 10 ? 10 : (val >= 1 ? 1 : 0.5);
      var newVal = Math.max(0.1, val - step);
      elements.quantityInput.value = newVal;
      updatePortionDisplay();
      updateNutritionPreview();
    });

    elements.qtyIncrease.addEventListener('click', function () {
      VF.ui.haptics.select();
      var val = parseFloat(elements.quantityInput.value) || 1;
      var step = val >= 10 ? 10 : (val >= 1 ? 1 : 0.5);
      var newVal = Math.min(5000, val + step);
      elements.quantityInput.value = newVal;
      updatePortionDisplay();
      updateNutritionPreview();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') closeEditor();
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
<style>
.bottom-sheet {
transform: translateY(100%);
transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
}
.bottom-sheet.open {
transform: translateY(0);
}
.overlay {
opacity: 0;
pointer-events: none;
transition: opacity 0.3s ease;
}
.overlay.open {
opacity: 1;
pointer-events: auto;
}
.glass-overlay {
background: rgba(242, 244, 243, 0.92);
backdrop-filter: blur(24px);
-webkit-backdrop-filter: blur(24px);
}
.glass-panel {
background: rgba(248, 250, 249, 0.7);
backdrop-filter: blur(16px);
-webkit-backdrop-filter: blur(16px);
border: 1px solid rgba(255, 255, 255, 0.5);
box-shadow: 0 4px 24px rgba(15, 82, 56, 0.05);
}
@media (prefers-reduced-motion: reduce) {
.bottom-sheet { transition: none; transform: translateY(0); }
.overlay { transition: none; opacity: 1; }
}
</style>
</body></html>
