<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Text Input · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/ai_food.js"></script>
</head>
<!-- Text Input — Type-based AI food logging.
     Flow: input → processing → extraction preview → review -->
<body class="bg-surface min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">

  <!-- Input State -->
  <div id="state-input" class="flex flex-col flex-1">
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-stack-md mb-stack-sm tracking-tight">What did you eat?</h1>
    <p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Describe your meal and AI will estimate the nutrition.</p>
    <div class="glass-card rounded-xl p-4 mb-stack-lg">
      <textarea id="food-text" class="w-full bg-transparent border-none resize-none focus:ring-0 font-body-lg text-body-lg text-on-surface placeholder:text-outline" placeholder="Tell me what you ate..." rows="4" style="min-height:120px"></textarea>
    </div>
    <div class="mb-stack-lg">
      <p class="font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider mb-2">Examples</p>
      <div class="flex flex-col gap-2">
        <button type="button" class="example-btn text-left glass-card rounded-xl p-3 border border-outline-variant/20 hover:border-outline-variant/60 transition-colors">
          <p class="font-body-md text-body-md text-on-surface">"I had a chicken sandwich and a Coke."</p>
        </button>
        <button type="button" class="example-btn text-left glass-card rounded-xl p-3 border border-outline-variant/20 hover:border-outline-variant/60 transition-colors">
          <p class="font-body-md text-body-md text-on-surface">"Two eggs, two slices of toast and a banana."</p>
        </button>
        <button type="button" class="example-btn text-left glass-card rounded-xl p-3 border border-outline-variant/20 hover:border-outline-variant/60 transition-colors">
          <p class="font-body-md text-body-md text-on-surface">"Large green smoothie with spinach and protein powder."</p>
        </button>
      </div>
    </div>
  </div>

  <!-- Processing State -->
  <div id="state-processing" class="hidden flex-col items-center justify-center flex-1 text-center">
    <div class="w-20 h-20 rounded-full bg-primary-container/20 flex items-center justify-center mb-stack-lg">
      <span class="material-symbols-outlined text-primary text-4xl animate-spin" style="font-variation-settings:'FILL' 1;">auto_awesome</span>
    </div>
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mb-stack-sm tracking-tight">Analyzing your meal...</h1>
    <p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">Our AI is identifying foods and estimating nutrition.</p>
  </div>

  <!-- Extraction Preview State -->
  <div id="state-preview" class="hidden flex-col flex-1">
    <h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-stack-md mb-stack-sm tracking-tight">Looks like you had</h1>
    <p id="preview-text" class="font-body-md text-body-md text-on-surface-variant mb-stack-lg"></p>
    <div id="preview-items" class="flex flex-col gap-2 mb-stack-lg"></div>
    <div class="flex items-center justify-between bg-surface-container-low rounded-xl p-4 border border-outline-variant/20 mb-stack-lg">
      <span class="font-label-lg text-label-lg text-on-surface">Estimated total</span>
      <span id="preview-total" class="font-headline-lg-mobile text-headline-lg-mobile text-primary">0 kcal</span>
    </div>
  </div>

</main>

<div class="vf-footer" id="text-footer" style="display:none">
  <div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
  <div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe flex flex-col gap-3">
    <button id="text-analyze" class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20">
      <span class="material-symbols-outlined text-[20px]">auto_awesome</span> Analyze
    </button>
    <button id="text-review" class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20 hidden">
      <span class="material-symbols-outlined text-[20px]">visibility</span> Review &amp; Log
    </button>
    <button id="text-back" class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      Back
    </button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('text_input', { title: 'Text Input', allowCompleted: true });
    if (!state) return;

    var inputState = document.getElementById('state-input');
    var processingState = document.getElementById('state-processing');
    var previewState = document.getElementById('state-preview');
    var footer = document.getElementById('text-footer');
    var foodText = document.getElementById('food-text');
    var previewText = document.getElementById('preview-text');
    var previewItems = document.getElementById('preview-items');
    var previewTotal = document.getElementById('preview-total');
    var analyzeBtn = document.getElementById('text-analyze');
    var reviewBtn = document.getElementById('text-review');
    var backBtn = document.getElementById('text-back');
    var exampleBtns = document.querySelectorAll('.example-btn');
    var extraction = null;

    function showView(view) {
      inputState.classList.add('hidden');
      processingState.classList.add('hidden');
      previewState.classList.add('hidden');
      footer.style.display = '';
      analyzeBtn.classList.add('hidden');
      reviewBtn.classList.add('hidden');
      if (view === 'input') {
        inputState.classList.remove('hidden');
        analyzeBtn.classList.remove('hidden');
      } else if (view === 'processing') {
        processingState.classList.remove('hidden');
        footer.style.display = 'none';
      } else if (view === 'preview') {
        previewState.classList.remove('hidden');
        reviewBtn.classList.remove('hidden');
      }
    }

    function runExtraction() {
      var text = foodText.value.trim();
      if (!text) {
        VF.ui.haptics.warn();
        foodText.focus();
        return;
      }
      showView('processing');
      VF.ui.haptics.confirm();
      setTimeout(function () {
        extraction = VF.aiFood.estimateNutrition(text);
        previewText.textContent = '"' + text + '"';
        previewTotal.textContent = VF.ui.fmt(extraction.totalCalories) + ' kcal';
        previewItems.innerHTML = '';
        extraction.items.forEach(function (item) {
          var row = document.createElement('div');
          row.className = 'review-item flex items-center justify-between bg-surface-container-low rounded-xl p-3 border border-outline-variant/20';
          row.innerHTML = '<div class="text-left"><p class="font-label-lg text-label-lg text-on-surface">' + item.name + '</p><p class="font-body-md text-body-md text-on-surface-variant">' + item.serving + ' • ' + VF.ui.fmt(item.calories) + ' kcal</p></div><span class="material-symbols-outlined text-on-surface-variant text-[20px]">chevron_right</span>';
          previewItems.appendChild(row);
        });
        VF.aiFood.saveExtraction({ source: 'text', transcript: text, items: extraction.items, totalCalories: extraction.totalCalories });
        showView('preview');
        VF.ui.haptics.success();
      }, 1500);
    }

    var mode = VF.ui.qp('mode');
    if (mode === 'edit') {
      var prev = VF.aiFood.loadExtraction();
      if (prev && prev.transcript) foodText.value = prev.transcript;
    }

    exampleBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var p = btn.querySelector('p').textContent.replace(/"/g, '');
        foodText.value = p;
        foodText.focus();
        VF.ui.haptics.select();
      });
    });

    analyzeBtn.addEventListener('click', runExtraction);
    reviewBtn.addEventListener('click', function () {
      VF.ui.haptics.confirm();
      var returnTo = VF.ui.qp('returnTo') || '11_home.html';
      VF.ui.go('meal_confirm.html?returnTo=' + encodeURIComponent(returnTo));
    });
    backBtn.addEventListener('click', function () {
      if (previewState.classList.contains('hidden') === false) {
        showView('input');
      } else {
        VF.ui.goBack('text_input');
      }
    });

    /* Enter key to submit */
    foodText.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) {
        e.preventDefault();
        runExtraction();
      }
    });

    showView('input');
  });
</script>
</body></html>
