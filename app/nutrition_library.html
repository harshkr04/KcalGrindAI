<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Food Library · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<body class="bg-background text-on-background min-h-screen pb-24 pt-16 font-body-md">
<!-- TopAppBar -->
<header class="fixed top-0 w-full max-w-md mx-auto z-50 glass-effect">
<div class="flex justify-between items-center px-container-padding h-16">
<div class="w-8 h-8 rounded-full overflow-hidden flex-shrink-0 bg-surface-container-high border border-outline-variant/30">
<img alt="User Profile Photo" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAgN1AQF3so56aSt_v9ZQvfpVcKTwPrkrDXMliabA69t18t9yZJXPyu8DC1ppgAniFWLnRrMe9lDjep1N1BTFkpiqRN8jAcKNjxhji3Et2CZhzWEmxazutYbMTBaGsoqC8Sb-mGO3Z2fJ7-xcqMsEO9L7vdNB492mWdw6maNEx0vAYTB-ViggySmDU_tl0CzhlvHGPqUQk-WMiA1SIXSulCGYhZwoUywr65e9qQqrrfRj_jLzwOsyAq">
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile font-bold text-primary text-center flex-1">Food Library</h1>
<button class="w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-container-high/50 transition-colors text-primary active:scale-95 duration-200">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">notifications</span>
</button>
</div>
</header>
<main class="w-full max-w-md mx-auto px-margin-mobile md:px-margin-tablet pt-stack-md flex flex-col gap-stack-lg">
<!-- Search & Filter Section -->
<section class="flex flex-col gap-stack-md">
<!-- Search Bar -->
<div class="relative w-full">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant">search</span>
</div>
<input id="search-input" class="w-full pl-12 pr-4 py-3 bg-surface-container-low border-none rounded-t-lg rounded-b-sm font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant focus:ring-2 focus:ring-primary focus:bg-surface transition-colors" placeholder="Search foods, recipes..." type="text">
</div>
<!-- Categories / Chips -->
<div class="flex gap-unit overflow-x-auto no-scrollbar pb-2">
<button class="flex-shrink-0 px-4 py-1.5 rounded-full font-label-lg text-label-lg bg-primary-container text-on-primary-container chip-active transition-transform" data-category="all">All</button>
<button class="flex-shrink-0 px-4 py-1.5 rounded-full font-label-lg text-label-lg bg-surface border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-98" data-category="protein">Protein</button>
<button class="flex-shrink-0 px-4 py-1.5 rounded-full font-label-lg text-label-lg bg-surface border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-98" data-category="carbs">Carbs</button>
<button class="flex-shrink-0 px-4 py-1.5 rounded-full font-label-lg text-label-lg bg-surface border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-98" data-category="vegetables">Vegetables</button>
<button class="flex-shrink-0 px-4 py-1.5 rounded-full font-label-lg text-label-lg bg-surface border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-98" data-category="fruits">Fruits</button>
<button class="flex-shrink-0 px-4 py-1.5 rounded-full font-label-lg text-label-lg bg-surface border border-outline-variant text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-98" data-category="fats">Fats</button>
</div>
</section>
<!-- Food Items Grid -->
<section>
<h2 class="font-title-lg text-title-lg text-on-surface mb-stack-sm" id="section-title">All Foods</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="foods-grid">
</div>
</section>
</main>
<!-- BottomNavBar -->
<div class="fixed bottom-0 w-full max-w-md mx-auto z-40 bg-surface-bright pb-safe">
<div class="flex gap-2 border-t border-surface-variant px-4 pb-3 pt-2">
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-on-surface-variant" href="11_home.html">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">home</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Home</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-on-surface-variant" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">book</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Diary</p>
</a>
<div class="flex-1"></div>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-on-surface-variant" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">bar_chart</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Insights</p>
</a>
<a class="flex flex-1 flex-col items-center justify-end gap-1 text-on-surface-variant" href="#">
<div class="flex h-8 items-center justify-center">
<span class="material-symbols-outlined">person</span>
</div>
<p class="text-xs font-medium leading-normal tracking-[0.015em]">Profile</p>
</a>
</div>
</div>
<script>
(function () {
  'use strict';

  var foods = [
    { name: 'Chicken Breast', category: 'protein', calories: 165, protein: 31, carbs: 0, fat: 3.6, portion: '100g', icon: 'poultry' },
    { name: 'Salmon', category: 'protein', calories: 208, protein: 20, carbs: 0, fat: 13, portion: '100g', icon: 'set_meal' },
    { name: 'Eggs', category: 'protein', calories: 155, protein: 13, carbs: 1.1, fat: 11, portion: '100g (2 large)', icon: 'egg' },
    { name: 'Greek Yogurt', category: 'protein', calories: 59, protein: 10, carbs: 3.6, fat: 0.4, portion: '100g', icon: 'icecream' },
    { name: 'Tofu', category: 'protein', calories: 76, protein: 8, carbs: 1.9, fat: 4.8, portion: '100g', icon: 'restaurant' },
    { name: 'Brown Rice', category: 'carbs', calories: 111, protein: 2.6, carbs: 23, fat: 0.9, portion: '100g cooked', icon: 'grain' },
    { name: 'Quinoa', category: 'carbs', calories: 120, protein: 4.4, carbs: 22, fat: 1.9, portion: '100g cooked', icon: 'grain' },
    { name: 'Sweet Potato', category: 'carbs', calories: 86, protein: 1.6, carbs: 20, fat: 0.1, portion: '100g', icon: 'local_grocery_store' },
    { name: 'Oats', category: 'carbs', calories: 389, protein: 16.9, carbs: 66, fat: 6.9, portion: '100g dry', icon: 'breakfast_dining' },
    { name: 'Banana', category: 'fruits', calories: 89, protein: 1.1, carbs: 23, fat: 0.3, portion: '100g', icon: 'spa' },
    { name: 'Apple', category: 'fruits', calories: 52, protein: 0.3, carbs: 14, fat: 0.2, portion: '100g', icon: 'apple' },
    { name: 'Blueberries', category: 'fruits', calories: 57, protein: 0.7, carbs: 14, fat: 0.3, portion: '100g', icon: 'circle' },
    { name: 'Broccoli', category: 'vegetables', calories: 34, protein: 2.8, carbs: 7, fat: 0.4, portion: '100g', icon: 'eco' },
    { name: 'Spinach', category: 'vegetables', calories: 23, protein: 2.9, carbs: 3.6, fat: 0.4, portion: '100g', icon: 'eco' },
    { name: 'Avocado', category: 'fats', calories: 160, protein: 2, carbs: 8.5, fat: 14.7, portion: '100g', icon: 'avocado' },
    { name: 'Almonds', category: 'fats', calories: 579, protein: 21, carbs: 22, fat: 50, portion: '100g', icon: 'park' },
    { name: 'Olive Oil', category: 'fats', calories: 884, protein: 0, carbs: 0, fat: 100, portion: '100g (11 tbsp)', icon: 'water_drop' }
  ];

  var currentCategory = 'all';
  var searchTerm = '';

  var searchInput = document.getElementById('search-input');
  var foodsGrid = document.getElementById('foods-grid');
  var sectionTitle = document.getElementById('section-title');
  var categoryBtns = document.querySelectorAll('[data-category]');

  function renderFoods() {
    var filtered = foods.filter(function (food) {
      var matchesCategory = currentCategory === 'all' || food.category === currentCategory;
      var matchesSearch = food.name.toLowerCase().includes(searchTerm.toLowerCase());
      return matchesCategory && matchesSearch;
    });

    foodsGrid.innerHTML = '';
    filtered.forEach(function (food) {
      var card = document.createElement('div');
      card.className = 'bg-surface-container-lowest rounded-xl overflow-hidden border border-outline-variant/30 hover:shadow-md transition-shadow cursor-pointer flex';
      card.innerHTML =
        '<div class="w-24 h-24 relative flex-shrink-0 bg-surface-container-high flex items-center justify-center">' +
        '<span class="material-symbols-outlined text-on-surface-variant text-3xl">' + food.icon + '</span>' +
        '</div>' +
        '<div class="p-4 flex flex-col justify-center flex-1 min-w-0">' +
        '<span class="font-label-sm text-label-sm text-secondary mb-1">' + capitalize(food.category) + '</span>' +
        '<h3 class="font-title-lg text-[18px] leading-[24px] text-on-surface mb-1 font-medium truncate">' + food.name + '</h3>' +
        '<p class="font-body-md text-[13px] text-on-surface-variant">' + food.calories + ' kcal · ' + food.protein + 'g protein · ' + food.carbs + 'g carbs · ' + food.fat + 'g fat per ' + food.portion + '</p>' +
        '</div>';
      card.addEventListener('click', function () {
        VF.ui.haptics.select();
        VF.ui.snackbar(food.name + ' - ' + food.calories + ' kcal per ' + food.portion);
      });
      foodsGrid.appendChild(card);
    });

    if (filtered.length === 0) {
      foodsGrid.innerHTML =
        '<div class="col-span-full text-center py-8">' +
        '<span class="material-symbols-outlined text-on-surface-variant text-4xl mb-2 block">search_off</span>' +
        '<p class="font-body-md text-on-surface-variant">No foods found matching your criteria.</p>' +
        '</div>';
    }
  }

  function capitalize(str) {
    return str.charAt(0).toUpperCase() + str.slice(1);
  }

  function setCategory(cat) {
    currentCategory = cat;
    categoryBtns.forEach(function (btn) {
      var isActive = btn.dataset.category === cat;
      btn.classList.toggle('bg-primary-container', isActive);
      btn.classList.toggle('text-on-primary-container', isActive);
      btn.classList.toggle('bg-surface', !isActive);
      btn.classList.toggle('border', !isActive);
      btn.classList.toggle('border-outline-variant', !isActive);
      btn.classList.toggle('text-on-surface-variant', !isActive);
    });
    var catLabel = cat === 'all' ? 'All Foods' : capitalize(cat) + ' Foods';
    sectionTitle.textContent = catLabel;
    renderFoods();
  }

  function init() {
    searchInput.addEventListener('input', function () {
      searchTerm = this.value;
      renderFoods();
    });

    categoryBtns.forEach(function (btn) {
      btn.addEventListener('click', function () {
        VF.ui.haptics.select();
        setCategory(this.dataset.category);
      });
    });

    renderFoods();
    VF.ui.announce('Food library opened');
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body></html>
