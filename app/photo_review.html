<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Review Photo · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Roboto+Flex:wght@400;500;600&display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<body class="bg-black text-white min-h-screen flex flex-col overflow-hidden relative">
<!-- Full-screen Photo Display -->
<div id="photo-container" class="absolute inset-0 z-0 flex items-center justify-center bg-black">
<img id="review-image" src="" alt="Captured photo for review" class="max-w-full max-h-full object-contain">
</div>

<!-- Top Bar -->
<header class="absolute top-0 left-0 right-0 z-10 flex items-center justify-between p-4 pt-safe-top h-16 bg-gradient-to-b from-black/60 to-transparent">
<button id="close-review-btn" class="w-12 h-12 rounded-full bg-white/10 backdrop-blur-sm flex items-center justify-center text-white active:scale-95 transition-transform border border-white/20" aria-label="Close and go back">
<span class="material-symbols-outlined">close</span>
</button>
<h2 class="font-title-lg text-title-lg text-white">Review Photo</h2>
<div class="w-12 h-12" aria-hidden="true"></div>
</header>

<!-- Bottom Actions -->
<div class="absolute bottom-0 left-0 right-0 z-10 pb-safe pb-6 pt-8 px-container-padding bg-gradient-to-t from-black/80 via-black/40 to-transparent flex flex-col items-center gap-stack-md">
<p class="font-body-md text-body-md text-white/70 text-center px-4 max-w-md">
Looks good? Send to AI for analysis, or retake.
</p>

<div class="flex items-center justify-center gap-4 w-full max-w-md">
<!-- Retake Button -->
<button id="retake-btn" class="flex-1 max-w-[160px] bg-white/10 backdrop-blur-sm text-white font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 border border-white/20 hover:bg-white/20 transition-colors active:scale-[0.98]" aria-label="Retake photo">
<span class="material-symbols-outlined">refresh</span>
Retake
</button>

<!-- Use Photo / Send to AI Button -->
<button id="use-photo-btn" class="flex-1 max-w-[160px] bg-gradient-to-br from-primary to-primary-container text-on-primary font-label-lg text-label-lg rounded-full py-4 px-6 flex items-center justify-center gap-2 shadow-lg shadow-primary/30 hover:shadow-xl hover:from-primary/90 hover:to-primary-container/90 transition-all active:scale-[0.98]" aria-label="Send to AI for analysis">
<span class="material-symbols-outlined">auto_awesome</span>
Analyze
</button>
</div>
</div>

<script>
(function () {
  'use strict';

  var photoUrl = null;

  function init() {
    var stored = null;
    try {
      stored = sessionStorage.getItem('vf.capturedPhoto');
    } catch (e) {
      console.warn('Could not read from sessionStorage');
    }

    if (!stored) {
      VF.ui.snackbar('No photo found. Returning to camera.');
      setTimeout(function () { VF.ui.go('camera.html'); }, 1500);
      return;
    }

    photoUrl = stored;
    var img = document.getElementById('review-image');
    img.src = photoUrl;
    img.onload = function () {
      VF.ui.announce('Photo ready for review');
    };
    img.onerror = function () {
      VF.ui.snackbar('Failed to load photo. Returning to camera.');
      setTimeout(function () { VF.ui.go('camera.html'); }, 1500);
    };

    document.getElementById('close-review-btn').addEventListener('click', goBack);
    document.getElementById('retake-btn').addEventListener('click', retake);
    document.getElementById('use-photo-btn').addEventListener('click', usePhoto);

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') goBack();
    });
  }

  function retake() {
    VF.ui.haptics.select();
    try {
      sessionStorage.removeItem('vf.capturedPhoto');
    } catch (e) {}
    VF.ui.go('camera.html');
  }

  function usePhoto() {
    VF.ui.haptics.confirm();
    VF.ui.announce('Sending photo to AI for analysis');

    var btn = document.getElementById('use-photo-btn');
    btn.disabled = true;
    btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span>Analyzing...';

    fetch(photoUrl)
      .then(function (res) { return res.blob(); })
      .then(function (blob) {
        try {
          sessionStorage.setItem('vf.capturedPhotoBlob', JSON.stringify({
            type: blob.type,
            size: blob.size
          }));
        } catch (e) {}
        VF.ui.go('ai_analyzing.html');
      })
      .catch(function () {
        VF.ui.go('ai_analyzing.html');
      });
  }

  function goBack() {
    VF.ui.haptics.select();
    VF.ui.goBack('photo_review');
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
<style>
@media (prefers-reduced-motion: reduce) {
  .animate-spin { animation: none; }
}
</style>
</body></html>
