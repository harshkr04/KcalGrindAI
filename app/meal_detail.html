<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Meal Detail · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
<script src="shared/diary.js"></script>
</head>
<!-- Meal Detail — View, edit, delete, duplicate, move, add food, save as meal. -->
<body class="bg-surface min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">
  <div class="flex items-center justify-between mb-stack-md">
    <div>
      <h1 id="meal-name" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface tracking-tight">Meal</h1>
      <p id="meal-meta" class="font-body-md text-body-md text-on-surface-variant"></p>
    </div>
  </div>

  <!-- Nutrition Summary -->
  <div class="grid grid-cols-4 gap-2 mb-stack-lg">
    <div class="bg-surface-container-low rounded-xl p-3 text-center border border-outline-variant/20">
      <span id="meal-cal" class="font-headline-lg-mobile text-headline-lg-mobile text-primary block">0</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant">kcal</span>
    </div>
    <div class="bg-surface-container-low rounded-xl p-3 text-center border border-outline-variant/20">
      <span id="meal-prot" class="font-headline-lg-mobile text-headline-lg-mobile text-secondary block">0g</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant">Protein</span>
    </div>
    <div class="bg-surface-container-low rounded-xl p-3 text-center border border-outline-variant/20">
      <span id="meal-carbs" class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface block">0g</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant">Carbs</span>
    </div>
    <div class="bg-surface-container-low rounded-xl p-3 text-center border border-outline-variant/20">
      <span id="meal-fat" class="font-headline-lg-mobile text-headline-lg-mobile text-tertiary block">0g</span>
      <span class="font-label-sm text-label-sm text-on-surface-variant">Fat</span>
    </div>
  </div>

  <!-- Food Items -->
  <div id="meal-items" class="flex flex-col gap-2 mb-stack-lg"></div>

  <!-- Actions -->
  <div class="flex flex-col gap-2 mt-auto">
    <button id="add-food-to-meal" class="w-full py-3 rounded-full border-[1.5px] border-dashed border-outline-variant text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[20px]">add</span> Add Food
    </button>
    <button id="save-as-meal" class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      <span class="material-symbols-outlined text-[20px]">bookmark</span> Save as Meal
    </button>
  </div>
</main>

<div class="vf-footer">
  <div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
  <div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe flex flex-col gap-3">
    <button id="edit-meal" class="vf-cta w-full py-3 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20">
      <span class="material-symbols-outlined text-[20px]">edit</span> Edit Meal
    </button>
    <button id="back-btn" class="w-full py-3 rounded-full border-[1.5px] border-outline-variant/30 text-on-surface-variant font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-surface-container-high active:scale-95 transition-all">
      Back
    </button>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('meal_detail', { title: 'Meal Detail', allowCompleted: true });
    if (!state) return;

    var mealId = VF.ui.qp('id');
    var meal = VF.diary.getMealById(mealId);
    if (!meal) { VF.ui.go('diary.html'); return; }

    var nameEl = document.getElementById('meal-name');
    var metaEl = document.getElementById('meal-meta');
    var calEl = document.getElementById('meal-cal');
    var protEl = document.getElementById('meal-prot');
    var carbsEl = document.getElementById('meal-carbs');
    var fatEl = document.getElementById('meal-fat');
    var itemsEl = document.getElementById('meal-items');
    var addBtn = document.getElementById('add-food-to-meal');
    var saveAsBtn = document.getElementById('save-as-meal');
    var editBtn = document.getElementById('edit-meal');
    var backBtn = document.getElementById('back-btn');

    nameEl.textContent = VF.diary.MEAL_TYPES.find(function (m) { return m.id === meal.mealType; }) ? VF.diary.MEAL_TYPES.find(function (m) { return m.id === meal.mealType; }).label : 'Meal';
    metaEl.textContent = new Date(meal.loggedAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    function render() {
      var totalCal = 0, totalProt = 0, totalCarbs = 0, totalFat = 0;
      itemsEl.innerHTML = '';
      (meal.items || []).forEach(function (item, idx) {
        totalCal += item.calories || 0;
        totalProt += item.protein || 0;
        totalCarbs += item.carbs || 0;
        totalFat += item.fat || 0;
        var row = document.createElement('div');
        row.className = 'review-item bg-surface-container-low rounded-xl p-3 border border-outline-variant/20';
        row.innerHTML =
          '<div class="flex items-center justify-between">' +
            '<div class="flex-1 min-w-0">' +
              '<h4 class="font-title-lg text-title-lg text-on-surface truncate">' + item.name + '</h4>' +
              '<p class="font-body-md text-body-md text-on-surface-variant">' + item.serving + ' · ' + VF.ui.fmt(item.calories) + ' kcal</p>' +
            '</div>' +
            '<div class="flex gap-2">' +
              '<button class="item-action text-on-surface-variant hover:text-primary transition-colors" data-action="edit" data-idx="' + idx + '" aria-label="Edit"><span class="material-symbols-outlined text-[18px]">edit</span></button>' +
              '<button class="item-action text-on-surface-variant hover:text-error transition-colors" data-action="delete" data-idx="' + idx + '" aria-label="Delete"><span class="material-symbols-outlined text-[18px]">delete</span></button>' +
              '<button class="item-action text-on-surface-variant hover:text-primary transition-colors" data-action="duplicate" data-idx="' + idx + '" aria-label="Duplicate"><span class="material-symbols-outlined text-[18px]">content_copy</span></button>' +
            '</div>' +
          '</div>';
        row.querySelectorAll('.item-action').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var action = btn.dataset.action;
            var i = parseInt(btn.dataset.idx, 10);
            if (action === 'delete') {
              if (confirm('Remove this food?')) {
                meal.items.splice(i, 1);
                VF.diary.updateMeal(meal.id, { items: meal.items });
                VF.ui.snackbar('Food removed', 'info');
                render();
              }
            } else if (action === 'duplicate') {
              meal.items.push(Object.assign({}, meal.items[i], { id: VF.diary.uid() }));
              VF.diary.updateMeal(meal.id, { items: meal.items });
              VF.ui.haptics.select();
              render();
            } else if (action === 'edit') {
              VF.ui.haptics.select();
              VF.ui.go('food_edit.html?id=' + meal.id + '&idx=' + i);
            }
          });
        });
        itemsEl.appendChild(row);
      });
      calEl.textContent = VF.ui.fmt(totalCal);
      protEl.textContent = totalProt.toFixed(1) + 'g';
      carbsEl.textContent = totalCarbs.toFixed(1) + 'g';
      fatEl.textContent = totalFat.toFixed(1) + 'g';
    }

    render();

    addBtn.addEventListener('click', function () {
      VF.ui.haptics.select();
      VF.ui.go('food_search.html?mealType=' + meal.mealType + '&returnTo=meal_detail.html&id=' + meal.id);
    });
    saveAsBtn.addEventListener('click', function () {
      VF.ui.haptics.select();
      var name = prompt('Save meal as:', nameEl.textContent);
      if (name) {
        VF.diary.saveMealAsTemplate(name, meal.items, meal.mealType);
        VF.ui.snackbar('Meal saved', 'check_circle');
      }
    });
    editBtn.addEventListener('click', function () {
      VF.ui.haptics.select();
      VF.ui.go('food_edit.html?id=' + meal.id);
    });
    backBtn.addEventListener('click', function () { VF.ui.haptics.select(); VF.ui.goBack('meal_detail'); });
  });
</script>
</body></html>
