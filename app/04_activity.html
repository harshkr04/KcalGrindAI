<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Activity level · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<!-- Screen 4 — Activity Level. Single-select card list driven by
     VF.nutrition.ACTIVITY. Uses the same vf-selectable / vf-selected pattern
     as goal_selection (02_goal.html). -->
<body class="bg-surface min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-surface mt-stack-md mb-stack-sm tracking-tight">
    How active are you?
  </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">This helps us estimate how much energy you use each day. Pick the closest match.</p>
<div aria-label="Activity level" class="flex flex-col gap-stack-md w-full" id="activities" role="radiogroup"></div>
</main>
<div class="vf-footer">
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
<div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe">
<button class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20" disabled id="continue">
      Continue
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-3" id="hint">Choose your activity level to continue.</p>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('activity', { title: 'How active are you?' });
    if (!state) return;
    if (VF.ui.qp('resumed') === '1') VF.ui.snackbar('Picked up where you left off.', 'restore');

    var ORDER = ['sedentary', 'light', 'moderate', 'very', 'extreme'];
    var list = document.getElementById('activities');
    var cta = document.getElementById('continue');
    var hint = document.getElementById('hint');
    var selected = state.activity;

    ORDER.forEach(function (id) {
      var a = VF.nutrition.ACTIVITY[id];
      var card = document.createElement('button');
      card.type = 'button';
      card.className = 'vf-selectable rounded-xl p-4 flex items-center gap-stack-md text-left bg-surface-container-low border border-outline-variant/30 hover:border-outline-variant/60 transition-colors';
      card.setAttribute('role', 'radio');
      card.setAttribute('aria-checked', 'false');
      card.dataset.activity = id;
      card.innerHTML =
        '<div class="w-12 h-12 rounded-full bg-secondary-container text-on-secondary-container flex items-center justify-center flex-shrink-0 transition-colors duration-300" data-icon-wrap>' +
          '<span class="material-symbols-outlined text-[28px]" style="font-variation-settings:\'FILL\' 1;">' + a.icon + '</span>' +
        '</div>' +
        '<div class="flex-1 min-w-0">' +
          '<h2 class="font-title-lg text-[16px] leading-tight text-on-surface">' + a.label + '</h2>' +
          '<p class="font-body-md text-body-md text-on-surface-variant leading-snug mt-1">' + a.blurb + '</p>' +
        '</div>' +
        '<div class="w-6 h-6 rounded-full border-2 border-outline-variant flex items-center justify-center flex-shrink-0 transition-colors duration-200" data-radio>' +
          '<span class="material-symbols-outlined text-[16px] text-on-primary opacity-0 transition-opacity" style="font-variation-settings:\'FILL\' 1;" data-check>check</span>' +
        '</div>';
      card.addEventListener('click', function () { choose(id, true); });
      list.appendChild(card);
    });

    function choose(id, fromTap) {
      selected = id;
      Array.prototype.forEach.call(list.children, function (card) {
        var on = card.dataset.activity === id;
        card.classList.toggle('vf-selected', on);
        card.setAttribute('aria-checked', String(on));
        var wrap = card.querySelector('[data-icon-wrap]');
        wrap.className = 'w-12 h-12 rounded-full flex items-center justify-center flex-shrink-0 transition-colors duration-300 ' +
          (on ? 'bg-primary text-on-primary' : 'bg-secondary-container text-on-secondary-container');
        var radio = card.querySelector('[data-radio]');
        radio.className = 'w-6 h-6 rounded-full flex items-center justify-center flex-shrink-0 transition-colors duration-200 border-2 ' +
          (on ? 'border-primary bg-primary' : 'border-outline-variant');
        card.querySelector('[data-check]').style.opacity = on ? '1' : '0';
        if (on && fromTap) { card.classList.remove('vf-pop'); void card.offsetWidth; card.classList.add('vf-pop'); }
      });
      VF.store.patch({ activity: id });
      VF.ui.gate(cta, true);
      hint.textContent = VF.nutrition.ACTIVITY[id].label + ' selected.';
      if (fromTap) { VF.ui.haptics.select(); VF.ui.announce(VF.nutrition.ACTIVITY[id].label + ' selected'); }
    }

    if (selected && VF.nutrition.ACTIVITY[selected]) choose(selected, false);
    else VF.ui.gate(cta, false, 'Choose your activity level');

    cta.addEventListener('click', function () {
      if (!selected) return;
      VF.ui.haptics.confirm();
      VF.ui.advance('activity');
    });
  });
</script>
</body></html>
