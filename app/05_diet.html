<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<meta content="#f8faf9" name="theme-color">
<title>Diet preferences · Vitality</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script src="shared/theme.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Roboto+Flex:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="shared/vitality.css" rel="stylesheet">
<script src="shared/store.js"></script>
<script src="shared/nutrition.js"></script>
<script src="shared/ui.js"></script>
</head>
<!-- Screen 5 — Diet Preferences. Multi-select chip list driven by
     VF.nutrition.DIETS. Uses chip-base/chip-selected/chip-unselected from
     vitality.css. Skip button enabled (optional step). -->
<body class="bg-mesh min-h-screen w-full flex flex-col font-body-lg text-on-background overflow-x-hidden antialiased pb-32">
<div id="vf-header"></div>
<main class="flex-1 flex flex-col px-container-padding pb-stack-lg relative z-10 max-w-md mx-auto w-full vf-screen">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-on-background mt-stack-md mb-stack-sm tracking-tight">
    Any diet preferences?
  </h1>
<p class="font-body-md text-body-md text-on-surface-variant mb-stack-lg">Pick as many as apply, or skip this step entirely. We use these to shape your macro split.</p>
<div aria-label="Diet preferences" class="flex flex-wrap gap-3 w-full" id="diets" role="group"></div>
</main>
<div class="vf-footer">
<div class="absolute inset-0 bg-gradient-to-t from-surface via-surface/90 to-transparent pointer-events-none"></div>
<div class="relative max-w-md mx-auto px-container-padding pt-8 pb-8 pb-safe">
<button class="vf-cta w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg flex items-center justify-center gap-2 hover:bg-tertiary/90 active:scale-95 transition-all shadow-md shadow-tertiary/20" disabled id="continue">
      Continue
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
<p class="font-body-md text-body-md text-on-surface-variant text-center mt-3" id="hint">Select a preference or skip this step.</p>
</div>
</div>
<script>
  document.addEventListener('DOMContentLoaded', function () {
    var state = VF.ui.initScreen('diet', {
      title: 'Any diet preferences?',
      skip: true,
      onSkip: function () {
        VF.store.patch({ dietSkipped: true });
        VF.ui.haptics.select();
        VF.ui.advance('diet');
      }
    });
    if (!state) return;

    var container = document.getElementById('diets');
    var cta = document.getElementById('continue');
    var hint = document.getElementById('hint');
    var selected = (state.diet && state.diet.length) ? state.diet.slice() : [];

    VF.nutrition.DIETS.forEach(function (d) {
      var chip = document.createElement('button');
      chip.type = 'button';
      chip.className = 'chip-base chip-unselected rounded-full border-[1.5px] px-5 py-3 font-label-lg text-label-lg flex items-center gap-2';
      chip.dataset.diet = d.id;
      chip.setAttribute('role', 'checkbox');
      chip.setAttribute('aria-checked', 'false');
      chip.innerHTML =
        '<span class="material-symbols-outlined text-[18px] hidden" data-check style="font-variation-settings:\'FILL\' 1;">check</span>' +
        '<span>' + d.label + '</span>';
      chip.addEventListener('click', function () { toggle(d, chip); });
      container.appendChild(chip);
    });

    function toggle(d, chip) {
      VF.ui.haptics.select();
      if (d.exclusive) {
        // "No preference" — deselect everything else
        selected = selected.indexOf(d.id) > -1 ? [] : [d.id];
      } else {
        // Remove "No preference" if it was selected
        var noneIdx = selected.indexOf('none');
        if (noneIdx > -1) selected.splice(noneIdx, 1);
        var idx = selected.indexOf(d.id);
        if (idx > -1) selected.splice(idx, 1);
        else selected.push(d.id);
      }
      syncUI();
      VF.store.patch({ diet: selected, dietSkipped: false });
    }

    function syncUI() {
      Array.prototype.forEach.call(container.children, function (chip) {
        var on = selected.indexOf(chip.dataset.diet) > -1;
        chip.className = 'chip-base rounded-full border-[1.5px] px-5 py-3 font-label-lg text-label-lg flex items-center gap-2 ' +
          (on ? 'chip-selected' : 'chip-unselected');
        chip.setAttribute('aria-checked', String(on));
        chip.querySelector('[data-check]').classList.toggle('hidden', !on);
      });
      var ok = selected.length > 0;
      VF.ui.gate(cta, ok);
      hint.textContent = ok
        ? selected.length + ' selected. You can change these later.'
        : 'Select a preference or skip this step.';
    }

    syncUI();

    cta.addEventListener('click', function () {
      if (!selected.length) return;
      VF.ui.haptics.confirm();
      VF.ui.advance('diet');
    });
  });
</script>
</body></html>
