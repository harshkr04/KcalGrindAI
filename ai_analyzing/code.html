<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>NutriVitality AI - Analyzing</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Flex:wght@400;500;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-container": "#b0f1cc",
                        "inverse-primary": "#95d4b3",
                        "surface-container-high": "#e6e9e8",
                        "primary-container": "#2d6a4f",
                        "surface-bright": "#f8faf9",
                        "on-primary-fixed": "#002114",
                        "outline": "#707973",
                        "on-error": "#ffffff",
                        "primary": "#0f5238",
                        "on-background": "#191c1c",
                        "on-surface-variant": "#404943",
                        "surface-container-highest": "#e1e3e2",
                        "on-error-container": "#93000a",
                        "surface": "#f8faf9",
                        "on-tertiary-fixed": "#000866",
                        "inverse-surface": "#2e3131",
                        "on-tertiary-fixed-variant": "#303b9f",
                        "secondary-fixed-dim": "#94d4b1",
                        "on-primary-fixed-variant": "#0e5138",
                        "tertiary-fixed": "#dfe0ff",
                        "tertiary": "#313c9f",
                        "on-secondary-fixed-variant": "#0c5136",
                        "on-primary-container": "#a8e7c5",
                        "surface-tint": "#2c694e",
                        "primary-fixed": "#b1f0ce",
                        "surface-dim": "#d8dada",
                        "on-tertiary": "#ffffff",
                        "error": "#ba1a1a",
                        "secondary": "#2b694d",
                        "background": "#f8faf9",
                        "tertiary-fixed-dim": "#bdc2ff",
                        "tertiary-container": "#4a55b9",
                        "outline-variant": "#bfc9c1",
                        "on-primary": "#ffffff",
                        "on-secondary": "#ffffff",
                        "error-container": "#ffdad6",
                        "surface-container": "#eceeed",
                        "secondary-fixed": "#b0f1cc",
                        "primary-fixed-dim": "#95d4b3",
                        "on-surface": "#191c1c",
                        "on-secondary-fixed": "#002113",
                        "surface-container-low": "#f2f4f3",
                        "surface-variant": "#e1e3e2",
                        "on-tertiary-container": "#d5d7ff",
                        "on-secondary-container": "#327053",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#eff1f0"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "container-padding": "20px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "margin-tablet": "24px",
                        "stack-lg": "32px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "headline-lg-mobile": ["Roboto Flex"],
                        "body-md": ["Inter"],
                        "title-lg": ["Inter"],
                        "headline-lg": ["Roboto Flex"],
                        "label-sm": ["Inter"],
                        "display-lg": ["Roboto Flex"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "label-lg": ["14px", { "lineHeight": "20px", "letterSpacing": "0.1px", "fontWeight": "500" }],
                        "headline-lg-mobile": ["28px", { "lineHeight": "36px", "fontWeight": "600" }],
                        "body-md": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "title-lg": ["22px", { "lineHeight": "28px", "fontWeight": "500" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "fontWeight": "600" }],
                        "label-sm": ["11px", { "lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500" }],

                        "body-lg": ["16px", { "lineHeight": "24px", "letterSpacing": "0.5px", "fontWeight": "400" }]

                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        
        .ai-pulse::before {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: var(--tw-colors-tertiary-fixed);
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
        
        .ai-pulse::after {
            content: '';
            position: absolute;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: var(--tw-colors-tertiary-fixed-dim);
            border-radius: 50%;
            z-index: -1;
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
            animation-delay: 1s;
        }

        .glass-orb {
            background: radial-gradient(circle at 30% 30%, rgba(255,255,255,0.8), rgba(255,255,255,0.2) 60%, transparent 100%);
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.05), inset 10px 10px 20px rgba(255,255,255,0.8);
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col relative overflow-hidden">
<!-- Atmospheric Background -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-1/4 -right-1/4 w-[150%] h-[150%] bg-gradient-to-br from-tertiary-fixed/30 via-transparent to-primary-fixed/20 blur-[100px] rounded-full opacity-60"></div>
</div>
<!-- Main Content Canvas - Transactional Screen so Nav is Suppressed -->
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-tablet z-10 relative h-screen">
<!-- Orb Section -->
<div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center mb-stack-lg ai-pulse">
<!-- Central Glass Orb -->
<div class="glass-orb w-48 h-48 md:w-64 md:h-64 rounded-full flex items-center justify-center border border-white/40 z-10 animate-spin" style="animation-duration: 8s; animation-timing-function: linear;">
<span class="material-symbols-outlined text-tertiary text-[64px] opacity-80" data-weight="fill" style="font-variation-settings: 'FILL' 1;">
                    auto_awesome
                </span>
</div>
<!-- Sparkles -->
<div class="absolute inset-0 pointer-events-none">
<span class="material-symbols-outlined text-secondary absolute top-10 left-10 animate-bounce delay-75">temp_preferences_custom</span>
<span class="material-symbols-outlined text-primary absolute bottom-12 right-12 animate-bounce delay-150">nutrition</span>
<span class="material-symbols-outlined text-tertiary-container absolute top-1/2 right-4 animate-bounce delay-300">spa</span>
</div>
</div>
<!-- Status Text -->
<div class="text-center mb-stack-md w-full max-w-sm">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm animate-pulse">
                Identifying ingredients...
            </h1>
<!-- Progress Bar -->
<div class="w-full h-2 bg-surface-container-highest rounded-full overflow-hidden mt-unit">
<div class="h-full bg-tertiary rounded-full animate-[progress_3s_ease-in-out_infinite]" style="width: 65%;"></div>
</div>
<style>
                @keyframes progress {
                    0% { width: 40%; }
                    50% { width: 75%; }
                    100% { width: 60%; }
                }
            </style>
</div>
<!-- Checklist -->
<div class="w-full max-w-sm bg-surface/60 backdrop-blur-md rounded-xl border border-white/50 p-stack-md shadow-sm">
<ul class="flex flex-col gap-stack-sm">
<li class="flex items-center gap-gutter font-body-lg text-body-lg text-on-surface">
<span class="material-symbols-outlined text-primary" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span>Image received</span>
</li>
<li class="flex items-center gap-gutter font-body-lg text-body-lg text-on-surface">
<span class="material-symbols-outlined text-tertiary animate-spin" style="animation-duration: 2s;">sync</span>
<span class="font-medium text-tertiary">Analyzing composition</span>
</li>
<li class="flex items-center gap-gutter font-body-lg text-body-lg text-outline">
<span class="material-symbols-outlined text-outline">radio_button_unchecked</span>
<span>Calculating macros</span>
</li>
</ul>
</div>
</main>
</body></html>
