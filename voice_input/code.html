<!DOCTYPE html><html class="light" lang="en"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Voice Logging - NutriVitality AI</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

                        "surface": "#f8faf9",

                        "on-tertiary-fixed-variant": "#303b9f",
                        "secondary-fixed-dim": "#94d4b1",

                    },
                    "borderRadius": {

                        "lg": "0.5rem",

                    "spacing": {
                        "unit": "4px",
                        "container-padding": "20px",
                        "gutter": "16px",
                        "margin-mobile": "16px",
                        "stack-sm": "8px",
                        "margin-tablet": "24px",
                        "stack-lg": "32px",
                        "stack-md": "16px"
                    },
                    "fontFamily": {
                        "label-lg": ["Inter"],
                        "headline-lg-mobile": ["Roboto Flex"],
                        "body-md": ["Inter"],

<style>
        .glass-panel {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .pulse-ring {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.8; }
            50% { transform: scale(1.5); opacity: 0; }
            100% { transform: scale(0.9); opacity: 0; }
        }
        .bg-gradient-blur {
            background: radial-gradient(circle at 50% 50%, rgba(176, 241, 204, 0.4) 0%, rgba(248, 250, 249, 1) 100%);
        }
    </style>
</head>
<body class="bg-background text-on-background h-screen w-screen overflow-hidden flex flex-col bg-gradient-blur relative">
<!-- Ambient Background Elements -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute top-[-10%] left-[-10%] w-[50%] h-[50%] bg-primary-fixed-dim/30 rounded-full blur-[100px] mix-blend-multiply"></div>
<div class="absolute bottom-[-10%] right-[-10%] w-[60%] h-[60%] bg-secondary-fixed/20 rounded-full blur-[120px] mix-blend-multiply"></div>
</div>
<!-- Top App Bar (Suppressed for focused task, but kept close button) -->
<header class="fixed top-0 w-full z-50 flex items-center justify-between px-margin-mobile h-16 pt-safe">
<button aria-label="Close" class="p-2 rounded-full hover:bg-surface-variant/50 transition-colors text-on-surface-variant z-10">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">close</span>
</button>
<div class="flex-1 text-center font-title-lg text-title-lg text-primary absolute left-0 w-full pointer-events-none">
            NutriVitality AI
        </div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 flex flex-col items-center justify-center z-10 px-margin-mobile md:px-margin-tablet w-full max-w-[840px] mx-auto relative pt-16 pb-24">
<!-- Status Indicator -->
<div class="mb-stack-lg text-center">
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-primary mb-stack-sm animate-pulse">Listening...</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Speak naturally about your meal</p>
</div>
<!-- Voice Visualization / Mic Button -->
<div class="relative flex items-center justify-center w-48 h-48 mb-stack-lg">
<!-- Pulsing Rings -->
<div class="absolute inset-0 rounded-full border-4 border-tertiary-container/30 pulse-ring"></div>
<div class="absolute inset-2 rounded-full border-4 border-primary/20 pulse-ring" style="animation-delay: 0.5s;"></div>
<div class="absolute inset-4 rounded-full border-2 border-secondary-container/50 pulse-ring" style="animation-delay: 1s;"></div>
<!-- Mic Core -->
<div class="relative z-10 w-24 h-24 rounded-full bg-primary flex items-center justify-center shadow-[0_0_40px_rgba(45,106,79,0.3)]">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">mic</span>
</div>
</div>
<!-- Live Transcription Glass Card -->
<div class="glass-panel w-full max-w-md rounded-xl p-container-padding mb-stack-lg shadow-lg relative overflow-hidden">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-tertiary"></div>
<p class="font-body-lg text-body-lg text-on-surface italic leading-relaxed min-h-[4rem]">
                "I just had a large green smoothie with spinach and protein powder..."
            </p>
<div class="flex justify-end mt-stack-sm">
<div class="flex items-center space-x-1">
<div class="w-1.5 h-1.5 bg-tertiary rounded-full animate-bounce"></div>
<div class="w-1.5 h-1.5 bg-tertiary rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
<div class="w-1.5 h-1.5 bg-tertiary rounded-full animate-bounce" style="animation-delay: 0.4s"></div>
</div>
</div>
</div>
</main>
<!-- Bottom Action Area -->
<div class="fixed bottom-0 left-0 w-full z-50 p-margin-mobile pb-safe bg-gradient-to-t from-background via-background/90 to-transparent flex justify-center">
<button class="w-full max-w-md bg-tertiary text-on-tertiary font-label-lg text-label-lg rounded-full py-4 px-8 shadow-lg hover:bg-tertiary-container transition-colors active:scale-95 duration-200 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">check_circle</span>
            Done
        </button>
</div>
</body></html>
