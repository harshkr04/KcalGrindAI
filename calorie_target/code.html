<body class="bg-background text-on-background antialiased min-h-screen flex flex-col items-center justify-center relative overflow-hidden">

<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-2">Creating your personalized target...</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">
We're calculating your optimal nutrition targets based on your profile.
</p>
<div class="mt-6">
<div class="h-2 w-[50%] bg-surface-container-highest rounded-full overflow-hidden mx-auto">

<script>
document.addEventListener('DOMContentLoaded', () => {
const backButton = document.getElementById('back-button');
const mainContent = document.getElementById('main-content');
const footerActions = document.getElementById('footer-actions');
const calculatingState = document.getElementById('calculating-state');

// State management
let state = 'calculating'; // calculating, success, customize
let recommendedTargets = {};
let customTargets = {};

// Initialize the app
function init() {
setupEventListeners();
// Simulate calculation process
simulateCalculation();
}

function setupEventListeners() {
backButton.addEventListener('click', () => {
window.history.back();
});
}

function simulateCalculation() {
// Show progress bar animation
const progressBar = document.getElementById('progress-bar');
let width = 0;
const interval = setInterval(() => {
if (width >= 100) {
clearInterval(interval);
// Calculation complete - show success state
showSuccessState();
} else {
width += Math.random() * 10 + 5;
progressBar.style.width = Math.min(width, 100) + '%';
}
}, 100);

// Auto-advance after 3 seconds (simulate calculation time)
setTimeout(() => {
// In a real app, this would be when calculation actually finishes
showSuccessState();
}, 3000);
}

function showSuccessState() {
state = 'success';
// Generate recommended targets based on typical values (in real app, this would come from API)
const activityLevel = localStorage.getItem('selectedActivityLevel') || 'moderately_active';
// Base calculation - simplified for demo
let baseCalories = 2000;
if (activityLevel === 'sedentary') baseCalories = 1800;
else if (activityLevel === 'lightly_active') baseCalories = 2000;
else if (activityLevel === 'moderately_active') baseCalories = 2200;
else if (activityLevel === 'very_active') baseCalories = 2400;
else if (activityLevel === 'extremely_active') baseCalories = 2600;

// Macronutrient split (40% carbs, 30% protein, 30% fat)
recommendedTargets = {
calories: Math.round(baseCalories),
protein: Math.round((baseCalories * 0.3) / 4), // 4 cal/g protein
carbs: Math.round((baseCalories * 0.4) / 4),   // 4 cal/g carbs
fat: Math.round((baseCalories * 0.3) / 9),     // 9 cal/g fat
water: 2.5 // Liters
};

// Custom targets start as recommended
customTargets = {...recommendedTargets};

// Render success state
renderSuccessState();
}

function renderSuccessState() {
// Clear main content
mainContent.innerHTML = `
<div class="text-center">
<div class="inline-flex items-center justify-center gap-2 px-3 py-1 rounded-full bg-tertiary-container/20 border border-tertiary/10 mb-3">
<span class="material-symbols-outlined text-tertiary text-sm" style="font-variation-settings: 'FILL' 1;">auto_awesome</span>
<span class="font-label-sm text-label-sm text-tertiary">AI Calibrated</span>
</div>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile md:font-headline-lg md:text-headline-lg text-on-background mb-2">Your daily target</h1>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto">
These targets are estimates based on the information you provided. You can change them later.
</p>
</div>
<!-- Central Display -->
<section class="flex-grow flex flex-col items-center justify-center py-stack-lg relative w-full">
<!-- Glass Ring Container -->
<div class="relative w-64 h-64 md:w-80 md:h-80 rounded-full glass-ring flex flex-col items-center justify-center p-6 mx-auto">
<!-- Decorative Progress SVG Ring -->
<svg class="absolute inset-0 w-full h-full transform -rotate-90 pointer-events-none" viewBox="0 0 100 100">
<circle class="text-surface-variant opacity-30" cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-width="2"></circle>
<circle class="text-primary" cx="50" cy="50" fill="none" r="46" stroke="currentColor" stroke-dasharray="289" stroke-dashoffset="0" stroke-linecap="round" stroke-width="4"></circle>
</svg>
<div class="text-center relative z-10 flex flex-col items-center">
<span class="font-display-lg text-display-lg text-primary tracking-tight leading-none mb-1">${recommendedTargets.calories}</span>
<span class="font-title-lg text-title-lg text-on-surface-variant">kcal / day</span>
</div>
<!-- Macro Breakdown mini-pills -->
<div class="absolute bottom-6 left-0 w-full flex justify-center gap-3 px-4">
<div class="flex items-center gap-1 bg-surface/80 rounded-full px-2 py-1 shadow-sm">
<div class="w-2 h-2 rounded-full bg-secondary"></div>
<span class="font-label-sm text-label-sm text-on-surface">${recommendedTargets.protein}g P</span>
</div>
<div class="flex items-center gap-1 bg-surface/80 rounded-full px-2 py-1 shadow-sm">
<div class="w-2 h-2 rounded-full bg-tertiary"></div>
<span class="font-label-sm text-label-sm text-on-surface">${recommendedTargets.carbs}g C</span>
</div>
<div class="flex items-center gap-1 bg-surface/80 rounded-full px-2 py-1 shadow-sm">
<div class="w-2 h-2 rounded-full bg-primary-fixed-dim"></div>
<span class="font-label-sm text-label-sm text-on-surface">${recommendedTargets.fat}g F</span>
</div>
</div>
</div>
<!-- Context Card -->
<div class="mt-stack-lg w-full bg-surface-container-low rounded-xl p-4 border border-outline-variant/20 shadow-sm">
<div class="flex items-start gap-3">
<div class="mt-1 w-8 h-8 rounded-full bg-primary-container/20 flex items-center justify-center flex-shrink-0">
<span class="material-symbols-outlined text-primary text-sm" style="font-variation-settings: 'FILL' 1;">insights</span>
</div>
<div>
<h3 class="font-label-lg text-label-lg text-on-surface mb-1">AI recommendation</h3>
<p class="font-body-md text-body-md text-on-surface-variant leading-relaxed">
Your target is designed to support gradual progress toward your goal.
</p>
</div>
</div>
</div>
</section>
`;
// Update footer actions
footerActions.innerHTML = `
<div class="space-y-4">
<button id="use-targets-button" class="w-full py-4 rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-md shadow-primary/20 hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center gap-2">
Use these targets
<span class="material-symbols-outlined text-lg">check</span>
</button>
<button id="customize-button" class="w-full py-4 rounded-full bg-tertiary text-on-tertiary font-label-lg text-label-lg shadow-md shadow-tertiary/20 hover:bg-tertiary/90 active:scale-95 transition-all flex items-center justify-center gap-2">
Customize targets
<span class="material-symbols-outlined text-lg">tune</span>
</button>
</div>
`;
// Add event listeners
document.getElementById('use-targets-button').addEventListener('click', useTargets);
document.getElementById('customize-button').addEventListener('click', showCustomizeState);
}

function useTargets() {
// Save targets and proceed to permissions
localStorage.setItem('recommendedCalories', recommendedTargets.calories);
localStorage.setItem('recommendedProtein', recommendedTargets.protein);
localStorage.setItem('recommendedCarbs', recommendedTargets.carbs);
localStorage.setItem('recommendedFat', recommendedTargets.fat);
localStorage.setItem('recommendedWater', recommendedTargets.water);
// For now, use recommended as custom until changed
localStorage.setItem('customCalories', customTargets.calories);
localStorage.setItem('customProtein', customTargets.protein);
localStorage.setItem('customCarbs', customTargets.carbs);
localStorage.setItem('customFat', customTargets.fat);
localStorage.setItem('customWater', customTargets.water);
// Navigate to permissions
window.location.href = '../permission_setup/code.html';
}

function showCustomizeState() {
state = 'customize';
// Render customize state
renderCustomizeState();
}

function renderCustomizeState() {
// Clear main content
mainContent.innerHTML = `
<form id="targets-form">
<div class="space-y-6">
<h2 class="font-title-lg text-title-lg text-on-surface mb-4">Customize Targets</h2>
<p class="font-body-md text-body-md text-on-surface-variant max-w-sm mx-auto mb-6">
Adjust your daily nutrition targets below. Protein, carbs, and fat should align with your total calorie goal.
</p>
<!-- Calories Input -->
<div>
<label for="calories-input" class="input-label">Daily Calories</label>
<input type="number" id="calories-input" class="input-field" min="800" max="5000" step="10" value="${customTargets.calories}">
<div class="macro-relationship-info">
Protein: ${customTargets.protein}g (${Math.round(customTargets.protein * 4)} cal) •
Carbs: ${customTargets.carbs}g (${Math.round(customTargets.carbs * 4)} cal) •
Fat: ${customTargets.fat}g (${Math.round(customTargets.fat * 9)} cal)
</div>
<div id="calories-error" class="validation-error"></div>
</div>
<!-- Protein Input -->
<div>
<label for="protein-input" class="input-label">Protein</label>
<input type="number" id="protein-input" class="input-field" min="20" max="300" step="1" value="${customTargets.protein}">
<div class="macro-relationship-info">
${Math.round(customTargets.protein * 4)} calories from protein
</div>
<div id="protein-error" class="validation-error"></div>
</div>
<!-- Carbs Input -->
<div>
<label for="carbs-input" class="input-label">Carbohydrates</label>
<input type="number" id="carbs-input" class="input-field" min="20" max="500" step="1" value="${customTargets.carbs}">
<div class="macro-relationship-info">
${Math.round(customTargets.carbs * 4)} calories from carbs
</div>
<div id="carbs-error" class="validation-error"></div>
</div>
<!-- Fat Input -->
<div>
<label for="fat-input" class="input-label">Fat</label>
<input type="number" id="fat-input" class="input-field" min="10" max="200" step="1" value="${customTargets.fat}">
<div class="macro-relationship-info">
${Math.round(customTargets.fat * 9)} calories from fat
</div>
<div id="fat-error" class="validation-error"></div>
</div>
<!-- Water Input -->
<div>
<label for="water-input" class="input-label">Water</label>
<input type="number" id="water-input" class="input-field" min="1" max="10" step="0.1" value="${customTargets.water}">
<div class="macro-relationship-info">
${customTargets.water} liters daily
</div>
<div id="water-error" class="validation-error"></div>
</div>
<div class="mt-6">
<button id="reset-button" class="w-full py-3 rounded-lg border border-outline-variant/30 bg-surface-container-low text-on-surface-variant hover:bg-surface-container transition-colors flex items-center justify-center gap-2">
Reset to recommended
<span class="material-symbols-outlined text-lg">refresh</span>
</button>
</div>
</div>
</form>
`;
// Update footer actions
footerActions.innerHTML = `
<div class="space-y-4">
<button id="save-targets-button" class="w-full py-4 rounded-full bg-primary text-on-primary font-label-lg text-label-lg shadow-md shadow-primary/20 hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center gap-2">
Save targets
<span class="material-symbols-outlined text-lg">save</span>
</button>
</div>
`;
// Add event listeners
document.getElementById('targets-form').addEventListener('input', validateTargets);
document.getElementById('reset-button').addEventListener('click', resetToRecommended);
document.getElementById('save-targets-button').addEventListener('click', saveCustomTargets);
// Initialize validation
validateTargets();
}

function validateTargets() {
const calories = parseInt(document.getElementById('calories-input').value) || 0;
const protein = parseInt(document.getElementById('protein-input').value) || 0;
const carbs = parseInt(document.getElementById('carbs-input').value) || 0;
const fat = parseInt(document.getElementById('fat-input').value) || 0;
const water = parseFloat(document.getElementById('water-input').value) || 0;

// Calculate calories from macros
const proteinCal = protein * 4;
const carbsCal = carbs * 4;
const fatCal = fat * 9;
const totalFromMacros = proteinCal + carbsCal + fatCal;

// Validation thresholds
const calorieDiff = Math.abs(calories - totalFromMacros);
const isValid = calorieDiff <= 100; // Allow ±100 cal difference

// Update custom targets object
customTargets = {calories, protein, carbs, fat, water};

// Show/hide validation errors
document.getElementById('calories-error').textContent = isValid ? '' :
`Calories (${calories}) should match macro total (${totalFromMacros}) ±100 cal`;

// Enable/disable save button
const saveButton = document.getElementById('save-targets-button');
if (saveButton) {
saveButton.disabled = !isValid;
}
}

function resetToRecommended() {
document.getElementById('calories-input').value = recommendedTargets.calories;
document.getElementById('protein-input').value = recommendedTargets.protein;
document.getElementById('carbs-input').value = recommendedTargets.carbs;
document.getElementById('fat-input').value = recommendedTargets.fat;
document.getElementById('water-input').value = recommendedTargets.water;
validateTargets();
}

function saveCustomTargets() {
// Save both recommended and custom targets
localStorage.setItem('recommendedCalories', recommendedTargets.calories);
localStorage.setItem('recommendedProtein', recommendedTargets.protein);
localStorage.setItem('recommendedCarbs', recommendedTargets.carbs);
localStorage.setItem('recommendedFat', recommendedTargets.fat);
localStorage.setItem('recommendedWater', recommendedTargets.water);

localStorage.setItem('customCalories', customTargets.calories);
localStorage.setItem('customProtein', customTargets.protein);
localStorage.setItem('customCarbs', customTargets.carbs);
localStorage.setItem('customFat', customTargets.fat);
localStorage.setItem('customWater', customTargets.water);

// Show success feedback
const saveButton = document.getElementById('save-targets-button');
const originalText = saveButton.innerHTML;
saveButton.innerHTML = '<span>Saved!</span><span class="material-symbols-outlined text-lg">check</span>';
saveButton.classList.add('bg-primary/90');

setTimeout(() => {
saveButton.innerHTML = originalText;
saveButton.classList.remove('bg-primary/90');
// Navigate to permissions after brief delay
