# Project-wide Gradle settings.

# Specifies the JVM arguments used for the Gradle Daemon.
# Increased memory allocation to prevent OutOfMemoryError during dex merging and compilation.
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m -XX:+UseG1GC

# Enable AndroidX support
android.useAndroidX=true

# Enable Kotlin code style
kotlin.code.style=official

# Enable parallel build and caching for performance
org.gradle.parallel=true
org.gradle.caching=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
