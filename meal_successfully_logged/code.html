<script>
        // Simple JS to generate more 'sparkles' for the background
        document.addEventListener('DOMContentLoaded', () => {
            const container = document.getElementById('sparkles-container');
            const colors = ['bg-primary', 'bg-secondary', 'bg-tertiary'];
            
            for(let i=0; i<15; i++) {
                const sparkle = document.createElement('div');
                const size = Math.random() * 8 + 4; // 4 to 12px
                const color = colors[Math.floor(Math.random() * colors.length)];
                const left = Math.random() * 100;
                const top = Math.random() * 100;
                const delay = Math.random() * 2;
                const duration = Math.random() * 2 + 2;
                
                sparkle.className = `absolute rounded-full ${color} opacity-20 sparkle-anim`;
                sparkle.style.width = `${size}px`;
                sparkle.style.height = `${size}px`;
                sparkle.style.left = `${left}%`;
                sparkle.style.top = `${top}%`;
                sparkle.style.animationDelay = `${delay}s`;
                sparkle.style.animationDuration = `${duration}s`;
                
                container.appendChild(sparkle);
            }
        });
    </script>
