<style>

<!-- Main Content Canvas (No Nav Shell for transactional/loading state) -->
<main class="z-10 flex flex-col items-center justify-center w-full max-w-md px-margin-mobile">
<!-- Glassmorphism Container -->
<div class="glass-panel rounded-xl p-8 w-full flex flex-col items-center animate-float">
<!-- AI Icon Container -->
<div class="relative w-32 h-32 flex items-center justify-center mb-6">
<!-- Pulsing Background Rings -->
<div class="absolute inset-0 rounded-full bg-secondary-container opacity-30 animate-pulse-slow"></div>
<div class="absolute inset-4 rounded-full bg-primary-container opacity-20 animate-pulse-slow" style="animation-delay: 0.5s;"></div>
<!-- Core Icon -->
<div class="relative z-10 w-16 h-16 rounded-full bg-primary flex items-center justify-center shadow-lg shadow-primary/20">
<span class="material-symbols-outlined text-on-primary text-4xl" style="font-variation-settings: 'FILL' 1;">
                        auto_awesome
                    </span>
</div>
</div>
<!-- Text Content -->
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary mb-2 text-center">Analyzing your meal...</h1>
<p class="font-body-md text-body-md text-on-surface-variant text-center mb-8 max-w-[250px]">
                Our AI is breaking down the nutritional components of your photo.
            </p>
<!-- Progress Indicators -->
<div class="w-full space-y-4">
<!-- Bar 1 -->
<div>
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant mb-1">
<span>Identifying Ingredients</span>
<span class="text-primary">Done</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-primary w-full rounded-full transition-all duration-1000"></div>
</div>
</div>
<!-- Bar 2 -->
<div>
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant mb-1">
<span>Calculating Macros</span>
<span class="text-tertiary animate-pulse">Processing</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden">
<div class="h-full bg-tertiary w-3/4 rounded-full shimmer-bg animate-shimmer"></div>
</div>
</div>
<!-- Bar 3 -->
<div>
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant mb-1 opacity-50">
<span>Generating Insights</span>
<span>Pending</span>
</div>
<div class="h-2 w-full bg-surface-container-highest rounded-full overflow-hidden opacity-50">
<div class="h-full bg-surface-variant w-0 rounded-full"></div>
</div>
</div>
</div>

</main>
<!-- Simulated redirect script for effect -->
<script>
        setTimeout(() => {
            // In a real app, this would route to the results page
            const progressBar = document.querySelector('.bg-tertiary');
            if(progressBar) {
                progressBar.style.width = '100%';
                progressBar.classList.remove('shimmer-bg', 'animate-shimmer');
                progressBar.classList.add('bg-primary');
                progressBar.previousElementSibling.querySelector('span:last-child').textContent = 'Done';
                progressBar.previousElementSibling.querySelector('span:last-child').classList.replace('text-tertiary', 'text-primary');
                progressBar.previousElementSibling.querySelector('span:last-child').classList.remove('animate-pulse');
            }
            
            const pendingBar = document.querySelectorAll('.opacity-50')[0];
            if(pendingBar) {
                pendingBar.classList.remove('opacity-50');
                const pBar = pendingBar.nextElementSibling;
                pBar.classList.remove('opacity-50');
                pBar.firstElementChild.classList.add('bg-tertiary', 'shimmer-bg', 'animate-shimmer');
                pBar.firstElementChild.style.width = '40%';
                pendingBar.querySelector('span:last-child').textContent = 'Processing';
                pendingBar.querySelector('span:last-child').classList.add('text-tertiary', 'animate-pulse');
            }

        }, 2000);
    </script>
